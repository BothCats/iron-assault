  /* =========================================================
     PLAYER
     ========================================================= */
  class Player {
    constructor(x, y){
      this.x = x;
      this.y = y;
      this.w = 24;
      this.h = 46;
      this.vx = 0;
      this.vy = 0;
      this.facing = 1;
      this.onGround = true;
      this.crouching = false;
      this.hp = 4;
      this.maxHp = 4;
      this.weapon = 'rifle';
      this.arsenal = ['rifle'];
      this.weaponTiers = { rifle: 0, machine: 0, spread: 0, laser: 0 };
      this.burstQueue = [];
      this.cooldown = 0;
      this.invuln = 2.2;
      this.dead = false;
      this.deathTimer = 0;
      this.deathCause = '';
      this.aimAngle = 0;
      this.animTime = rand(0, 10);
      this.runPhase = 0;
      this.recoil = 0;
      this.muzzle = 0;
      this.coyote = 0;
      this.jumpBuffer = 0;
      this.dropTimer = 0;
      this.onPlatform = false;
      this.standingPlatform = null;
      this.wasAirborne = false;
      this.landImpact = 0;
      this.jumpHeld = false;
      this.recoilOffset = 0;
      this.dashTimer = 0;
      this.dashCooldown = 0;
      this.dashDir = 1;
      this.dashTrailTimer = 0;
    }

    get hurtbox(){
      const h = this.crouching ? 31 : 44;
      return { x: this.x - 10, y: this.y - h, w: 20, h };
    }
    get centerY(){ return this.y - (this.crouching ? 17 : 25); }

    selectWeapon(id, game){
      if(!this.arsenal.includes(id) || this.weapon === id) return false;
      this.weapon = id;
      this.burstQueue.length = 0;
      this.cooldown = Math.min(this.cooldown, .08);
      sound.sfx('ui');
      if(game) game.particles.add({
        type: 'ring', x: this.x, y: this.y - 24, r: 8,
        color: WEAPONS[id].color, life: .28, maxLife: .28, gravity: 0
      });
      return true;
    }

    cycleWeapon(game){
      const order = ['rifle', 'machine', 'spread', 'laser'];
      const owned = order.filter(w => this.arsenal.includes(w));
      if(owned.length < 2) return false;
      const idx = Math.max(0, owned.indexOf(this.weapon));
      return this.selectWeapon(owned[(idx + 1) % owned.length], game);
    }

    resetAt(x, y){
      this.x = x;
      this.y = y;
      this.vx = 0;
      this.vy = 0;
      this.facing = 1;
      this.onGround = true;
      this.crouching = false;
      this.hp = this.maxHp;
      this.weapon = 'rifle';
      this.arsenal = ['rifle'];
      this.weaponTiers = { rifle: 0, machine: 0, spread: 0, laser: 0 };
      this.burstQueue.length = 0;
      this.cooldown = 0;
      this.invuln = 2.6;
      this.dead = false;
      this.deathTimer = 0;
      this.coyote = 0;
      this.jumpBuffer = 0;
      this.dropTimer = 0;
      this.onPlatform = false;
      this.standingPlatform = null;
      this.aimAngle = 0;
      this.recoil = 0;
      this.muzzle = 0;
      this.dashTimer = 0;
      this.dashCooldown = 0;
      this.dashDir = 1;
      this.dashTrailTimer = 0;
    }

    getMuzzle(){
      const shoulderY = this.crouching ? -23 : -33;
      const sx = this.x + this.facing * 3;
      const sy = this.y + shoulderY;
      return {
        x: sx + Math.cos(this.aimAngle) * 34,
        y: sy + Math.sin(this.aimAngle) * 34,
        sx, sy
      };
    }

    getWeaponTier(id = this.weapon){
      return this.weaponTiers[id] || 0;
    }

    getMuzzleAt(angle){
      const shoulderY = this.crouching ? -23 : -33;
      const sx = this.x + this.facing * 3;
      const sy = this.y + shoulderY;
      return {
        x: sx + Math.cos(angle) * 34,
        y: sy + Math.sin(angle) * 34,
        sx, sy
      };
    }

    emitWeaponVolley(game, weapon, angle, tier, visual = false){
      const spec = WEAPONS[weapon];
      let count = spec.count;
      let damage = spec.damage;
      let radius = spec.radius;
      let pierce = spec.pierce;
      if(weapon === 'spread'){
        if(tier === 1){ count = 6; damage *= .9; radius *= .9; }
        else if(tier === 2){ count = 7; damage *= .85; radius *= .85; }
        else if(tier >= 3){ count = 5; damage *= .65; }
      }else if(weapon === 'laser'){
        // L caps at a double shot. Its niche is stripping shields, not raw burst.
        if(tier >= 3){ damage *= 1.2; radius *= 1.2; }
        else if(tier >= 2){ damage *= 1.1; radius *= 1.1; }
      }
      const shotSpec = { ...spec, damage, radius, pierce };
      const muzzle = this.getMuzzleAt(angle);
      for(let i = 0; i < count; i++){
        let spread = 0;
        if(count > 1) spread = (i - (count - 1) / 2) * spec.spread;
        else if(weapon === 'machine') spread = rand(-spec.spread, spec.spread);
        else if(weapon === 'rifle') spread = rand(-.012, .012);
        const a = angle + spread;
        game.playerBullets.push(new PlayerBullet(muzzle.x, muzzle.y, a, shotSpec, i === Math.floor(count / 2)));
      }
      if(visual){
        this.muzzle = Math.max(this.muzzle, .055);
        game.particles.muzzle(muzzle.x, muzzle.y, angle, spec.color, weapon === 'spread' ? 1.1 : .82);
      }
    }

    fireWeapon(game){
      const spec = WEAPONS[this.weapon];
      if(this.cooldown > 0 || this.dead) return;
      const tier = this.getWeaponTier();
      let cd = spec.cooldown;
      if(this.weapon === 'machine') cd /= 1 + tier * .1;
      else if(this.weapon === 'laser' && tier >= 1) cd = .65;
      this.cooldown = cd;
      const angle = this.aimAngle;
      this.emitWeaponVolley(game, this.weapon, angle, tier, false);
      this.muzzle = .07;
      this.recoil = 1;
      this.recoilOffset = 3;
      const muzzle = this.getMuzzleAt(angle);
      game.particles.muzzle(muzzle.x, muzzle.y, angle, spec.color, this.weapon === 'spread' ? 1.25 : .9);
      game.particles.casing(muzzle.sx, muzzle.sy + 3, this.facing);
      game.shake = Math.max(game.shake, spec.shake);
      sound.sfx(spec.sfx);
      if(this.weapon === 'spread') game.shake = Math.max(game.shake, 2.4);
      if(this.weapon === 'spread' && tier >= 3){
        this.burstQueue.push({ t: .075, weapon: this.weapon, angle, tier });
      }else if(this.weapon === 'laser' && tier >= 1){
        // Double shot at every tier; tier 3 only adds thickness/damage.
        this.burstQueue.push({ t: .055, weapon: this.weapon, angle, tier });
      }
    }

    update(dt, game, allowControl){
      if(this.dead){
        this.deathTimer -= dt;
        return;
      }
      this.animTime += dt;
      this.invuln = Math.max(0, this.invuln - dt);
      this.cooldown = Math.max(0, this.cooldown - dt);
      this.muzzle = Math.max(0, this.muzzle - dt);
      this.recoil = Math.max(0, this.recoil - dt * 13);
      if(this.burstQueue.length){
        for(let i = this.burstQueue.length - 1; i >= 0; i--){
          const b = this.burstQueue[i];
          b.t -= dt;
          if(b.t <= 0){
            this.emitWeaponVolley(game, b.weapon, b.angle, b.tier, true);
            this.burstQueue.splice(i, 1);
          }
        }
      }
      this.jumpBuffer = Math.max(0, this.jumpBuffer - dt);
      this.dropTimer = Math.max(0, this.dropTimer - dt);
      this.landImpact = Math.max(0, this.landImpact - dt * 4);
      this.dashTimer = Math.max(0, this.dashTimer - dt);
      this.dashCooldown = Math.max(0, this.dashCooldown - dt);

      const wasGrounded = this.onGround;
      if(this.onGround) this.coyote = .11;
      else this.coyote = Math.max(0, this.coyote - dt);

      let mx = 0;
      const up = allowControl && input.isDown('up');
      const down = allowControl && input.isDown('down');
      const jumpHeld = allowControl && input.isDown('jump');
      this.jumpHeld = jumpHeld;
      if(allowControl){
        mx = input.axisX();
        if(mx !== 0) this.facing = mx;
        this.crouching = this.onGround && down && !up;
        const slots = ['rifle', 'machine', 'spread', 'laser'];
        for(let i = 0; i < slots.length; i++){
          if(input.wasPressed('weapon' + (i + 1)) && this.arsenal.includes(slots[i])){
            this.selectWeapon(slots[i], game);
          }
        }
        if(input.wasPressed('swap')) this.cycleWeapon(game);
        if(input.wasPressed('jump')) this.jumpBuffer = .13;
        if(input.wasPressed('dash') && this.dashCooldown <= 0 && this.dashTimer <= 0){
          this.dashDir = mx !== 0 ? mx : this.facing;
          this.facing = this.dashDir;
          this.dashTimer = .16;
          this.dashCooldown = .68;
          this.dashTrailTimer = 0;
          this.crouching = false;
          this.invuln = Math.max(this.invuln, .24);
          if(!this.onGround) this.vy *= .15;
          sound.sfx('dash');
          game.shake = Math.max(game.shake, 1.5);
          game.particles.dust(this.x, this.y, -this.dashDir, 7);
        }
      }else{
        this.crouching = false;
      }

      // Aim direction
      let aimX, aimY;
      if(up && !down){
        aimX = mx;
        aimY = -1;
        if(aimX === 0) aimY = -1;
      }else if(down && !up){
        if(this.onGround){
          aimX = this.facing;
          aimY = 0;
        }else{
          aimX = mx;
          aimY = 1;
        }
      }else{
        aimX = this.facing;
        aimY = 0;
      }
      const aim = Math.atan2(aimY, aimX === 0 ? (aimY === 0 ? this.facing : 0) : aimX);
      this.aimAngle = angleLerp(this.aimAngle, aim, Math.min(1, dt * 24));
      if(allowControl && (input.wasPressed('fire') || input.isDown('fire'))){
        this.fireWeapon(game);
      }

      // Drop through a one-way platform
      if(allowControl && this.jumpBuffer > 0 && this.onGround && this.onPlatform && down && !up){
        this.dropTimer = .22;
        this.onGround = false;
        this.coyote = 0;
        this.jumpBuffer = 0;
        this.y += 2;
        this.vy = 80;
        game.particles.dust(this.x, this.y, 0, 4);
      }else if(allowControl && this.jumpBuffer > 0 && (this.onGround || this.coyote > 0)){
        this.vy = -900;
        this.onGround = false;
        this.onPlatform = false;
        this.coyote = 0;
        this.jumpBuffer = 0;
        this.crouching = false;
        sound.sfx('jump');
        game.particles.dust(this.x, this.y, 0, 6);
      }

      // Horizontal movement / dash burst
      const targetSpeed = this.crouching ? 74 : 305;
      const accel = this.onGround ? 2350 : 1250;
      if(this.dashTimer > 0){
        this.vx = this.dashDir * 565;
        this.dashTrailTimer -= dt;
        if(this.dashTrailTimer <= 0){
          this.dashTrailTimer = .028;
          game.particles.add({
            type: 'smoke', x: this.x - this.dashDir * rand(2, 14), y: this.y - rand(8, 40),
            vx: -this.dashDir * rand(35, 80), vy: rand(-12, 12), gravity: -4,
            life: rand(.16, .3), color: '#3d8b7d', r: rand(4, 8), grow: 13, drag: 1.5
          });
          if(Math.random() < .55){
            game.particles.spark(this.x - this.dashDir * 9, this.y - rand(9, 38), '#83efd5', 95, .18, this.dashDir > 0 ? Math.PI : 0, 1.2);
          }
        }
      }else if(mx !== 0 && allowControl){
        const target = mx * targetSpeed;
        const rate = Math.abs(target - this.vx) < accel * dt ? 1 : accel * dt / Math.max(.001, Math.abs(target - this.vx));
        this.vx = lerp(this.vx, target, rate);
      }else{
        const drag = this.onGround ? 2600 : 520;
        const amount = drag * dt;
        if(Math.abs(this.vx) <= amount) this.vx = 0;
        else this.vx -= sign(this.vx) * amount;
      }

      // Updrafts: a rising air column carries the player toward high decks.
      let inUpdraft = false;
      if(game.stage.updrafts){
        for(const u of game.stage.updrafts){
          if(this.x > u.x && this.x < u.x + u.w && this.y > u.top && this.y <= (u.bottom || GROUND_Y)){
            inUpdraft = true;
            break;
          }
        }
      }
      this.inUpdraft = inUpdraft;
      if(inUpdraft){
        this.vy = Math.min(this.vy, -270);
        this.onGround = false;
        this.onPlatform = false;
        this.standingPlatform = null;
        this.coyote = 0;
        if(Math.random() < dt * 18){
          game.particles.spark(this.x + rand(-14, 14), this.y - rand(0, 44), '#a8f2ff', 120, .35, -Math.PI / 2, 1.2);
        }
      }

      // Gravity, with a shorter hop if jump is released
      let gravity = 2280;
      if(this.vy < 0 && !this.jumpHeld) gravity = 3100;
      else if(this.vy > 0) gravity = 2500;
      this.vy += gravity * dt;
      this.vy = clamp(this.vy, -1100, 1080);

      const prevFeet = this.y;
      this.x += this.vx * dt;
      this.x = clamp(this.x, 16, game.stage.width - 16);
      if(game.bossActive && game.gateClosed){
        this.x = Math.max(this.x, game.stage.arenaLeft + 18);
      }
      this.y += this.vy * dt;

      const surface = game.findSurface(this, prevFeet);
      if(surface && this.vy >= 0){
        const fallSpeed = this.vy;
        this.y = surface.y;
        this.vy = 0;
        if(!wasGrounded && fallSpeed > 320){
          game.particles.dust(this.x, this.y, -sign(this.vx || 1), 5);
          this.landImpact = 1;
        }
        this.onGround = true;
        this.onPlatform = surface.platform;
        this.standingPlatform = surface.ref || null;
        this.coyote = .11;
      }else{
        this.onGround = false;
        this.onPlatform = false;
        this.standingPlatform = null;
      }

      if(this.onGround){
        const speed = Math.abs(this.vx);
        this.runPhase += dt * (5 + speed * .055);
        if(mx !== 0 && speed > 25 && Math.random() < dt * 6){
          game.particles.dust(this.x - this.facing * 8, this.y, this.facing, 1);
        }
      }else{
        this.runPhase += dt * 6;
      }

      if(this.y > H + 90){
        game.killPlayer('fall');
      }
    }

    draw(g, game){
      if(this.dead) return;
      g.save();
      if(this.invuln > 0 && Math.floor(game.worldTime * 22) % 2 === 0){
        g.globalAlpha = .42;
      }
      if(this.dashTimer > 0){
        g.save();
        g.globalAlpha = .3;
        g.strokeStyle = '#76efd4';
        g.lineWidth = 1.6;
        for(let i = 0; i < 3; i++){
          const yy = this.y - 12 - i * 11;
          g.beginPath();
          g.moveTo(this.x - this.dashDir * (18 + i * 10), yy);
          g.lineTo(this.x - this.dashDir * (46 + i * 16), yy + i - 1);
          g.stroke();
        }
        g.restore();
      }
      drawCommando(g, this, { scale: 1 });
      g.restore();
    }
  }

  function drawCommando(g, p, opts = {}){
    const scale = opts.scale || 1;
    const facing = p.facing || 1;
    const crouch = !!p.crouching;
    const off = crouch ? 9 : 0;
    const t = p.animTime || 0;
    const moving = Math.abs(p.vx || 0) > 25 && p.onGround && !crouch;
    const runPhase = p.runPhase || 0;
    const inAir = !p.onGround;
    const bob = p.onGround ? Math.sin(t * 3.2) * .55 : 0;
    g.save();
    g.translate(p.x, p.y);
    if(scale !== 1) g.scale(scale, scale);
    // Shadow
    g.fillStyle = 'rgba(0,0,0,.38)';
    g.beginPath();
    g.ellipse(0, 2 + (p.onGround ? 0 : 12), crouch ? 17 : 15, 4.5, 0, 0, TAU);
    g.fill();
    g.scale(facing, 1);
    g.translate(0, bob);

    // Scarf tails (behind)
    const scarfWave = Math.sin(t * 5.2) * 3 + (p.vx || 0) * -.03;
    g.strokeStyle = '#15100d';
    g.lineWidth = 6;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(-4, -40 + off);
    g.quadraticCurveTo(-17, -39 + off + scarfWave, -27 - Math.abs(p.vx || 0) * .035, -31 + off + scarfWave * 1.5);
    g.stroke();
    g.strokeStyle = '#e45b34';
    g.lineWidth = 3.7;
    g.stroke();
    g.strokeStyle = '#ff8854';
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(-5, -40 + off);
    g.quadraticCurveTo(-16, -44 + off - scarfWave * .4, -25, -37 + off + scarfWave);
    g.stroke();

    // Legs
    const hipY = crouch ? -12 : -21;
    const backLegColor = '#263232';
    const frontLegColor = '#3a4a48';
    const drawLeg = (phaseOffset, color, isFront) => {
      let fx, fy, kx, ky;
      if(crouch){
        fx = phaseOffset > 0 ? 11 : -9;
        fy = 0;
        kx = phaseOffset > 0 ? 9 : -7;
        ky = -7;
      }else if(inAir){
        if(isFront){
          fx = 10; fy = -5; kx = 10; ky = -13;
        }else{
          fx = -8; fy = -2; kx = -4; ky = -13;
        }
      }else if(moving){
        const phase = runPhase + phaseOffset;
        const swing = Math.sin(phase);
        const lift = Math.max(0, Math.sin(phase + .7));
        fx = swing * 12;
        fy = -lift * 5;
        kx = 2 + swing * 5;
        ky = hipY * .52;
      }else{
        fx = phaseOffset > 0 ? 7 : -7;
        fy = 0;
        kx = phaseOffset > 0 ? 4 : -4;
        ky = hipY * .52;
      }
      g.strokeStyle = '#080c0d';
      g.lineWidth = 8.6;
      g.lineJoin = 'round';
      g.beginPath();
      g.moveTo(0, hipY);
      g.lineTo(kx, ky);
      g.lineTo(fx, fy);
      g.stroke();
      g.strokeStyle = color;
      g.lineWidth = 5.4;
      g.stroke();
      g.fillStyle = '#0b1011';
      g.beginPath();
      g.ellipse(fx + 2, fy - 1, 7.4, 3.8, -.08, 0, TAU);
      g.fill();
      g.fillStyle = isFront ? '#4e5d59' : '#34433f';
      g.fillRect(fx - 4, fy - 2, 8, 1.2);
    };
    drawLeg(Math.PI, backLegColor, false);

    // Backpack
    g.fillStyle = '#0a0f10';
    roundRect(g, -12, -38 + off, 10, 18, 3);
    g.fill();
    g.fillStyle = '#293737';
    g.fillRect(-10, -36 + off, 6, 14);
    g.fillStyle = '#86482f';
    g.fillRect(-9, -33 + off, 4, 4);

    // Torso
    g.fillStyle = '#080c0d';
    g.beginPath();
    g.moveTo(-8, -40 + off);
    g.lineTo(9, -40 + off);
    g.lineTo(11, -27 + off);
    g.lineTo(6, -20 + off);
    g.lineTo(-7, -21 + off);
    g.lineTo(-10, -31 + off);
    g.closePath();
    g.fill();
    const suit = g.createLinearGradient(-8, -40, 9, -22);
    suit.addColorStop(0, '#263c3b');
    suit.addColorStop(.5, '#36504d');
    suit.addColorStop(1, '#1b2b2a');
    g.fillStyle = suit;
    g.beginPath();
    g.moveTo(-6, -38 + off);
    g.lineTo(7, -38 + off);
    g.lineTo(9, -27 + off);
    g.lineTo(4, -22 + off);
    g.lineTo(-6, -23 + off);
    g.lineTo(-8, -31 + off);
    g.closePath();
    g.fill();
    // Chest plate
    g.fillStyle = '#49635c';
    g.beginPath();
    g.moveTo(-5, -36 + off);
    g.lineTo(6, -36 + off);
    g.lineTo(7, -28 + off);
    g.lineTo(-4, -28 + off);
    g.closePath();
    g.fill();
    g.fillStyle = 'rgba(124,157,137,.34)';
    g.fillRect(-4, -35 + off, 9, 1.5);
    // Harness
    g.strokeStyle = '#b56c3d';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(-6, -37 + off);
    g.lineTo(2, -23 + off);
    g.moveTo(6, -37 + off);
    g.lineTo(-1, -23 + off);
    g.stroke();
    g.fillStyle = '#15201e';
    g.fillRect(-7, -24 + off, 14, 3);
    g.fillStyle = '#ffc267';
    g.fillRect(3, -23.4 + off, 2.5, 2);
    // Shoulder pad
    g.fillStyle = '#0a0f10';
    g.beginPath();
    g.ellipse(-6, -36 + off, 7.5, 6.2, -.2, 0, TAU);
    g.fill();
    g.fillStyle = '#3d5049';
    g.beginPath();
    g.ellipse(-6, -36 + off, 5.7, 4.5, -.2, 0, TAU);
    g.fill();
    g.fillStyle = '#d05c35';
    g.fillRect(-10, -38 + off, 4, 2);
    // Neck / head
    g.fillStyle = '#b67d55';
    g.fillRect(-2, -43 + off, 7, 5);
    g.fillStyle = '#101817';
    g.beginPath();
    g.moveTo(-6, -47 + off);
    g.quadraticCurveTo(0, -54 + off, 7, -48 + off);
    g.lineTo(8, -43 + off);
    g.lineTo(4, -42 + off);
    g.lineTo(-6, -42 + off);
    g.closePath();
    g.fill();
    // Face
    g.fillStyle = '#cb9161';
    g.beginPath();
    g.moveTo(1, -45 + off);
    g.lineTo(7, -45 + off);
    g.lineTo(7, -40 + off);
    g.lineTo(2, -40 + off);
    g.closePath();
    g.fill();
    // Helmet plate
    g.fillStyle = '#293b38';
    g.beginPath();
    g.moveTo(-5, -48 + off);
    g.lineTo(5, -50 + off);
    g.lineTo(8, -46 + off);
    g.lineTo(-5, -44 + off);
    g.closePath();
    g.fill();
    // Red headband
    g.fillStyle = '#d44e2f';
    g.fillRect(-6, -44 + off, 13, 2);
    g.strokeStyle = '#d44e2f';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(-6, -43 + off);
    g.quadraticCurveTo(-15, -46 + off + scarfWave * .4, -22, -41 + off + scarfWave);
    g.stroke();
    // Visor
    g.fillStyle = '#64f0dc';
    g.shadowColor = '#64f0dc';
    g.shadowBlur = 5;
    g.fillRect(2, -46.5 + off, 5, 2.1);
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(8,16,15,.9)';
    g.fillRect(2.5, -43 + off, 4.5, 2);

    // Gun arm
    const localAim = facing > 0 ? p.aimAngle : Math.PI - p.aimAngle;
    const shoulderY = crouch ? -23 : -33;
    const kick = (p.recoil || 0) * 4;
    g.save();
    g.translate(3, shoulderY);
    g.rotate(localAim);
    // Supporting arm
    g.strokeStyle = '#080c0d';
    g.lineWidth = 7.5;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(-1, 5);
    g.lineTo(10 - kick, 2);
    g.stroke();
    g.strokeStyle = '#876047';
    g.lineWidth = 4.5;
    g.stroke();
    g.fillStyle = '#172322';
    g.beginPath();
    g.arc(11 - kick, 2, 3.5, 0, TAU);
    g.fill();
    // Rifle
    const rec = kick;
    g.fillStyle = '#070b0c';
    g.beginPath();
    g.moveTo(2 - rec, -4);
    g.lineTo(29 - rec, -3);
    g.lineTo(39 - rec, -1);
    g.lineTo(39 - rec, 2);
    g.lineTo(28 - rec, 3);
    g.lineTo(18 - rec, 7);
    g.lineTo(13 - rec, 7);
    g.lineTo(14 - rec, 3);
    g.lineTo(5 - rec, 4);
    g.lineTo(1 - rec, 1);
    g.closePath();
    g.fill();
    g.fillStyle = '#28322f';
    g.fillRect(8 - rec, -2.5, 22, 4);
    g.fillStyle = '#5f6b61';
    g.fillRect(12 - rec, -2.2, 17, 1.2);
    g.fillStyle = '#131b1a';
    g.fillRect(25 - rec, -3, 3, 6);
    g.fillStyle = '#9ca99a';
    g.fillRect(36 - rec, -1, 5, 1.2);
    g.fillStyle = '#c98343';
    g.fillRect(18 - rec, 2, 3, 5);
    // scope
    g.fillStyle = '#0b1211';
    g.fillRect(12 - rec, -6, 10, 3);
    g.fillStyle = '#4de2c7';
    g.fillRect(18 - rec, -5.2, 2.5, 1.2);
    // Forward hand
    g.fillStyle = '#846046';
    g.beginPath();
    g.arc(27 - rec, 3, 3.2, 0, TAU);
    g.fill();
    // Muzzle flash
    if((p.muzzle || 0) > 0){
      g.globalCompositeOperation = 'lighter';
      const mg = g.createRadialGradient(42 - rec, 0, 0, 42 - rec, 0, 16);
      mg.addColorStop(0, 'rgba(255,246,205,.95)');
      mg.addColorStop(.3, 'rgba(255,185,94,.72)');
      mg.addColorStop(1, 'rgba(255,118,49,0)');
      g.fillStyle = mg;
      g.beginPath();
      g.arc(42 - rec, 0, 16, 0, TAU);
      g.fill();
      g.fillStyle = '#fff4cd';
      g.beginPath();
      g.moveTo(38 - rec, -5);
      g.lineTo(51 - rec, 0);
      g.lineTo(38 - rec, 4);
      g.closePath();
      g.fill();
    }
    g.restore();

    // Front leg overlays the hip slightly
    drawLeg(0, frontLegColor, true);

    // Rim light on silhouette edge
    g.strokeStyle = 'rgba(255,147,83,.2)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(-7, -38 + off);
    g.lineTo(-9, -27 + off);
    g.stroke();
    g.restore();
  }

  /* =========================================================
     BOSS — SIEGE UNIT "IRON JAW"
     ========================================================= */
  class Boss {
    constructor(spec){
      this.spec = spec;
      this.x = spec.x;
      this.y = spec.y;
      this.kind = 'ironjaw';
      this.maxHp = spec.hp;
      this.hp = spec.hp;
      this.name = spec.name || '重装攻城机 · 铁颚';
      this.shortName = spec.shortName || '铁颚';
      this.designation = spec.designation || '重装攻城机';
      this.en = spec.en || 'SIEGE UNIT';
      this.active = false;
      this.dead = false;
      this.startDelay = 0;
      this.t = 0;
      this.bob = 0;
      this.phase = 1;
      this.cd = 1.8;
      this.action = null;
      this.attackIndex = 0;
      this.hitFlash = 0;
      this.hitPoint = null;
      this.muzzleFlash = [0, 0];
      this.recoil = [0, 0];
      this.deathFlicker = 0;
      this.eyeGlow = 0;
      this.corePulse = 0;
    }

    get bounds(){
      return { x: this.x - 165, y: this.y - 365 + this.bob, w: 310, h: 365 };
    }
    get core(){
      return { x: this.x - 22, y: this.y - 180 + this.bob, r: 36 };
    }
    get eye(){
      return { x: this.x - 137, y: this.y - 313 + this.bob };
    }
    getCannonMuzzle(index){
      if(index === 0){
        return { x: this.x - 231 + this.recoil[0] * 7, y: this.y - 255 + this.bob };
      }
      return { x: this.x - 201 + this.recoil[1] * 7, y: this.y - 156 + this.bob };
    }

    activate(game){
      if(this.active) return;
      this.active = true;
      this.startDelay = 2.2;
      this.cd = 1.4;
      this.t = 0;
    }

    update(dt, game){
      this.t += dt;
      this.bob = Math.sin(this.t * 1.15) * 2.2;
      this.hitFlash = Math.max(0, this.hitFlash - dt);
      this.muzzleFlash[0] = Math.max(0, this.muzzleFlash[0] - dt);
      this.muzzleFlash[1] = Math.max(0, this.muzzleFlash[1] - dt);
      this.recoil[0] = Math.max(0, this.recoil[0] - dt * 6);
      this.recoil[1] = Math.max(0, this.recoil[1] - dt * 6);
      this.corePulse += dt;
      if(!this.active || this.dead) return;
      if(this.phase >= 2 && Math.random() < dt * 3.5){
        game.particles.trail(this.x + rand(-70, 100), this.y - rand(280, 360), 'rgba(68,56,49,.8)', rand(4, 9), rand(.5, .95));
      }
      if(this.startDelay > 0){
        this.startDelay -= dt;
        return;
      }
      if(game.player.dead) return;

      if(this.action){
        this.updateAction(dt, game);
      }else{
        this.cd -= dt;
        if(this.cd <= 0) this.chooseAttack(game);
      }
    }

    chooseAttack(game){
      const cycle = this.phase === 1
        ? ['cannon', 'missile', 'laser', 'cannon']
        : ['cannon', 'laser', 'missile', 'cannon', 'laser'];
      const name = cycle[this.attackIndex % cycle.length];
      this.attackIndex++;
      const a = {
        name, t: 0, fired: 0,
        locked: false, beamT: 0,
        targetX: game.player.x,
        targetY: game.player.centerY,
        lockTrack: 0,
        lockCue: false,
        chargeTime: this.phase === 1 ? 1.35 : 1.08,
        beamDuration: this.phase === 1 ? .5 : .58
      };
      this.action = a;
      if(name === 'laser'){
        sound.sfx('charge');
      }else if(name === 'missile'){
        sound.sfx('alarm');
      }
    }

    updateAction(dt, game){
      const a = this.action;
      if(!a) return;
      a.t += dt;
      if(a.name === 'cannon'){
        const shots = this.phase === 1 ? 3 : 4;
        const interval = this.phase === 1 ? .23 : .18;
        const first = .5;
        while(a.fired < shots && a.t >= first + a.fired * interval){
          this.fireCannon(game, a.fired % 2);
          a.fired++;
        }
        if(a.t > first + shots * interval + .45){
          this.finishAction(this.phase === 1 ? 1.7 : 1.05);
        }
      }else if(a.name === 'missile'){
        const shots = this.phase === 1 ? 3 : 4;
        if(a.t >= .45 && a.fired < shots && a.t >= .45 + a.fired * .23){
          const target = clamp(game.player.x + rand(-100, 100), game.stage.arenaLeft + 60, this.x - 230);
          this.launchMissile(game, target);
          a.fired++;
        }
        if(a.t > .45 + shots * .23 + .7){
          this.finishAction(this.phase === 1 ? 1.65 : 1.05);
        }
      }else if(a.name === 'laser'){
        if(!a.locked){
          // The firing lane is fixed the moment the beam begins charging.
          // A bright reticle and countdown mark the safe-to-leave spot.
          if(!a.lockCue){
            a.lockCue = true;
            sound.sfx('ui');
            game.particles.add({
              type: 'ring', x: a.targetX, y: a.targetY, r: 8,
              color: '#ffb06e', life: .38, maxLife: .38, gravity: 0
            });
          }
          this.eyeGlow = Math.min(1, a.t / a.chargeTime);
          const eye = this.eye;
          if(a.t >= a.chargeTime){
            a.locked = true;
            a.beamT = 0;
            sound.sfx('beam');
            game.shake = Math.max(game.shake, 9);
          }else if(Math.random() < dt * 28){
            const ang = rand(0, TAU);
            game.particles.spark(eye.x + Math.cos(ang) * rand(4, 22), eye.y + Math.sin(ang) * rand(4, 18), '#ff7c50', 120, .25, ang, 1.6);
          }
        }else{
          a.beamT += dt;
          this.eyeGlow = 1;
          const eye = this.eye;
          const d2 = segmentDistanceSq(game.player.x, game.player.centerY, eye.x, eye.y, a.targetX, a.targetY);
          if(d2 < 16 * 16){
            game.damagePlayer(1, eye.x);
            const t = clamp(( (game.player.x - eye.x) * (a.targetX - eye.x) + (game.player.centerY - eye.y) * (a.targetY - eye.y) ) /
              Math.max(1, dist2(eye.x, eye.y, a.targetX, a.targetY)), 0, 1);
            game.particles.explosion(eye.x + (a.targetX - eye.x) * t, eye.y + (a.targetY - eye.y) * t, .55, '#ffb15e');
          }
          if(a.beamT > a.beamDuration){
            this.finishAction(this.phase === 1 ? 1.55 : .95);
          }
        }
      }
    }

    finishAction(cd){
      this.action = null;
      this.eyeGlow = 0;
      this.cd = cd;
    }

    fireCannon(game, which){
      const m = this.getCannonMuzzle(which);
      const p = game.player;
      const targetY = p.centerY;
      const angle = Math.atan2(targetY - m.y, p.x - m.x) + rand(-.035, .035);
      const speed = this.phase === 1 ? 390 : 445;
      game.enemyBullets.push(new EnemyBullet(
        m.x, m.y, Math.cos(angle) * speed, Math.sin(angle) * speed,
        { r: 7.2, color: '#ff8550', life: 4, type: 'heavy', damage: 1 }
      ));
      this.muzzleFlash[which] = .1;
      this.recoil[which] = 1;
      game.particles.muzzle(m.x, m.y, angle, '#ffc27d', 1.7);
      game.shake = Math.max(game.shake, 2.8);
      sound.sfx('bossCannon');
    }

    launchMissile(game, targetX){
      const sx = this.x + 30;
      const sy = this.y - 338 + this.bob;
      const targetY = GROUND_Y - 8;
      const T = rand(1.3, 1.6);
      const grav = 820;
      const vx = (targetX - sx) / T;
      const vy = (targetY - sy - .5 * grav * T * T) / T;
      const bullet = new EnemyBullet(sx, sy, vx, vy, {
        gravity: grav, type: 'missile', r: 6,
        color: '#ff8b4e', life: T + .3, warningX: targetX
      });
      game.enemyBullets.push(bullet);
      game.markers.push({
        x: targetX, y: GROUND_Y, t: 0, dur: T, missileWarning: true, done: false
      });
      game.particles.muzzle(sx, sy, -Math.PI / 2, '#ffb06d', 1.1);
      sound.sfx('missileLaunch');
    }

    hit(game, dmg, core, hx, hy){
      if(!this.active || this.dead) return;
      this.hitFlash = .08;
      this.hitPoint = { x: hx == null ? this.core.x : hx, y: hy == null ? this.core.y : hy };
      const mult = core ? 1.85 : .72;
      this.hp -= dmg * mult;
      game.particles.hit(
        this.hitPoint.x, this.hitPoint.y,
        core ? '#ffd37a' : '#ffb377',
        core ? 8 : 4,
        core ? 300 : 190
      );
      sound.sfx('bossHurt');
      if(this.phase === 1 && this.hp <= this.maxHp * .5){
        this.enterPhaseTwo(game);
      }
      if(this.hp <= 0){
        this.hp = 0;
        this.die(game);
      }
    }

    enterPhaseTwo(game){
      this.phase = 2;
      this.action = null;
      this.cd = 1.15;
      this.eyeGlow = 1;
      game.flash = Math.max(game.flash, .52);
      game.shake = Math.max(game.shake, 18);
      game.bossPhaseWarning = 2.2;
      sound.sfx('alarm');
      sound.sfx('explosion');
      const bx = this.x - 310;
      game.enemies.push(new Enemy({ type: 'drone', x: bx, y: 295, anchorX: bx }));
      game.enemies.push(new Enemy({ type: 'drone', x: bx - 90, y: 320, anchorX: bx - 90 }));
      game.particles.explosion(this.core.x, this.core.y, 1.8, '#ff8a4b');
    }

    die(game){
      if(this.dead) return;
      this.dead = true;
      this.action = null;
      this.eyeGlow = 0;
      game.onBossDefeated(this);
    }

    draw(g, game){
      if(!this.active) return;
      const dead = this.dead;
      g.save();
      if(dead){
        const flick = Math.sin(this.t * 34) > 0 ? .88 : .48;
        g.globalAlpha = flick;
      }
      g.translate(this.x, this.y + this.bob);
      // Shadow
      g.fillStyle = 'rgba(0,0,0,.48)';
      g.beginPath();
      g.ellipse(0, 2, 190, 12, 0, 0, TAU);
      g.fill();
      glowCircle(g, -20, -180, 230, this.phase > 1 ? '#d53d20' : '#7c432b', .09);

      this.drawLegs(g);
      this.drawLowerHull(g);
      this.drawUpperHull(g);
      this.drawCockpit(g);
      this.drawMissilePod(g);
      this.drawCannons(g);
      this.drawCore(g);

      // Muzzle flashes
      for(let i = 0; i < 2; i++){
        if(this.muzzleFlash[i] > 0){
          const mx = i === 0 ? -231 + this.recoil[i] * 7 : -201 + this.recoil[i] * 7;
          const my = i === 0 ? -255 : -156;
          g.save();
          g.globalCompositeOperation = 'lighter';
          glowCircle(g, mx - 6, my, 34, '#ffbf78', .9);
          g.fillStyle = '#fff2ca';
          g.beginPath();
          g.moveTo(mx - 38, my);
          g.lineTo(mx + 4, my - 12);
          g.lineTo(mx - 8, my);
          g.lineTo(mx + 4, my + 12);
          g.closePath();
          g.fill();
          g.restore();
        }
      }

      // Hit flash
      if(this.hitFlash > 0 && this.hitPoint){
        g.save();
        g.globalCompositeOperation = 'lighter';
        glowCircle(g, this.hitPoint.x - this.x, this.hitPoint.y - this.y - this.bob, 60, '#ffd7a3', .5);
        g.restore();
      }

      // Phase two energy cracks
      if(this.phase > 1 && !dead){
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.strokeStyle = `rgba(255,105,55,${.25 + Math.sin(this.t * 8) * .1})`;
        g.lineWidth = 1.4;
        g.beginPath();
        g.moveTo(-36, -172);
        g.lineTo(-70, -130);
        g.lineTo(-54, -102);
        g.lineTo(-88, -63);
        g.moveTo(-4, -170);
        g.lineTo(20, -120);
        g.lineTo(5, -87);
        g.moveTo(-24, -185);
        g.lineTo(-55, -220);
        g.lineTo(-40, -245);
        g.stroke();
        g.restore();
      }

      if(dead){
        g.globalCompositeOperation = 'lighter';
        glowCircle(g, -20, -180, 210, '#ff7d45', .12 + Math.sin(this.t * 12) * .05);
      }
      g.restore();

      this.drawBeam(g, game);
    }

        g.fillRect(tipX + 8 + recoil, pivotY - 11, pivotX - tipX - 32, 2);
        // Muzzle brake
        g.fillStyle = '#0b1112';
        g.fillRect(tipX + recoil, pivotY - 16, 19, 32);
        g.fillStyle = '#515c59';
        g.fillRect(tipX + 3 + recoil, pivotY - 14, 3, 28);
        g.fillRect(tipX + 12 + recoil, pivotY - 14, 3, 28);
        g.fillStyle = '#171f20';
        g.fillRect(tipX - 4 + recoil, pivotY - 11, 8, 22);
        g.fillStyle = '#060a0c';
        g.beginPath();
        g.ellipse(tipX - 4 + recoil, pivotY, 4, 10, 0, 0, TAU);
        g.fill();
        // bands and bolts
        g.fillStyle = 'rgba(8,12,13,.8)';
        g.fillRect(tipX + 44 + recoil, pivotY - 13, 8, 26);
        g.fillRect(tipX + 81 + recoil, pivotY - 13, 5, 26);
        g.fillStyle = 'rgba(255,141,73,.55)';
        g.fillRect(tipX + 31 + recoil, pivotY + 9, 20, 2);
        // Hinge
        g.fillStyle = '#0a0f10';
        g.beginPath();
        g.arc(pivotX + 10, pivotY, 24, 0, TAU);
        g.fill();
        g.fillStyle = '#344043';
        g.beginPath();
        g.arc(pivotX + 10, pivotY, 16, 0, TAU);
        g.fill();
        g.fillStyle = '#0c1213';
        g.beginPath();
        g.arc(pivotX + 10, pivotY, 7, 0, TAU);
        g.fill();
        g.strokeStyle = 'rgba(180,190,174,.25)';
        g.lineWidth = 2;
        g.beginPath();
        g.arc(pivotX + 10, pivotY, 12, -2.5, -.7);
        g.stroke();
        g.restore();
      };
      drawCannon(0, -90, -255, -231, -255);
      drawCannon(1, -82, -156, -201, -156);
    }

    drawCore(g){
      const c = { x: -22, y: -180 };
      const pulse = .5 + Math.sin(this.corePulse * (this.phase > 1 ? 8 : 4.2)) * .18;
      g.save();
      // Core armor housing
      g.fillStyle = '#080d0f';
      g.beginPath();
      g.arc(c.x, c.y, 55, 0, TAU);
      g.fill();
      g.fillStyle = '#1e282b';
      g.beginPath();
      g.arc(c.x, c.y, 47, 0, TAU);
      g.fill();
      g.strokeStyle = 'rgba(122,134,125,.35)';
      g.lineWidth = 2;
      g.beginPath();
      g.arc(c.x, c.y, 42, 0, TAU);
      g.stroke();
      // outer teeth/iris
      for(let i = 0; i < 8; i++){
        const a = i / 8 * TAU + this.t * .08;
        g.save();
        g.translate(c.x + Math.cos(a) * 38, c.y + Math.sin(a) * 38);
        g.rotate(a);
        g.fillStyle = '#0c1213';
        g.fillRect(-7, -9, 14, 18);
        g.fillStyle = 'rgba(171,145,84,.3)';
        g.fillRect(-6, -8, 12, 2);
        g.restore();
      }
      g.globalCompositeOperation = 'lighter';
      glowCircle(g, c.x, c.y, 64, this.phase > 1 ? '#ff5835' : '#ff8b47', .22 + pulse * .18);
      g.globalCompositeOperation = 'source-over';
      // glowing orb
      const coreGrad = g.createRadialGradient(c.x - 8, c.y - 10, 4, c.x, c.y, 34);
      coreGrad.addColorStop(0, '#fff4cd');
      coreGrad.addColorStop(.24, '#ffd27b');
      coreGrad.addColorStop(.58, this.phase > 1 ? '#ff4c2c' : '#ff873e');
      coreGrad.addColorStop(1, 'rgba(90,26,13,.4)');
      g.fillStyle = coreGrad;
      g.beginPath();
      g.arc(c.x, c.y, 32, 0, TAU);
      g.fill();
      // iris blades
      g.strokeStyle = 'rgba(77,29,17,.75)';
      g.lineWidth = 4;
      for(let i = 0; i < 4; i++){
        const a = i / 4 * TAU + this.t * .35;
        g.beginPath();
        g.moveTo(c.x + Math.cos(a) * 12, c.y + Math.sin(a) * 12);
        g.lineTo(c.x + Math.cos(a) * 30, c.y + Math.sin(a) * 30);
        g.stroke();
      }
      g.globalCompositeOperation = 'lighter';
      g.strokeStyle = `rgba(255,230,170,${.35 + pulse * .3})`;
      g.lineWidth = 1.6;
      g.beginPath();
      g.arc(c.x, c.y, 25 + pulse * 3, 0, TAU);
      g.stroke();
      // little energy arcs
      g.strokeStyle = 'rgba(255,180,103,.45)';
      g.lineWidth = 1;
      g.beginPath();
      g.arc(c.x, c.y, 36, this.t * 2, this.t * 2 + 1.1);
      g.stroke();
      g.restore();
      // warning text below/core label
      g.save();
      g.globalAlpha = .35;
      g.fillStyle = '#ffd5a2';
      g.font = `700 6px ${FONT_MONO}`;
      g.textAlign = 'center';
      g.fillText('WEAK POINT', c.x, c.y + 69);
      g.restore();
    }

    drawBeam(g, game){
      if(!this.action || this.action.name !== 'laser') return;
      const a = this.action;
      const eye = this.eye;
      const tx = a.targetX;
      const ty = a.targetY;
      g.save();
      g.globalCompositeOperation = 'lighter';
      if(!a.locked){
        const charge = clamp(a.t / a.chargeTime, 0, 1);
        const lockedAim = a.t >= a.lockTrack;
        // Aim line: tracks only briefly, then reads as a fixed firing lane.
        g.strokeStyle = lockedAim
          ? `rgba(255,219,151,${.36 + charge * .3})`
          : `rgba(255,99,63,${.16 + charge * .3})`;
        g.lineWidth = lockedAim ? 1.8 : 1 + charge * 1.6;
        g.setLineDash(lockedAim ? [12, 7] : [5, 11]);
        g.lineDashOffset = -this.t * 80;
        g.beginPath();
        g.moveTo(eye.x, eye.y);
        g.lineTo(tx, ty);
        g.stroke();
        g.setLineDash([]);
        // Target reticle with a clear countdown ring
        const rr = 13 + charge * 13;
        g.fillStyle = `rgba(26,7,4,${.12 + charge * .16})`;
        g.beginPath();
        g.arc(tx, ty, rr + 8, 0, TAU);
        g.fill();
        g.strokeStyle = `rgba(255,151,91,${.38 + charge * .4})`;
        g.lineWidth = 1.2;
        g.beginPath();
        g.arc(tx, ty, rr, 0, TAU);
        g.stroke();
        g.strokeStyle = `rgba(255,226,165,${.25 + charge * .45})`;
        g.lineWidth = 1.6;
        g.beginPath();
        g.moveTo(tx - rr - 7, ty);
        g.lineTo(tx + rr + 7, ty);
        g.moveTo(tx, ty - rr - 7);
        g.lineTo(tx, ty + rr + 7);
        g.stroke();
        g.strokeStyle = lockedAim ? `rgba(255,230,172,${.65 + charge * .3})` : 'rgba(255,174,105,.4)';
        g.lineWidth = 2.4;
        g.beginPath();
        g.arc(tx, ty, rr + 5, -Math.PI / 2, -Math.PI / 2 + charge * TAU);
        g.stroke();
        if(lockedAim){
          const b = 7, gap = 5;
          g.strokeStyle = `rgba(255,239,197,${.62 + charge * .25})`;
          g.lineWidth = 2;
          for(const sx of [-1, 1]){
            for(const sy of [-1, 1]){
              g.beginPath();
              g.moveTo(tx + sx * (rr + gap), ty + sy * (rr + gap) * .48);
              g.lineTo(tx + sx * (rr + gap), ty + sy * (rr + gap));
              g.lineTo(tx + sx * (rr + gap) * .48, ty + sy * (rr + gap));
              g.stroke();
            }
          }
          g.fillStyle = '#ffd7a0';
          g.font = `700 9px ${FONT_CN}`;
          g.textAlign = 'center';
          g.fillText('锁定 · 移动躲避', tx, ty - rr - 15);
        }
        glowCircle(g, eye.x, eye.y, 22 + charge * 20, '#ff5e37', .2 + charge * .3);
      }else{
        const fade = clamp(1 - a.beamT / a.beamDuration, 0, 1);
        const alpha = Math.min(1, fade * 2.4);
        const pulse = .8 + Math.sin(this.t * 45) * .12;
        g.strokeStyle = `rgba(255,73,36,${.16 * alpha})`;
        g.lineWidth = 34;
        g.lineCap = 'round';
        g.beginPath();
        g.moveTo(eye.x, eye.y);
        g.lineTo(tx, ty);
        g.stroke();
        g.strokeStyle = `rgba(255,111,49,${.42 * alpha})`;
        g.lineWidth = 17;
        g.stroke();
        g.strokeStyle = `rgba(255,230,171,${.88 * alpha})`;
        g.lineWidth = 5 * pulse;
        g.stroke();
        g.strokeStyle = `rgba(255,255,240,${alpha})`;
        g.lineWidth = 1.7;
        g.stroke();
        // moving energy rings along the beam
        const dx = tx - eye.x, dy = ty - eye.y;
        const len = Math.hypot(dx, dy);
        g.strokeStyle = `rgba(255,187,116,${.35 * alpha})`;
        for(let i = 0; i < 4; i++){
          const u = ((this.t * .8 + i * .26) % 1);
          const px = eye.x + dx * u;
          const py = eye.y + dy * u;
          g.save();
          g.translate(px, py);
          g.rotate(Math.atan2(dy, dx));
          g.beginPath();
          g.ellipse(0, 0, 8, 18 + Math.sin(this.t * 12 + i) * 3, 0, 0, TAU);
          g.stroke();
          g.restore();
        }
        glowCircle(g, tx, ty, 48, '#ff7b45', .4 * alpha);
        g.fillStyle = `rgba(255,234,181,${.7 * alpha})`;
        g.beginPath();
        g.arc(tx, ty, 6, 0, TAU);
        g.fill();
      }
      g.restore();
    }
  }

  /* =========================================================
     BOSS — CRUCIBLE COLOSSUS / AEGIS PRIME
     ========================================================= */
  class CrucibleBoss {
    constructor(spec){
      this.spec = spec;
      this.kind = 'crucible';
      this.x = spec.x;
      this.y = spec.y;
      this.maxHp = spec.hp;
      this.hp = spec.hp;
      this.name = spec.name || '熔炉巨像';
      this.shortName = spec.shortName || this.name;
      this.designation = spec.designation || '熔炉攻城兽';
      this.en = spec.en || 'CRUCIBLE COLOSSUS';
      this.active = false;
      this.dead = false;
      this.startDelay = 0;
      this.t = 0;
      this.bob = 0;
      this.phase = 1;
      this.cd = 1.8;
      this.action = null;
      this.attackIndex = 0;
      this.hitFlash = 0;
      this.hitPoint = null;
      this.muzzleFlash = 0;
      this.recoil = 0;
      this.homeX = spec.x;
      this.playerLimitX = spec.x - 182;
      this.state = 'idle';
      this.stateT = 0;
      this.coreExposed = false;
      this.chargeTargetX = (spec.arenaLeft || spec.x - 760) + 420;
      this.stunShown = false;
      this.chargeTrail = 0;
    }
    get bounds(){
      return { x: this.x - 160, y: this.y - 335 + this.bob, w: 305, h: 335 };
    }
    get hudStatus(){
      if(this.state === 'chargeWindup' || this.state === 'charging') return { text: '冲撞蓄力', color: '#ff814f' };
      if(this.coreExposed) return { text: '核心暴露', color: '#ffd27a' };
      if(this.phase > 1) return { text: 'OVERDRIVE', color: '#ff8b55' };
      return { text: '装甲封闭', color: 'rgba(206,197,179,.45)' };
    }
    get core(){
      return { x: this.x - 20, y: this.y - 140 + this.bob, r: 44 };
    }
    activate(game){
      if(this.active) return;
      this.active = true;
      this.startDelay = 2.1;
      this.cd = 1.35;
      this.t = 0;
    }
    update(dt, game){
      this.t += dt;
      this.bob = Math.sin(this.t * 1.2) * 2.5;
      this.hitFlash = Math.max(0, this.hitFlash - dt);
      this.muzzleFlash = Math.max(0, this.muzzleFlash - dt);
      this.recoil = Math.max(0, this.recoil - dt * 6);
      if(this.active && !this.dead && Math.random() < dt * 4){
        game.particles.trail(this.x + rand(35, 95), this.y - rand(285, 350), 'rgba(66,58,50,.8)', rand(5, 10), rand(.5, .9));
      }
      if(!this.active || this.dead) return;
      if(this.startDelay > 0){ this.startDelay -= dt; return; }
      if(game.player.dead) return;
      if(this.state !== 'idle'){
        this.updateState(dt, game);
        return;
      }
      if(this.action){
        this.updateAction(dt, game);
      }else{
        this.cd -= dt;
        if(this.cd <= 0) this.chooseAction(game);
      }
    }
    updateState(dt, game){
      if(this.state === 'chargeWindup'){
        this.stateT -= dt;
        this.coreExposed = this.phase > 1;
        this.tilt = Math.sin(this.t * 38) * .012;
        if(Math.random() < dt * 24){
          game.particles.spark(this.x - 135 + rand(-28, 28), this.y - rand(60, 190), '#ffb36a', 160, .3, Math.PI, 1.4);
        }
        if(this.stateT <= 0){
          this.state = 'charging';
          this.stateT = 0;
          this.tilt = 0;
          this.chargeTrail = 0;
          sound.sfx('alarm');
          game.shake = Math.max(game.shake, 9);
        }
      }else if(this.state === 'charging'){
        this.x -= 560 * dt;
        this.chargeTrail -= dt;
        if(this.chargeTrail <= 0){
          this.chargeTrail = .035;
          game.particles.add({
            type: 'smoke', x: this.x + rand(70, 140), y: this.y - rand(8, 60),
            vx: rand(70, 160), vy: rand(-40, 10), gravity: -10,
            life: rand(.3, .55), color: '#7a4a37', r: rand(8, 18), grow: 24, drag: 1
          });
          game.particles.spark(this.x + rand(100, 150), this.y - rand(2, 28), '#ffba72', 220, .4, 0, 1.8);
        }
        game.shake = Math.max(game.shake, 4.5);
        if(this.x <= this.chargeTargetX){
          this.x = this.chargeTargetX;
          this.state = 'stunned';
          this.stateT = this.phase === 1 ? 4.3 : 3.2;
          this.coreExposed = true;
          this.stunShown = true;
          this.action = null;
          game.flash = Math.max(game.flash, .4);
          game.shake = Math.max(game.shake, 18);
          game.particles.explosion(this.x - 110, this.y - 95, 1.8, '#ff7941');
          sound.sfx('explosion');
          sound.sfx('alarm');
        }
      }else if(this.state === 'stunned'){
        this.stateT -= dt;
        this.tilt = Math.sin(this.t * 30) * .018;
        if(Math.random() < dt * 16){
          game.particles.spark(this.x + rand(-160, 100), this.y - rand(35, 300), '#ffc57a', 160, .55, null, 1.4);
        }
        if(Math.random() < dt * 4){
          game.particles.trail(this.x + rand(-55, 80), this.y - rand(255, 315), 'rgba(74,65,57,.8)', rand(5, 10), .65);
        }
        if(this.stateT <= 0){
          this.state = 'returning';
          this.stateT = 0;
          this.coreExposed = this.phase > 1;
          this.tilt = 0;
        }
      }else if(this.state === 'returning'){
        const dx = this.homeX - this.x;
        if(dx > 2){
          this.x += Math.min(115 * dt, dx);
        }else{
          this.x = this.homeX;
          this.state = 'idle';
          this.cd = this.phase === 1 ? 1.15 : .75;
        }
        if(Math.random() < dt * 8){
          game.particles.dust(this.x + rand(-60, 100), this.y, 1, 1);
        }
      }
    }
    startCharge(game){
      if(this.state !== 'idle') return;
      this.state = 'chargeWindup';
      this.stateT = this.phase === 1 ? .95 : .72;
      this.coreExposed = this.phase > 1;
      this.action = null;
      this.chargeTargetX = Math.max(game.stage.arenaLeft + 420, this.homeX - 380);
      this.stunShown = false;
      sound.sfx('alarm');
      game.shake = Math.max(game.shake, 3);
    }
    resetAfterPlayerDeath(){
      this.x = this.homeX;
      this.state = 'idle';
      this.stateT = 0;
      this.action = null;
      this.coreExposed = this.phase > 1;
      this.cd = 1.8;
      this.tilt = 0;
    }
    chooseAction(game){
      const cycle = this.phase === 1
        ? ['charge', 'eruption', 'charge', 'cannon']
        : ['charge', 'cannon', 'charge', 'magma'];
      const name = cycle[this.attackIndex++ % cycle.length];
      if(name === 'charge'){
        this.startCharge(game);
        return;
      }
      const a = { name, t: 0, fired: 0 };
      if(name === 'eruption'){
        const offsets = this.phase === 1 ? [-170, 20, 210] : [-320, -160, 20, 200, 370];
        a.vents = offsets.map((o, i) => ({
          x: clamp(game.player.x + o, game.stage.arenaLeft + 60, this.x - 245),
          start: .9 + i * .13,
          hit: false
        }));
        a.played = false;
      }
      this.action = a;
      if(name === 'magma') sound.sfx('alarm');
      else if(name === 'eruption') sound.sfx('vent');
    }
    updateAction(dt, game){
      const a = this.action;
      if(!a) return;
      a.t += dt;
      if(a.name === 'eruption'){
        for(const v of a.vents){
          const local = a.t - v.start;
          if(local >= 0 && local <= .58){
            if(!a.played){
              a.played = true;
              game.shake = Math.max(game.shake, 4);
            }
            if(!v.hit && Math.abs(game.player.x - v.x) < 37 && game.player.y > this.y - 175){
              if(game.damagePlayer(1, v.x)) v.hit = true;
            }
            if(Math.random() < dt * 28){
              game.particles.spark(v.x + rand(-18, 18), this.y - rand(10, 150), pick(['#ffb35e', '#ff6f34']), 180, .38, -Math.PI / 2, 1.6);
            }
          }
        }
        const end = a.vents[a.vents.length - 1].start + .58 + .55;
        if(a.t > end) this.finishAction(this.phase === 1 ? 1.55 : .95);
      }else if(a.name === 'magma'){
        const shots = this.phase === 1 ? 3 : 4;
        if(a.t >= .45 + a.fired * .23 && a.fired < shots){
          this.launchMagma(game);
          a.fired++;
        }
        if(a.t > .45 + shots * .23 + .7) this.finishAction(this.phase === 1 ? 1.6 : 1.0);
      }else if(a.name === 'cannon'){
        const shots = this.phase === 1 ? 3 : 4;
        if(a.t >= .4 + a.fired * .21 && a.fired < shots){
          this.fireCannon(game, a.fired % 2);
          a.fired++;
        }
        if(a.t > .4 + shots * .21 + .55) this.finishAction(this.phase === 1 ? 1.55 : .95);
      }
    }
    finishAction(cd){
      this.action = null;
      this.cd = cd;
    }
    launchMagma(game){
      const sx = this.x + rand(-20, 55);
      const sy = this.y - 318 + this.bob;
      const targetX = clamp(game.player.x + rand(-80, 80), game.stage.arenaLeft + 55, this.x - 235);
      const targetY = GROUND_Y - 8;
      const T = rand(1.25, 1.55);
      const grav = 700;
      const vx = (targetX - sx) / T;
      const vy = (targetY - sy - .5 * grav * T * T) / T;
      game.enemyBullets.push(new EnemyBullet(sx, sy, vx, vy, {
        gravity: grav, type: 'magma', r: 7.5, color: '#ff8a45',
        life: T + .25, warningX: targetX, explodeRadius: 72
      }));
      game.markers.push({ x: targetX, y: GROUND_Y, t: 0, dur: T, missileWarning: true, done: false });
      game.particles.muzzle(sx, sy, -Math.PI / 2, '#ffb06c', 1.3);
      sound.sfx('missileLaunch');
    }
    fireCannon(game, which){
      const lx = which === 0 ? -172 : -181;
      const ly = which === 0 ? -241 : -128;
      const sx = this.x + lx + this.recoil * 5;
      const sy = this.y + this.bob + ly;
      const p = game.player;
      const a = Math.atan2(p.centerY - sy, p.x - sx) + rand(-.035, .035);
      const speed = this.phase === 1 ? 315 : 360;
      game.enemyBullets.push(new EnemyBullet(sx, sy, Math.cos(a) * speed, Math.sin(a) * speed, {
        r: 6.4, color: '#ff7440', life: 4, type: 'heavy'
      }));
      this.muzzleFlash = .1;
      this.recoil = 1;
      game.particles.muzzle(sx, sy, a, '#ffc07c', 1.4);
      game.shake = Math.max(game.shake, 2.2);
      sound.sfx('bossCannon');
    }
    hit(game, dmg, core, hx, hy){
      if(!this.active || this.dead) return;
      this.hitFlash = .08;
      this.hitPoint = { x: hx == null ? this.core.x : hx, y: hy == null ? this.core.y : hy };
      const armorHit = core && !this.coreExposed;
      const mult = core ? (this.coreExposed ? 2.15 : .14) : .52;
      this.hp -= dmg * mult;
      game.particles.hit(
        this.hitPoint.x, this.hitPoint.y,
        armorHit ? '#aab4a8' : (core ? '#ffd172' : '#ffae72'),
        core ? 8 : 4, core ? 300 : 190
      );
      if(armorHit){
        game.particles.spark(this.hitPoint.x, this.hitPoint.y, '#d9e2d5', 180, .22, null, 1.2);
        sound.sfx('enemyHit');
      }else{
        sound.sfx('bossHurt');
      }
      if(this.phase === 1 && this.hp <= this.maxHp * .5) this.enterPhaseTwo(game);
      if(this.hp <= 0){ this.hp = 0; this.die(game); }
    }
    enterPhaseTwo(game){
      this.phase = 2;
      this.coreExposed = true;
      this.cd = Math.min(this.cd, .95);
      game.flash = Math.max(game.flash, .55);
      game.shake = Math.max(game.shake, 18);
      game.bossPhaseWarning = 2.2;
      sound.sfx('alarm');
      sound.sfx('explosion');
      const bx = this.x - 330;
      game.enemies.push(new Enemy({ type: 'bomber', x: bx, y: 280, anchorX: bx }));
      game.enemies.push(new Enemy({ type: 'bomber', x: bx - 120, y: 330, anchorX: bx - 120 }));
      game.particles.explosion(this.core.x, this.core.y, 1.8, '#ff8a4b');
    }
    die(game){
      if(this.dead) return;
      this.dead = true;
      this.action = null;
      game.onBossDefeated(this);
    }
    draw(g, game){
      if(!this.active) return;
      g.save();
      if(this.dead) g.globalAlpha = Math.sin(this.t * 30) > 0 ? .85 : .5;
      g.translate(this.x, this.y + this.bob);

        const cyy = this.core.y - this.y - this.bob;

        g.globalCompositeOperation = 'lighter';
        const frac = this.state === 'stunned' ? clamp(this.stateT / (this.phase === 1 ? 4.3 : 3.2), 0, 1) : 1;
        g.strokeStyle = 'rgba(255,213,143,.55)';

      if(this.state === 'chargeWindup'){
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.fillStyle = `rgba(255,105,54,${.5 + Math.sin(this.t * 24) * .3})`;
        g.font = `900 22px ${FONT_DISPLAY}`;
        g.textAlign = 'center';
        g.fillText('!', -20, -365);

      if(this.hitFlash > 0){
        g.globalCompositeOperation = 'lighter';
        glowCircle(g, this.hitPoint.x - this.x, this.hitPoint.y - this.y - this.bob, 48, '#ffd7a3', .5);

    drawEruption(g, a){
      for(const v of a.vents){
        const local = a.t - v.start;
        const x = v.x;
        if(local < 0){
          const progress = clamp(a.t / v.start, 0, 1);
          const pulse = .55 + Math.sin(this.t * 16) * .25;
          g.save();
          g.globalCompositeOperation = 'lighter';
          g.strokeStyle = `rgba(255,177,96,${.35 + progress * .35})`;
          g.lineWidth = 1.4;
          g.beginPath();
          g.ellipse(x, this.y + 2, 19 + progress * 11, 5 + progress * 2, 0, 0, TAU);
          g.stroke();
          g.strokeStyle = `rgba(255,129,60,${.2 + pulse * .2})`;
          g.beginPath();
          g.ellipse(x, this.y + 2, 33 + progress * 13, 8 + progress * 2, 0, 0, TAU);
          g.stroke();
          g.fillStyle = `rgba(255,207,137,${.5 + pulse * .3})`;
          g.font = `900 10px ${FONT_MONO}`;
          g.textAlign = 'center';
          g.fillText('!', x, this.y - 16 - progress * 8);
          g.restore();
        }else if(local < .62){
          const fade = 1 - local / .62;
          const flameH = 130 + Math.sin(this.t * 24 + x) * 24;
          g.save();
          g.globalCompositeOperation = 'lighter';
          const grad = g.createLinearGradient(0, this.y, 0, this.y - flameH);
          grad.addColorStop(0, `rgba(255,236,166,${.7 * fade})`);
          grad.addColorStop(.28, `rgba(255,124,42,${.55 * fade})`);
          grad.addColorStop(.7, `rgba(218,50,20,${.23 * fade})`);
          grad.addColorStop(1, 'rgba(160,22,8,0)');
          g.fillStyle = grad;
          g.beginPath();
          g.moveTo(x - 34, this.y);
          g.quadraticCurveTo(x - 28, this.y - flameH * .5, x - 6, this.y - flameH);
          g.quadraticCurveTo(x + 12, this.y - flameH * .62, x + 19, this.y - flameH * .96);
          g.quadraticCurveTo(x + 31, this.y - flameH * .45, x + 34, this.y);
          g.closePath();
          g.fill();
          glowCircle(g, x, this.y - 22, 58, '#ff6b2f', .2 * fade);
          g.restore();
        }
      }
    }
  }

  class AegisBoss {
    constructor(spec){
      this.spec = spec;
      this.kind = 'aegis';
      this.x = spec.x;
      this.y = spec.y;
      this.maxHp = spec.hp;
      this.hp = spec.hp;
      this.name = spec.name || '天穹核心 · 神盾';
      this.shortName = spec.shortName || '神盾';
      this.designation = spec.designation || '空中要塞';
      this.en = spec.en || 'AEGIS PRIME';
      this.active = false;
      this.dead = false;
      this.startDelay = 0;
      this.t = 0;
      this.bob = 0;
      this.phase = 1;
      this.cd = 1.8;
      this.action = null;
      this.attackIndex = 0;
      this.hitFlash = 0;
      this.hitPoint = null;
      this.muzzleFlash = 0;
      this.eyeGlow = 0;
      this.homeX = spec.x;
      this.playerLimitX = spec.playerLimitX || 4110;
      this.coreLocked = true;
      this.phase = 1;
      this.shieldFlash = 0;
      this.nodes = [
        { id: 'left', lx: -120, ly: -170, x: 0, y: 0, r: 17, hp: 20, maxHp: 20, dead: false, hitFlash: 0 },
        { id: 'right', lx: 112, ly: -105, x: 0, y: 0, r: 17, hp: 20, maxHp: 20, dead: false, hitFlash: 0 }
      ];
      this.nodeBurst = 0;
    }
    get bounds(){
      return { x: this.x - 168, y: this.y - 370 + this.bob, w: 310, h: 285 };
    }
    get core(){
      return { x: this.x - 18, y: this.y - 145 + this.bob, r: 44 };
    }
    get hudStatus(){
      if(this.coreLocked){
        const alive = this.nodes.filter(n => !n.dead).length;
        return { text: `护盾节点 ${alive}/2`, color: '#8fe8ff' };
      }
      if(this.phase >= 3) return { text: 'OVERDRIVE', color: '#ff8b55' };
      return { text: '核心暴露', color: '#ffd27a' };
    }
    activate(game){
      if(this.active) return;
      this.active = true;
      this.startDelay = 2.2;
      this.cd = 1.3;
      this.t = 0;
    }
    update(dt, game){
      this.t += dt;
      this.bob = Math.sin(this.t * .9) * 5;
      this.hitFlash = Math.max(0, this.hitFlash - dt);
      this.muzzleFlash = Math.max(0, this.muzzleFlash - dt);
      this.eyeGlow = Math.max(0, this.eyeGlow - dt * 1.4);
      this.nodeBurst = Math.max(0, this.nodeBurst - dt);
      this.shieldFlash = Math.max(0, this.shieldFlash - dt);
      // Once the core is exposed the carrier starts sliding over the deck, opening and closing the underbody lane.
      const driftTarget = (!this.coreLocked && this.startDelay <= 0 && !this.dead)
        ? this.homeX + Math.sin(this.t * .68) * 82
        : this.homeX;
      this.x = damp(this.x, driftTarget, this.coreLocked ? 2.4 : 1.35, dt);
      for(const n of this.nodes){
        n.x = this.x + n.lx;
        n.y = this.y + this.bob + n.ly;
        n.hitFlash = Math.max(0, n.hitFlash - dt);
      }
      if(!this.active || this.dead) return;
      if(this.startDelay > 0){ this.startDelay -= dt; return; }
      if(game.player.dead) return;
      if(this.action) this.updateAction(dt, game);
      else{
        this.cd -= dt;
        if(this.cd <= 0) this.chooseAction(game);
      }
    }
    chooseAction(game){
      const cycle = this.phase === 1
        ? ['beam', 'plasma', 'drones']
        : (this.phase === 2 ? ['beam', 'missiles', 'plasma', 'drones', 'beam'] : ['beam', 'plasma', 'missiles', 'beam', 'drones']);
      const name = cycle[this.attackIndex++ % cycle.length];
      const a = { name, t: 0, fired: 0, locked: false, beamT: 0 };
      if(name === 'beam'){
        a.targetX = game.player.x;
        a.targetY = game.player.centerY;
        a.chargeTime = this.phase === 1 ? 1.18 : (this.phase === 2 ? .92 : .78);
        a.beamDuration = this.phase === 1 ? .52 : (this.phase === 2 ? .6 : .68);
        sound.sfx('charge');
      }else if(name === 'missiles'){
        sound.sfx('alarm');
      }
      this.action = a;
    }
    updateAction(dt, game){
      const a = this.action;
      if(!a) return;
      a.t += dt;
      if(a.name === 'beam'){
        if(!a.locked){
          this.eyeGlow = 1;
          const eye = this.getEye();
          if(a.t >= a.chargeTime){
            a.locked = true;
            a.beamT = 0;
            sound.sfx('beam');
            game.shake = Math.max(game.shake, 9);
          }else if(Math.random() < dt * 24){
            game.particles.spark(eye.x + rand(-20, 20), eye.y + rand(-14, 14), '#8ee8ff', 120, .25, null, 1.4);
          }
          if(a.t > a.chargeTime){
            a.locked = true;
          }
        }else{
          a.beamT += dt;
          const eye = this.getEye();
          const d2 = segmentDistanceSq(game.player.x, game.player.centerY, eye.x, eye.y, a.targetX, a.targetY);
          if(d2 < 18 * 18) game.damagePlayer(1, eye.x);
          if(a.beamT > a.beamDuration) this.finishAction(this.phase === 1 ? 1.45 : .9);
        }
      }else if(a.name === 'plasma'){
        if(!a.fired && a.t >= .48){
          a.fired = 1;
          const origin = this.getEye();
          const target = game.player;
          const base = Math.atan2(target.centerY - origin.y, target.x - origin.x);
          const count = this.phase === 1 ? 5 : (this.phase === 2 ? 7 : 9);
          for(let i = 0; i < count; i++){
            const ang = base + (i - (count - 1) / 2) * .095;
            game.enemyBullets.push(new EnemyBullet(
              origin.x + Math.cos(ang) * 24, origin.y + Math.sin(ang) * 24,
              Math.cos(ang) * 330, Math.sin(ang) * 330,
              { r: 5.4, color: '#8fe8ff', life: 4, type: 'orb' }
            ));
          }
          this.eyeGlow = 1;
          this.muzzleFlash = .1;
          game.shake = Math.max(game.shake, 2.5);
          sound.sfx('laser');
        }
        if(a.t > 1.0) this.finishAction(this.phase === 1 ? 1.45 : .9);
      }else if(a.name === 'drones'){
        if(!a.fired && a.t >= .45){
          a.fired = 1;
          const bx = game.stage.arenaLeft + 190;
          game.enemies.push(new Enemy({ type: 'bomber', x: bx, y: 290, anchorX: bx }));
          game.enemies.push(new Enemy({ type: 'drone', x: bx + 155, y: 280, anchorX: bx + 155 }));
          this.eyeGlow = 1;
          sound.sfx('alarm');
        }
        if(a.t > .9) this.finishAction(this.phase === 1 ? 1.35 : .9);
      }else if(a.name === 'missiles'){
        const shots = this.phase === 1 ? 3 : (this.phase === 2 ? 4 : 5);
        if(a.t >= .4 + a.fired * .24 && a.fired < shots){
          this.launchEnergyMissile(game);
          a.fired++;
        }
        if(a.t > .4 + shots * .24 + .7) this.finishAction(this.phase === 1 ? 1.45 : .9);
      }
    }
    finishAction(cd){
      this.action = null;
      this.eyeGlow = 0;
      this.cd = cd;
    }
    getEye(){
      return { x: this.x - 103, y: this.y - 262 + this.bob };
    }
    launchEnergyMissile(game){
      const sx = this.x + 34;
      const sy = this.y - 310 + this.bob;
      const targetX = clamp(game.player.x + rand(-90, 90), game.stage.arenaLeft + 55, this.x - 230);
      const targetY = GROUND_Y - 8;
      const T = rand(1.2, 1.5);
      const grav = 650;
      const vx = (targetX - sx) / T;
      const vy = (targetY - sy - .5 * grav * T * T) / T;
      game.enemyBullets.push(new EnemyBullet(sx, sy, vx, vy, {
        gravity: grav, type: 'missile', r: 5, color: '#8fe8ff',
        life: T + .25, warningX: targetX
      }));
      game.markers.push({ x: targetX, y: GROUND_Y, t: 0, dur: T, missileWarning: true, done: false });
      game.particles.muzzle(sx, sy, -Math.PI / 2, '#9feaff', 1.1);
      sound.sfx('missileLaunch');
    }
    shieldHit(game, hx, hy){
      this.shieldFlash = .09;
      game.particles.add({
        type: 'ring', x: hx, y: hy, r: 5, color: '#9fefff',
        life: .26, maxLife: .26, gravity: 0
      });
      game.particles.spark(hx, hy, '#d7fbff', 150, .22, null, 1.1);
    }
    hitNode(game, node, dmg, hx, hy, bullet = null){
      if(!this.active || this.dead || node.dead || !this.coreLocked) return;
      // Shield nodes count as shielded targets: L does normal damage, never bonus damage.
      node.hp -= dmg;
      node.hitFlash = .1;
      game.particles.hit(hx, hy, '#b8f5ff', 5, 240);
      sound.sfx('enemyHit');
      if(node.hp <= 0){
        node.dead = true;
        node.hp = 0;
        game.addScore(750);
        game.particles.explosion(node.x, node.y, 1.3, '#8fe8ff');
        game.shake = Math.max(game.shake, 8);
        game.flash = Math.max(game.flash, .18);
        sound.sfx('explosion');
        if(this.nodes.every(n => n.dead)) this.breakShield(game);
      }
    }
    breakShield(game){
      if(!this.coreLocked) return;
      this.coreLocked = false;
      this.phase = 2;
      this.action = null;
      this.cd = 1.05;
      this.nodeBurst = 1;
      game.flash = Math.max(game.flash, .62);
      game.shake = Math.max(game.shake, 18);
      game.bossPhaseWarning = 2.2;
      game.showToast('护盾崩解', 'CORE EXPOSED // 攻击中央核心', 2.6, '#ffd27a');
      game.particles.explosion(this.core.x, this.core.y, 2.1, '#9feaff');
      sound.sfx('alarm');
      sound.sfx('explosion');
    }
    hit(game, dmg, core, hx, hy){
      if(!this.active || this.dead) return;
      const hpx = hx == null ? this.core.x : hx;
      const hpy = hy == null ? this.core.y : hy;
      if(this.coreLocked){
        game.particles.hit(hpx, hpy, '#8fe8ff', 4, 180);
        return;
      }
      this.hitFlash = .08;
      this.hitPoint = { x: hpx, y: hpy };
      this.hp -= dmg * (core ? 2.0 : .62);
      game.particles.hit(this.hitPoint.x, this.hitPoint.y, core ? '#a8f3ff' : '#8fbfd0', core ? 8 : 4, core ? 300 : 180);
      sound.sfx('bossHurt');
      if(this.phase === 2 && this.hp <= this.maxHp * .5) this.enterPhaseThree(game);
      if(this.hp <= 0){ this.hp = 0; this.die(game); }
    }
    enterPhaseThree(game){
      this.phase = 3;
      this.action = null;
      this.cd = .85;
      game.flash = Math.max(game.flash, .7);
      game.shake = Math.max(game.shake, 22);
      game.bossPhaseWarning = 2.2;
      sound.sfx('alarm');
      sound.sfx('explosion');
      const bx = game.stage.arenaLeft + 170;
      game.enemies.push(new Enemy({ type: 'bomber', x: bx, y: 280, anchorX: bx }));
      game.enemies.push(new Enemy({ type: 'bomber', x: bx + 160, y: 320, anchorX: bx + 160 }));
      game.particles.explosion(this.core.x, this.core.y, 2, '#9feaff');
    }
    die(game){
      if(this.dead) return;
      this.dead = true;
      this.action = null;
      game.onBossDefeated(this);
    }

      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(60, -336);
      g.lineTo(84, -388);

      g.fillStyle = 'rgba(143,237,255,.7)';
      g.fillRect(81, -393, 4, 4);
      if(this.phase > 1){
        g.strokeStyle = 'rgba(255,121,74,.4)';
        g.lineWidth = 1.3;
        g.beginPath();

        g.lineTo(cx - 74, cy - 54);
        g.lineTo(cx - 58, cy - 76);
        g.moveTo(cx + 49, cy + 16);
        g.lineTo(cx + 77, cy + 42);

      }
      if(this.hitFlash > 0){
        g.globalCompositeOperation = 'lighter';
        glowCircle(g, this.hitPoint.x - this.x, this.hitPoint.y - this.y - this.bob, 48, '#d8f8ff', .55);
      }
      g.restore();
      if(this.action && this.action.name === 'beam') this.drawBeam(g, this.action);
    }
    drawBeam(g, a){
      const eye = this.getEye();
      const tx = a.targetX;
      const ty = a.targetY;
      g.save();
      g.globalCompositeOperation = 'lighter';
      if(!a.locked){
        const charge = clamp(a.t / a.chargeTime, 0, 1);
        g.strokeStyle = `rgba(124,228,255,${.18 + charge * .35})`;
        g.lineWidth = 1.1 + charge * 1.5;
        g.setLineDash([6, 10]);
        g.lineDashOffset = -this.t * 75;
        g.beginPath();
        g.moveTo(eye.x, eye.y);
        g.lineTo(tx, ty);
        g.stroke();
        g.setLineDash([]);
        const rr = 12 + charge * 13;
        g.strokeStyle = `rgba(169,244,255,${.3 + charge * .4})`;
        g.lineWidth = 1.3;
        g.beginPath();
        g.arc(tx, ty, rr, 0, TAU);
        g.moveTo(tx - rr - 6, ty);
        g.lineTo(tx + rr + 6, ty);
        g.moveTo(tx, ty - rr - 6);
        g.lineTo(tx, ty + rr + 6);
        g.stroke();
        g.strokeStyle = `rgba(217,251,255,${.5 + charge * .35})`;
        g.lineWidth = 2.4;
        g.beginPath();
        g.arc(tx, ty, rr + 5, -Math.PI / 2, -Math.PI / 2 + charge * TAU);
        g.stroke();
        glowCircle(g, eye.x, eye.y, 28 + charge * 22, '#77e9ff', .22 + charge * .3);
      }else{
        const fade = clamp(1 - a.beamT / a.beamDuration, 0, 1);
        const alpha = Math.min(1, fade * 2.5);
        g.strokeStyle = `rgba(76,194,231,${.16 * alpha})`;
        g.lineWidth = 32;
        g.lineCap = 'round';
        g.beginPath();
        g.moveTo(eye.x, eye.y);
        g.lineTo(tx, ty);
        g.stroke();
        g.strokeStyle = `rgba(139,234,255,${.4 * alpha})`;
        g.lineWidth = 15;
        g.stroke();
        g.strokeStyle = `rgba(229,251,255,${.9 * alpha})`;
        g.lineWidth = 5;
        g.stroke();
        g.strokeStyle = `rgba(255,255,255,${alpha})`;
        g.lineWidth = 1.6;
        g.stroke();
        const dx = tx - eye.x, dy = ty - eye.y;
        for(let i = 0; i < 4; i++){
          const u = ((this.t * .9 + i * .25) % 1);
          g.save();
          g.translate(eye.x + dx * u, eye.y + dy * u);
          g.rotate(Math.atan2(dy, dx));
          g.strokeStyle = `rgba(177,247,255,${.32 * alpha})`;
          g.lineWidth = 1.2;
          g.beginPath();
          g.ellipse(0, 0, 7, 17 + Math.sin(this.t * 11 + i) * 3, 0, 0, TAU);
          g.stroke();
          g.restore();
        }
        glowCircle(g, tx, ty, 44, '#8ae9ff', .35 * alpha);
      }
      g.restore();
    }
  }

  class TrainBoss {
    constructor(spec){
      this.spec = spec;
      this.kind = 'train';
      this.x = spec.x;
      this.y = spec.y;
      this.homeX = spec.x;
      this.maxHp = spec.hp;
      this.hp = spec.hp;
      this.name = spec.name || '雪原装甲列车';
      this.shortName = spec.shortName || '霜铁号';
      this.designation = spec.designation || '装甲列车';
      this.en = spec.en || 'WINTER DREADNOUGHT';
      this.playerLimitBase = spec.playerLimitX || spec.x - 230;
      this.playerLimitX = this.playerLimitBase;
      this.active = false;
      this.dead = false;
      this.startDelay = 0;
      this.t = 0;
      this.bob = 0;
      this.phase = 1;
      this.cd = 1.8;
      this.action = null;
      this.attackIndex = 0;
      this.hitFlash = 0;
      this.hitPoint = null;
      this.muzzleFlash = 0;
      this.recoil = 0;
    }
    get bounds(){
      return { x: this.x - 215, y: this.y - 300 + this.bob, w: 340, h: 300 };
    }
    get core(){
      // Mounted proud of the front armor so the weak point is actually reachable.
      return { x: this.x - 212, y: this.y - 116 + this.bob, r: 38 };
    }
    get hudStatus(){
      if(this.phase > 1) return { text: 'OVERDRIVE', color: '#ff8b55' };
      return { text: '铁路炮 / 近炸爆破弹', color: 'rgba(206,197,179,.5)' };
    }
    activate(game){
      if(this.active) return;
      this.active = true;
      this.startDelay = 1.8;
      this.cd = .85;
      this.t = 0;
    }
    update(dt, game){
      this.t += dt;
      this.bob = Math.sin(this.t * 1.7) * 2;
      this.hitFlash = Math.max(0, this.hitFlash - dt);
      this.muzzleFlash = Math.max(0, this.muzzleFlash - dt);
      this.recoil = Math.max(0, this.recoil - dt * 7);
      if(this.active && !this.dead && Math.random() < dt * 4){
        game.particles.trail(this.x + rand(-130, 25), this.y - rand(245, 305), 'rgba(58,57,50,.8)', rand(7, 13), rand(.8, 1.3));
      }
      if(!this.active || this.dead) return;
      if(this.startDelay > 0){ this.startDelay -= dt; return; }
      if(game.player.dead) return;
      if(this.action) this.updateAction(dt, game);
      else{
        this.cd -= dt;
        if(this.cd <= 0) this.chooseAction(game);
      }
    }
    chooseAction(game){
      const cycle = this.phase === 1
        ? ['siege', 'cannon', 'flak', 'cannon']
        : ['siege', 'flak', 'cannon', 'siege', 'flak'];
      const name = cycle[this.attackIndex++ % cycle.length];
      this.action = { name, t: 0, fired: 0 };
      if(name !== 'cannon') sound.sfx('alarm');
    }
    updateAction(dt, game){
      const a = this.action;
      if(!a) return;
      a.t += dt;
      if(a.name === 'cannon'){
        const shots = this.phase === 1 ? 2 : 3;
        if(a.t >= .32 + a.fired * .24 && a.fired < shots){
          this.fireCannon(game);
          a.fired++;
        }
        if(a.t > .32 + shots * .24 + .5) this.finishAction(this.phase === 1 ? .95 : .55);
      }else if(a.name === 'flak'){
        const shots = this.phase === 1 ? 3 : 4;
        if(a.t >= .28 + a.fired * .25 && a.fired < shots){
          this.launchFlak(game, a.fired);
          a.fired++;
        }
        if(a.t > .28 + shots * .25 + .5) this.finishAction(this.phase === 1 ? .9 : .5);
      }else if(a.name === 'siege'){
        const shots = this.phase === 1 ? 2 : 3;
        if(a.t >= .34 + a.fired * .34 && a.fired < shots){
          this.launchSiege(game, a.fired);
          a.fired++;
        }
        if(a.t > .34 + shots * .34 + .55) this.finishAction(this.phase === 1 ? .95 : .5);
      }
    }
    finishAction(cd){
      this.action = null;
      this.cd = cd;
    }
    fireCannon(game){
      const sx = this.x - 168;
      const sy = this.y - 214 + this.bob;
      const p = game.player;
      const a = Math.atan2(p.centerY - sy, p.x + p.vx * .14 - sx) + rand(-.025, .025);
      game.enemyBullets.push(new EnemyBullet(sx, sy, Math.cos(a) * 500, Math.sin(a) * 500, {
        r: 7, color: '#ffd18a', life: 4, type: 'heavy'
      }));
      this.muzzleFlash = .1;
      this.recoil = 1;
      game.particles.muzzle(sx, sy, a, '#ffe5ad', 1.6);
      game.shake = Math.max(game.shake, 4);
      sound.sfx('bossCannon');
    }
    launchFlak(game, index){
      const sx = this.x - 48;
      const sy = this.y - 256 + this.bob;
      const p = game.player;
      // Track the player's current position instead of using a fixed-distance fuse.
      // This lets the flak shell reach a player camping at the far end of the arena
      // and airburst close to them rather than exploding near the train.
      const targetX = clamp(
        p.x + p.vx * .3 + (index - 1.5) * 44 + rand(-22, 22),
        game.stage.arenaLeft + 28,
        this.x - 250
      );
      const targetY = clamp(p.centerY - rand(4, 22), 278, GROUND_Y - 58);
      const dx = targetX - sx;
      const dy = targetY - sy;
