<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b0c">
<title>钢铁突击 · IRON ASSAULT</title>
<style>
  :root{
    --ink:#060a0b;
    --paper:#f4e8d4;
    --ember:#ff6a35;
    --gold:#ffc164;
    --jade:#5ee4c2;
    --steel:#8a9d99;
  }
  *{ box-sizing:border-box; }
  html,body{ width:100%; height:100%; margin:0; }
  html{ background:#060809; }
  body{
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 42%, rgba(81,42,28,.22), transparent 55%),
      linear-gradient(145deg, #0a0e0f 0%, #050708 48%, #090b0c 100%);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    color:var(--paper);
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.18;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:54px 54px;
    mask-image:radial-gradient(circle at center, #000, transparent 76%);
    -webkit-mask-image:radial-gradient(circle at center, #000, transparent 76%);
  }
  #app{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
  }
  #shell{
    position:relative;
    width:min(97vw, calc(95vh * 16 / 9));
    aspect-ratio:16 / 9;
    overflow:hidden;
    background:#030505;
    border:1px solid rgba(181,139,89,.35);
    box-shadow:
      0 0 0 1px rgba(0,0,0,.8),
      0 28px 80px rgba(0,0,0,.74),
      0 0 90px rgba(188,79,38,.08);
    isolation:isolate;
  }
  #shell::before{
    content:"";
    position:absolute;
    z-index:6;
    inset:0;
    pointer-events:none;
    box-shadow:
      inset 0 0 80px rgba(0,0,0,.55),
      inset 0 0 0 1px rgba(255,220,175,.05);
  }
  #shell::after{
    content:"";
    position:absolute;
    z-index:7;
    inset:0;
    pointer-events:none;
    opacity:.15;
    background:repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 2px,
      rgba(0,0,0,.32) 3px,
      transparent 4px
    );
    mix-blend-mode:multiply;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    background:#040708;
    outline:none;
    image-rendering:auto;
    touch-action:none;
  }
  #touchUI{
    display:none;
    position:absolute;
    z-index:9;
    inset:0;
    pointer-events:none;
  }
  body.touch #touchUI.show{ display:block; }
  #stickZone{
    position:absolute;
    left:0;
    bottom:0;
    width:46%;
    height:55%;
    pointer-events:auto;
    touch-action:none;
  }
  #stickBase{
    position:absolute;
    left:clamp(20px, 4.5vw, 58px);
    bottom:clamp(18px, 4vh, 44px);
    width:clamp(104px, 18vh, 148px);
    aspect-ratio:1;
    border-radius:50%;
    border:1px solid rgba(255,211,164,.24);
    background:
      radial-gradient(circle at 50% 45%, rgba(255,173,104,.07), transparent 64%),
      rgba(4,10,11,.34);
    box-shadow:inset 0 0 30px rgba(0,0,0,.3);
    backdrop-filter:blur(2px);
  }
  #stickBase::before,
  #stickBase::after{
    content:"";
    position:absolute;
    background:rgba(245,231,208,.1);
  }
  #stickBase::before{ left:50%; top:14%; bottom:14%; width:1px; }
  #stickBase::after{ top:50%; left:14%; right:14%; height:1px; }
  #stickKnob{
    position:absolute;
    left:50%;
    top:50%;
    width:43%;
    aspect-ratio:1;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:
      radial-gradient(circle at 38% 32%, rgba(255,231,201,.38), transparent 28%),
      radial-gradient(circle at 50% 55%, rgba(255,105,53,.55), rgba(101,35,18,.78));
    border:1px solid rgba(255,205,152,.55);
    box-shadow:
      0 5px 16px rgba(0,0,0,.45),
      0 0 22px rgba(255,92,40,.18);
    transition:transform .06s linear;
  }
  #stickBase.active #stickKnob{ transition:none; }
  #touchButtons{
    position:absolute;
    right:clamp(16px, 3.6vw, 48px);
    bottom:clamp(22px, 5vh, 50px);
    display:flex;
    align-items:flex-end;
    gap:clamp(12px, 2.5vw, 26px);
    pointer-events:none;
  }
  .touch-btn{
    pointer-events:auto;
    position:relative;
    width:clamp(68px, 12vh, 98px);
    aspect-ratio:1;
    border-radius:50%;
    border:1px solid rgba(255,204,151,.45);
    color:var(--paper);
    background:
      radial-gradient(circle at 38% 32%, rgba(255,255,255,.15), transparent 30%),
      radial-gradient(circle at 50% 58%, rgba(253,104,51,.33), rgba(28,14,11,.6));
    box-shadow:
      inset 0 0 22px rgba(0,0,0,.3),
      0 8px 26px rgba(0,0,0,.32),
      0 0 20px rgba(255,100,45,.08);
    touch-action:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1px;
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
    transition:transform .08s ease, background .08s ease;
  }
  .touch-btn span{
    font:700 clamp(7px, 1.3vh, 10px)/1 Consolas, monospace;
    letter-spacing:.14em;
    opacity:.55;
  }
  .touch-btn b{
    font:700 clamp(17px, 3vh, 25px)/1.05 "Microsoft YaHei", sans-serif;
    letter-spacing:.06em;
    text-shadow:0 1px 8px rgba(255,112,55,.35);
  }
  .touch-btn.pressed{
    transform:scale(.93);
    background:
      radial-gradient(circle at 38% 32%, rgba(255,255,255,.25), transparent 30%),
      radial-gradient(circle at 50% 58%, rgba(255,142,70,.55), rgba(68,26,15,.8));
  }
  #btnDash{
    width:clamp(52px, 8.6vh, 66px);
    margin-bottom:clamp(4px, 1.4vh, 14px);
    border-color:rgba(93,229,198,.38);
    background:
      radial-gradient(circle at 38% 32%, rgba(186,255,235,.12), transparent 30%),
      radial-gradient(circle at 50% 58%, rgba(52,168,144,.28), rgba(8,22,20,.58));
  }
  #btnDash b{ font-size:clamp(14px, 2.2vh, 19px); }
  #btnJump{ margin-bottom:clamp(30px, 7vh, 62px); }
  #btnFire{ width:clamp(80px, 14vh, 112px); }
  #btnPause{
    position:absolute;
    pointer-events:auto;
    left:50%;
    bottom:clamp(8px, 2vh, 16px);
    transform:translateX(-50%);
    width:44px;
    height:34px;
    border:1px solid rgba(255,210,162,.28);
    border-radius:8px;
    background:rgba(5,11,12,.56);
    color:rgba(247,233,211,.72);
    font:700 11px/1 Consolas, monospace;
    letter-spacing:.08em;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  #btnPause:active{ background:rgba(255,104,50,.2); }
  @media (max-width: 820px) and (orientation: portrait){
    #app{ padding:0; }
    body.touch #shell{
      width:100vw;
      height:100dvh;
      aspect-ratio:auto;
      border:0;
    }
    body.touch canvas{
      width:100%;
      height:100%;
      object-fit:contain;
    }
    #touchUI::after{
      content:"建议横屏游玩";
      position:absolute;
      left:50%;
      top:max(12px, env(safe-area-inset-top));
      transform:translateX(-50%);
      padding:6px 12px;
      border:1px solid rgba(255,206,153,.18);
      border-radius:99px;
      background:rgba(4,9,10,.5);
      color:rgba(245,231,208,.52);
      font-size:11px;
      letter-spacing:.08em;
      white-space:nowrap;
    }
  }
  @media (prefers-reduced-motion: reduce){
    #stickKnob{ transition:none; }
  }

    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
    return x - Math.floor(x);
  }

    let a = seed >>> 0;
    return function(){
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function rankForScore(score){
    if(score >= 100000) return 'SSS';
    if(score >= 95000) return 'S';
    if(score >= 90000) return 'A';
    if(score >= 70000) return 'B';
    if(score >= 25000) return 'C';

    try{
      const raw = JSON.parse(storageGet('ironAssault.history', '[]'));
      if(!Array.isArray(raw)) return [];
      return raw
        .filter(r => r && Number.isFinite(+r.score))
        .map(r => {
          const score = Math.max(0, Math.round(+r.score));
          return {
            score,
            time: Math.max(0, Math.round(+r.time || 0)),
            deaths: Math.max(0, Math.round(+r.deaths || 0)),
            combo: Math.max(0, Math.round(+r.combo || 0)),
            bosses: Math.max(0, Math.round(+r.bosses || 0)),
            rank: rankForScore(score)
          };
        })
        .sort((a, b) => b.score - a.score || a.time - b.time)
        .slice(0, 5);
    }catch(e){
      return [];
    }

  function saveRunHistory(list){
    storageSet('ironAssault.history', JSON.stringify(list.slice(0, 5)));

  function roundRect(g, x, y, w, h, r){
    const rr = Math.min(r, w * .5, h * .5);
    g.beginPath();
    g.moveTo(x + rr, y);
    g.arcTo(x + w, y, x + w, y + h, rr);
    g.arcTo(x + w, y + h, x, y + h, rr);
    g.arcTo(x, y + h, x, y, rr);
    g.arcTo(x, y, x + w, y, rr);
    g.closePath();
  }

  function cutCornerRect(g, x, y, w, h, cut){
    g.beginPath();
    g.moveTo(x + cut, y);
    g.lineTo(x + w, y);
    g.lineTo(x + w, y + h - cut);
    g.lineTo(x + w - cut, y + h);
    g.lineTo(x, y + h);
    g.lineTo(x, y + cut);
    g.closePath();
  }

  function drawText(g, text, x, y, font, color, align = 'left', baseline = 'alphabetic'){
    g.font = font;
    g.fillStyle = color;
    g.textAlign = align;
    g.textBaseline = baseline;
    g.fillText(text, x, y);
  }

  function hexToRgba(hex, a){
    const h = hex.replace('#', '');
    const v = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
    const num = parseInt(v, 16);
    return `rgba(${(num >> 16) & 255},${(num >> 8) & 255},${num & 255},${a})`;
  }

  function glowCircle(g, x, y, r, color, alpha = 1){
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, hexToRgba(color, .8 * alpha));
    grad.addColorStop(.26, hexToRgba(color, .32 * alpha));
    grad.addColorStop(1, hexToRgba(color, 0));
    g.fillStyle = grad;
    g.beginPath();
    g.arc(x, y, r, 0, TAU);
    g.fill();
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh){
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    return dist2(cx, cy, nx, ny) <= r * r;
  }

    return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh;

    const vx = x2 - x1, vy = y2 - y1;

    t = clamp(t, 0, 1);
    const dx = px - (x1 + vx * t);
    const dy = py - (y1 + vy * t);
    return dx * dx + dy * dy;

  class SoundSystem {
    constructor(){
      this.ctx = null;
      this.master = null;
      this.musicBus = null;
      this.sfxBus = null;
      this.noiseBuffer = null;
      this.muted = storageGet('ironAssault.muted', '0') === '1';
      this.trackName = 'none';
      this.track = null;
      this.step = 0;
      this.nextNoteTime = 0;
      this.stepDur = .1;
      this.trackLength = 16;
      this.playedSteps = 0;
      this.paused = false;
      this.lastHitSfx = 0;
    }

    unlock(){
      if(!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        try{
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.musicBus = this.ctx.createGain();
          this.sfxBus = this.ctx.createGain();
          this.master.gain.value = this.muted ? 0 : .72;
          this.musicBus.gain.value = .34;
          this.sfxBus.gain.value = .5;
          this.musicBus.connect(this.master);
          this.sfxBus.connect(this.master);
          this.master.connect(this.ctx.destination);

          const len = Math.floor(this.ctx.sampleRate * .8);
          this.noiseBuffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
          const data = this.noiseBuffer.getChannelData(0);
          for(let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        }catch(e){
          this.ctx = null;
        }
      }
      if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      if(this.ctx) this.applyMute();
    }

    applyMute(){
      if(!this.master || !this.ctx) return;
      const target = this.muted ? 0 : .72;
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setTargetAtTime(target, this.ctx.currentTime, .025);
    }

    toggleMute(){
      this.muted = !this.muted;
      storageSet('ironAssault.muted', this.muted ? '1' : '0');
      this.applyMute();
      if(!this.muted) this.unlock();
      return this.muted;
    }

    setTrack(name){
      if(this.trackName === name) return;
      this.trackName = name;
      this.track = TRACK_DATA[name] || null;
      this.trackLength = this.track ? (this.track.length || 16) : 16;
      this.playedSteps = 0;
      this.step = 0;
      if(this.track && this.ctx){
        this.stepDur = 60 / this.track.bpm / 4;
        this.nextNoteTime = this.ctx.currentTime + .08;
      }
    }

    setPaused(p){
      this.paused = p;
      if(!p && this.ctx && this.track) this.nextNoteTime = this.ctx.currentTime + .05;
    }

    update(){
      if(!this.ctx || !this.track || this.muted || this.paused) return;
      if(this.ctx.state !== 'running') return;
      if(this.track.once && this.playedSteps >= this.trackLength){
        this.track = null;
        this.trackName = 'none';
        return;
      }
      if(this.nextNoteTime < this.ctx.currentTime - .4){
        this.nextNoteTime = this.ctx.currentTime + .02;
      }
      const horizon = this.ctx.currentTime + .16;
      let guard = 0;
      while(this.nextNoteTime < horizon && guard++ < 12){
        if(this.track.once && this.playedSteps >= this.trackLength) break;
        this.scheduleStep(this.step, this.nextNoteTime, this.stepDur);
        this.nextNoteTime += this.stepDur;
        this.playedSteps++;
        this.step = (this.step + 1) % this.trackLength;
      }
    }

    scheduleStep(step, t, dur){
      const tr = this.track;
      if(!tr) return;
      const dstep = step % 16;
      const d = tr.drums;
      if(d.kick.includes(dstep)) this.kick(t, dstep === 0 ? .23 : .15);
      if(d.snare.includes(dstep)) this.snare(t, .12);
      if(d.hat.includes(dstep)) this.hat(t, .028, false);
      if(d.openHat.includes(dstep)) this.hat(t, .04, true);

      const bassNote = tr.bass[step];
      if(bassNote != null){
        this.note(midi(bassNote), t, dur * 1.88, tr.bassType || 'triangle', .14, this.musicBus, 160);
        this.note(midi(bassNote + 12), t, dur * .72, tr.bassTopType || 'square', .018, this.musicBus);
      }
      const leadNote = tr.lead[step];
      if(leadNote != null){
        this.note(midi(leadNote), t, dur * 1.36, tr.leadType, .032, this.musicBus, 2600);
      }
      const arpNote = tr.arp[step];
      if(arpNote != null && step % 2 === 1){
        this.note(midi(arpNote), t, dur * .58, tr.arpType || 'triangle', .016, this.musicBus);
      }
      if(tr.pad && step === 0){
        this.pad(midi(50), midi(57), t, dur * 15.5, .016);
      }
      if(tr.pad && step === 8){
        this.pad(midi(48), midi(55), t, dur * 7.5, .014);
      }
      if(tr.pad && tr.length > 16 && step === 16){
        this.pad(midi(50), midi(57), t, dur * 7.5, .012);
      }
      if(tr.pad && tr.length > 16 && step === 24){
        this.pad(midi(48), midi(55), t, dur * 7.5, .012);
      }
    }

    note(freq, t, dur, type, vol, bus, lowpass = 0){
      if(!this.ctx || this.muted) return;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      let node = o;
      if(lowpass){
        const f = this.ctx.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = lowpass;
        f.Q.value = .7;
        node.connect(f);
        f.connect(g);
      }else{
        node.connect(g);
      }
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + .008);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      g.connect(bus || this.musicBus);
      o.start(t);
      o.stop(t + dur + .02);
    }

    pad(f1, f2, t, dur, vol){
      if(!this.ctx || this.muted) return;
      for(const f of [f1, f2]){
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        o.type = 'sawtooth';
        o.frequency.value = f;
        o.detune.value = f === f1 ? -7 : 6;
        filter.type = 'lowpass';
        filter.frequency.value = 420;
        g.gain.setValueAtTime(.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + .3);
        g.gain.linearRampToValueAtTime(vol * .7, t + dur - .3);
        g.gain.exponentialRampToValueAtTime(.0001, t + dur);
        o.connect(filter);
        filter.connect(g);
        g.connect(this.musicBus);
        o.start(t);
        o.stop(t + dur + .03);
      }
    }

    kick(t, vol){
      if(!this.ctx) return;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(44, t + .11);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .16);
      o.connect(g);
      g.connect(this.musicBus);
      o.start(t);
      o.stop(t + .18);
    }

    noise(t, dur, vol, filterType, filterFreq, bus){
      if(!this.ctx || !this.noiseBuffer) return;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuffer;
      const f = this.ctx.createBiquadFilter();
      f.type = filterType;
      f.frequency.value = filterFreq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      src.connect(f);
      f.connect(g);
      g.connect(bus || this.sfxBus);
      src.start(t);
      src.stop(t + dur + .02);
    }

    snare(t, vol){
      this.noise(t, .13, vol, 'highpass', 1200, this.musicBus);
      this.note(185, t, .07, 'triangle', .035, this.musicBus);
    }
    hat(t, vol, open){
      this.noise(t, open ? .12 : .032, vol, 'highpass', 6800, this.musicBus);
    }

    sfx(name){
      if(!this.ctx || this.muted || this.paused) return;
      const t = this.ctx.currentTime + .005;
      switch(name){
        case 'rifle':
          this.note(620, t, .065, 'square', .055, this.sfxBus, 1800);
          this.note(170, t, .07, 'triangle', .04, this.sfxBus);
          this.noise(t, .035, .032, 'highpass', 2200, this.sfxBus);
          break;
        case 'machine':
          this.note(440 + Math.random() * 50, t, .045, 'square', .032, this.sfxBus, 2200);
          this.noise(t, .025, .022, 'highpass', 3000, this.sfxBus);
          break;
        case 'spread':
          this.note(220, t, .11, 'sawtooth', .06, this.sfxBus, 900);
          this.note(95, t, .12, 'square', .045, this.sfxBus);
          this.noise(t, .1, .05, 'lowpass', 1200, this.sfxBus);
          break;
        case 'laser':
          this.note(1500, t, .16, 'sawtooth', .035, this.sfxBus, 4200);
          this.note(820, t + .01, .13, 'square', .025, this.sfxBus, 2600);
          break;
        case 'jump':
          this.note(240, t, .12, 'triangle', .055, this.sfxBus);
          break;
        case 'dash':
          this.noise(t, .18, .06, 'bandpass', 1200, this.sfxBus);
          this.note(300, t, .13, 'sawtooth', .02, this.sfxBus, 900);
          break;
        case 'snipe':
          this.note(720, t, .1, 'sawtooth', .05, this.sfxBus, 2600);
          this.noise(t, .16, .06, 'highpass', 1700, this.sfxBus);
          break;
        case 'beep':
          this.note(1040, t, .06, 'square', .018, this.sfxBus, 3000);
          break;
        case 'flak':
          this.noise(t, .18, .055, 'highpass', 900, this.sfxBus);
          this.note(160, t, .12, 'square', .025, this.sfxBus, 250);
          break;
        case 'mortar':
          this.noise(t, .2, .05, 'lowpass', 500, this.sfxBus);
          this.note(110, t, .18, 'triangle', .04, this.sfxBus, 180);
          break;
        case 'dart':
          this.note(620, t, .07, 'square', .012, this.sfxBus, 2600);
          this.note(840, t + .045, .06, 'triangle', .01, this.sfxBus, 3000);
          break;
        case 'vent':
          this.noise(t, .5, .075, 'lowpass', 700, this.sfxBus);
          this.note(85, t, .35, 'sine', .05, this.sfxBus);
          break;
        case 'thunder':
          this.noise(t, .45, .12, 'lowpass', 1500, this.sfxBus);
          this.note(54, t, .6, 'sine', .08, this.sfxBus);
          break;
        case 'hurt':
          this.note(150, t, .26, 'sawtooth', .075, this.sfxBus, 650);
          this.noise(t, .15, .08, 'lowpass', 900, this.sfxBus);
          break;
        case 'enemyHit':
          if(performance.now() - this.lastHitSfx < 35) return;
          this.lastHitSfx = performance.now();
          this.note(930, t, .03, 'square', .02, this.sfxBus, 3000);
          break;
        case 'enemyDie':
          this.note(180, t, .16, 'sawtooth', .035, this.sfxBus, 900);
          this.noise(t, .14, .04, 'lowpass', 1300, this.sfxBus);
          break;
        case 'explosion':
          this.noise(t, .5, .18, 'lowpass', 900, this.sfxBus);
          this.note(90, t, .4, 'sine', .13, this.sfxBus);
          this.noise(t + .03, .18, .07, 'highpass', 1800, this.sfxBus);
          break;
        case 'pickup':
          this.note(520, t, .09, 'square', .05, this.sfxBus, 3200);
          this.note(780, t + .08, .12, 'square', .045, this.sfxBus, 3800);
          this.note(1040, t + .16, .14, 'triangle', .04, this.sfxBus);
          break;
        case 'checkpoint':
          this.note(392, t, .16, 'triangle', .06, this.sfxBus);
          this.note(523, t + .13, .16, 'triangle', .06, this.sfxBus);
          this.note(659, t + .26, .24, 'sine', .06, this.sfxBus);
          break;
        case 'alarm':
          this.note(220, t, .22, 'square', .05, this.sfxBus, 900);
          this.note(180, t + .24, .3, 'square', .045, this.sfxBus, 800);
          break;
        case 'bossHurt':
          this.note(90, t, .09, 'sawtooth', .035, this.sfxBus, 420);
          this.noise(t, .05, .03, 'lowpass', 700, this.sfxBus);
          break;
        case 'beam':
          this.note(140, t, .65, 'sawtooth', .045, this.sfxBus, 1200);
          this.noise(t, .55, .06, 'bandpass', 1600, this.sfxBus);
          break;
        case 'bossCannon':
          this.note(95, t, .22, 'square', .07, this.sfxBus, 500);
          this.note(58, t, .3, 'sine', .08, this.sfxBus);
          this.noise(t, .16, .075, 'lowpass', 850, this.sfxBus);
          break;
        case 'missileLaunch':
          this.noise(t, .5, .075, 'bandpass', 900, this.sfxBus);
          this.note(190, t, .35, 'sawtooth', .035, this.sfxBus, 700);
          break;
        case 'charge': {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(85, t);
          o.frequency.exponentialRampToValueAtTime(520, t + .8);
          g.gain.setValueAtTime(.0001, t);
          g.gain.linearRampToValueAtTime(.024, t + .2);
          g.gain.linearRampToValueAtTime(.032, t + .7);
          g.gain.exponentialRampToValueAtTime(.0001, t + .95);
          o.connect(g);
          g.connect(this.sfxBus);
          o.start(t);
          o.stop(t + 1);
          break;
        }
        case 'stageClear':
          [392, 494, 587, 784].forEach((f, i) => this.note(f, t + i * .12, .3, 'triangle', .06, this.sfxBus));
          break;
        case 'victory':
          [392, 523, 659, 784, 1046].forEach((f, i) => this.note(f, t + i * .14, .5, 'triangle', .06, this.sfxBus));
          break;
        case 'gameOver':
          [330, 294, 247, 196].forEach((f, i) => this.note(f, t + i * .19, .45, 'sawtooth', .055, this.sfxBus, 900));
          break;
        case 'ui':
          this.note(720, t, .035, 'square', .025, this.sfxBus, 3000);
          break;
      }
    }
  }

    down: Object.create(null),
    pressed: Object.create(null),
    pointerPressed: false,
    clear(){
      this.pressed = Object.create(null);
      this.pointerPressed = false;
    },
    isDown(a){ return !!this.down[a]; },
    wasPressed(a){ return !!this.pressed[a]; },
    axisX(){ return (this.isDown('right') ? 1 : 0) - (this.isDown('left') ? 1 : 0); },
    axisY(){ return (this.isDown('down') ? 1 : 0) - (this.isDown('up') ? 1 : 0); }
  };

  window.addEventListener('keydown', e => {
    const action = KEY_MAP[e.code];
    if(!action) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    e.preventDefault();
    sound.unlock();
    if(!e.repeat){
      input.pressed[action] = true;
      input.down[action] = true;
    }
  }, { passive: false });

  window.addEventListener('keyup', e => {
    const action = KEY_MAP[e.code];
    if(!action) return;
    e.preventDefault();
    input.down[action] = false;
  }, { passive: false });

  window.addEventListener('blur', () => {
    for(const k in input.down) input.down[k] = false;
  });

  canvas.addEventListener('pointerdown', e => {
    sound.unlock();
    input.pointerPressed = true;
    if(e.pointerType === 'touch') e.preventDefault();
  });

  function drawSumSineRidge(target, camX, parallax, baseY, amp, colorTop, colorBottom, seed, step = 26){
    const offset = camX * parallax;
    target.beginPath();
    target.moveTo(-40, H + 20);
    for(let x = -40; x <= W + 40; x += step){
      const wx = x + offset;
      const n =
        Math.sin(wx * .0041 + seed) * .52 +
        Math.sin(wx * .0107 + seed * 1.7) * .26 +
        Math.sin(wx * .0241 + seed * 2.3) * .12 +
        Math.sin(wx * .0021 + seed * .4) * .25;
      const y = baseY - (n * .5 + .55) * amp;
      target.lineTo(x, y);
    }
    target.lineTo(W + 40, H + 20);
    target.closePath();
    const grad = target.createLinearGradient(0, baseY - amp, 0, baseY + 40);
    grad.addColorStop(0, colorTop);
    grad.addColorStop(1, colorBottom);
    target.fillStyle = grad;
    target.fill();
  }

  function drawRidgeHighlight(target, camX, parallax, baseY, amp, seed, color, step = 26){
    const offset = camX * parallax;
    target.beginPath();
    for(let x = -40; x <= W + 40; x += step){
      const wx = x + offset;
      const n =
        Math.sin(wx * .0041 + seed) * .52 +
        Math.sin(wx * .0107 + seed * 1.7) * .26 +
        Math.sin(wx * .0241 + seed * 2.3) * .12 +
        Math.sin(wx * .0021 + seed * .4) * .25;
      const y = baseY - (n * .5 + .55) * amp;
      if(x === -40) target.moveTo(x, y);
      else target.lineTo(x, y);
    }
    target.strokeStyle = color;
    target.lineWidth = 1.2;
    target.stroke();
  }

  function drawJungleTrees(target, camX, parallax, baseY, spacing, minH, maxH, color, seedOffset, alpha = 1){
    target.save();
    target.globalAlpha = alpha;
    const off = camX * parallax;
    const first = Math.floor((off - 260) / spacing);
    const last = Math.ceil((off + W + 260) / spacing);
    for(let i = first; i <= last; i++){
      const sx = i * spacing - off + hash(i + seedOffset) * spacing * .48;
      const hgt = minH + hash(i * 1.91 + seedOffset) * (maxH - minH);
      const trunkW = 5 + hash(i * 2.7 + seedOffset) * 8;
      target.fillStyle = color;
      target.beginPath();
      target.moveTo(sx - trunkW, baseY + 20);
      target.lineTo(sx - trunkW * .28, baseY - hgt * .72);
      target.lineTo(sx + trunkW * .2, baseY - hgt * .72);
      target.lineTo(sx + trunkW, baseY + 20);
      target.closePath();
      target.fill();
      // Branches
      const branchY = baseY - hgt * (.5 + hash(i + 8) * .18);
      const dir = hash(i + 11) > .5 ? 1 : -1;
      target.strokeStyle = color;
      target.lineWidth = Math.max(3, trunkW * .42);
      target.lineCap = 'round';
      target.beginPath();
      target.moveTo(sx, branchY);
      target.quadraticCurveTo(sx + dir * 26, branchY - 18, sx + dir * (38 + hash(i + 2) * 18), branchY - 32);
      target.stroke();
      // Canopy blobs
      const canopyY = baseY - hgt;
      const blobs = 4 + Math.floor(hash(i + 13) * 3);
      for(let j = 0; j < blobs; j++){
        const bx = sx + (hash(i * 13 + j * 3.1) - .5) * (86 + hash(i) * 48);
        const by = canopyY + (hash(i * 17 + j * 5.7) - .5) * 44;
        const rx = 34 + hash(i * 7 + j * 1.7) * 42;
        const ry = 12 + hash(i * 11 + j * 2.3) * 20;
        target.beginPath();
        target.ellipse(bx, by, rx, ry, hash(i + j) * .5 - .25, 0, TAU);
        target.fill();
      }
      // A couple of long leaves
      target.strokeStyle = color;
      target.lineWidth = 2;
      for(let j = 0; j < 3; j++){
        const lx = sx + (hash(i * 3 + j) - .5) * 60;
        const ly = canopyY + hash(i + j * 7) * 30;
        target.beginPath();
        target.moveTo(lx, ly);
        target.quadraticCurveTo(lx + (j - 1) * 20, ly - 16, lx + (j - 1) * 30, ly + 7);
        target.stroke();
      }
    }
    target.restore();
  }

      g.fillStyle = '#ffd9a4';
      for(let i = 0; i < 4; i++){
        const x = sunX - 280 + i * 130 + Math.sin(t * .08 + i) * 20;
        g.beginPath();
        g.moveTo(x, 0);
        g.lineTo(x + 120, 0);
        g.lineTo(x + 450, H);
        g.lineTo(x + 250, H);
        g.closePath();
        g.fill();

      g.restore();

      // Mountain layers
      drawSumSineRidge(g, camX, .055, 386, 124, '#183b3b', '#102b2b', 1.1);
      drawRidgeHighlight(g, camX, .055, 386, 124, 1.1, 'rgba(117,162,142,.11)');

      // Haze over horizon
      const haze = g.createLinearGradient(0, 300, 0, 476);
      haze.addColorStop(0, 'rgba(222,142,94,0)');
      haze.addColorStop(.6, 'rgba(204,124,81,.14)');
      haze.addColorStop(1, 'rgba(30,48,42,.58)');
      g.fillStyle = haze;
      g.fillRect(0, 280, W, 220);

      // Tree layers
      drawJungleTrees(g, camX, .26, 482, 176, 96, 188, 'rgba(8,29,27,.88)', 11, .9);
      drawJungleTrees(g, camX, .38, 490, 238, 150, 266, 'rgba(5,22,21,.96)', 73, 1);

      // Birds
      g.save();
      g.strokeStyle = 'rgba(8,20,19,.7)';
      g.lineWidth = 1.6;
      for(let i = 0; i < 4; i++){
        const bx = ((t * (11 + i * 2.2) + i * 270 - camX * .04) % 1300 + 1300) % 1300 - 160;
        const by = 108 + i * 16 + Math.sin(t * .7 + i) * 5;

        g.quadraticCurveTo(bx + 4, by - 3, bx + 9, by + flap);

      g.restore();

      g.save();

      for(let side = 0; side < 2; side++){

        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(x, 478 - bh + 8);
        g.quadraticCurveTo(x + bw * .5, 478 - bh + 110, x + bw * 1.8, 478 - bh + 20);
        g.stroke();
        // warning light
        const blink = Math.sin(t * 2.6 + i * 1.3) > .5;
        if(blink){
          g.fillStyle = '#ff6a3d';
          g.fillRect(x + bw * .62, 478 - bh - 51, 3, 3);
          glowCircle(g, x + bw * .62 + 1, 478 - bh - 50, 14, '#ff5a2f', .4);
        }
      }
      g.restore();

      // Overhead cables
      g.save();
      g.strokeStyle = 'rgba(2,5,7,.7)';
      g.lineWidth = 2;
      for(let i = 0; i < 3; i++){
        const y = 50 + i * 35;
        g.beginPath();
        g.moveTo(-40, y);
        g.bezierCurveTo(260, y + 90 + i * 20, 580, y + 14, W + 40, y + 74);
        g.stroke();
      }
      g.restore();
    }

    // Common bottom darkness, gives chasms depth
    const bottom = g.createLinearGradient(0, 430, 0, H);
    if(stage.theme === 'jungle'){
      bottom.addColorStop(0, 'rgba(1,8,8,0)');
      bottom.addColorStop(.55, 'rgba(1,7,7,.46)');
      bottom.addColorStop(1, 'rgba(0,3,4,.96)');
    }else if(stage.theme === 'sky' || stage.theme === 'snow'){
      bottom.addColorStop(0, 'rgba(14,23,28,0)');
      bottom.addColorStop(.55, 'rgba(18,28,34,.34)');
      bottom.addColorStop(1, 'rgba(2,7,11,.9)');
    }else if(stage.theme === 'desert'){
      bottom.addColorStop(0, 'rgba(34,20,15,0)');
      bottom.addColorStop(.55, 'rgba(39,20,14,.34)');
      bottom.addColorStop(1, 'rgba(9,5,5,.92)');
    }else{
      bottom.addColorStop(0, 'rgba(6,5,6,0)');
      bottom.addColorStop(.6, 'rgba(12,5,5,.45)');
      bottom.addColorStop(1, 'rgba(1,2,4,.96)');
    }
    g.fillStyle = bottom;
    g.fillRect(0, 420, W, H - 420);
  }

  /* =========================================================
     TERRAIN + WORLD DECOR
     ========================================================= */
  function inView(x, w, camX, margin = 80){
    return x + w > camX - margin && x < camX + W + margin;
  }

  function drawAbyssHaze(stage, camX, t){
    const g = ctx;
    g.save();
    const top = 448;
    if(stage.theme === 'jungle'){
      const grad = g.createLinearGradient(0, top, 0, H);
      grad.addColorStop(0, 'rgba(9,27,24,0)');
      grad.addColorStop(.5, 'rgba(4,15,14,.52)');
      grad.addColorStop(1, 'rgba(0,4,4,.9)');
      g.fillStyle = grad;
      g.fillRect(camX - 30, top, W + 60, H - top);
      // Mist curls in the gaps
      g.globalCompositeOperation = 'lighter';
      for(let i = 0; i < 4; i++){
        const mx = ((i * 290 + t * 8) % 1100) + camX - 80;
        g.fillStyle = 'rgba(76,122,104,.025)';
        g.beginPath();
        g.ellipse(mx, 500 + i * 9, 120, 15, 0, 0, TAU);
        g.fill();
      }
    }else{
      const grad = g.createLinearGradient(0, top, 0, H);
      if(stage.theme === 'sky' || stage.theme === 'snow'){
        grad.addColorStop(0, 'rgba(12,24,30,0)');
        grad.addColorStop(.55, 'rgba(14,27,34,.48)');
        grad.addColorStop(1, 'rgba(3,8,12,.94)');
      }else if(stage.theme === 'desert'){
        grad.addColorStop(0, 'rgba(38,22,16,0)');
        grad.addColorStop(.55, 'rgba(46,24,16,.5)');
        grad.addColorStop(1, 'rgba(12,6,5,.94)');
      }else{
        grad.addColorStop(0, 'rgba(22,10,8,0)');
        grad.addColorStop(.55, 'rgba(33,10,7,.55)');
        grad.addColorStop(1, 'rgba(4,3,5,.94)');
      }
      g.fillStyle = grad;
      g.fillRect(camX - 30, top, W + 60, H - top);
      g.globalCompositeOperation = 'lighter';
      glowCircle(g, camX + W * .5, 505, 300, (stage.theme === 'sky' || stage.theme === 'snow') ? '#58aebd' : '#d7481f', .07);
    }
    g.restore();
  }

  function drawJungleGround(stage, seg, t){
    const g = ctx;
    const x = seg.x, y = seg.y, w = seg.w;
    const base = g.createLinearGradient(0, y, 0, H);
    base.addColorStop(0, '#2f3529');
    base.addColorStop(.12, '#25291f');
    base.addColorStop(.55, '#121814');
    base.addColorStop(1, '#060a09');
    g.fillStyle = base;
    g.fillRect(x, y, w, H - y + 30);

    // Top dark lip and grass
    g.fillStyle = '#172118';
    g.fillRect(x, y - 2, w, 7);
    g.fillStyle = '#3d513a';
    g.fillRect(x, y - 4, w, 4);
    g.fillStyle = '#6b8051';
    g.fillRect(x, y - 4, w, 1.4);
    g.fillStyle = 'rgba(151,171,103,.38)';
    g.fillRect(x, y - 3.4, w, 1);

    // Dirt and undergrowth details
    const start = Math.ceil((x - 10) / 34) * 34;
    for(let px = start; px < x + w; px += 34){
      const h1 = hash(px * .013 + 4.1);
      const h2 = hash(px * .021 + 8.7);
      if(px < x + 18 || px > x + w - 18) continue;
      // tufts
      g.strokeStyle = h1 > .5 ? 'rgba(94,117,67,.7)' : 'rgba(60,83,57,.8)';
      g.lineWidth = 1;
      const blade = 3 + h1 * 7;
      g.beginPath();
      g.moveTo(px, y - 3);
      g.quadraticCurveTo(px - 2, y - 4 - blade, px - 6, y - 6 - blade);
      g.moveTo(px + 1, y - 3);
      g.quadraticCurveTo(px + 4, y - 6 - blade * .7, px + 8, y - 4 - blade);
      g.stroke();
      // rocks / roots
      if(h2 > .82){
        g.fillStyle = 'rgba(88,88,69,.3)';
        g.beginPath();
        g.ellipse(px + 4, y + 20 + h1 * 50, 6 + h1 * 9, 3 + h2 * 3, h1, 0, TAU);
        g.fill();
      }
      if(h1 > .72){
        g.strokeStyle = 'rgba(12,15,12,.45)';
        g.lineWidth = 1.2;
        g.beginPath();
        g.moveTo(px + 8, y + 8);
        g.bezierCurveTo(px + 1, y + 28, px + 17, y + 44, px + 5, y + 66);
        g.stroke();
      }
    }

    // Root columns at edges and occasional buttress
    g.fillStyle = '#0d1410';
    for(const edge of [x, x + w]){
      g.beginPath();
      g.moveTo(edge, y);
      g.lineTo(edge + (edge === x ? 22 : -22), y + 90);
      g.lineTo(edge + (edge === x ? 8 : -8), H);
      g.lineTo(edge, H);
      g.closePath();
      g.fill();
    }

    // Hanging vines at edges
    g.strokeStyle = 'rgba(41,74,45,.7)';
    g.lineWidth = 2;
    for(let i = 0; i < 5; i++){
      const vx = x + 7 + (i % 2) * (w - 16) + Math.sin(i) * 5;
      g.beginPath();
      g.moveTo(vx, y);
      g.quadraticCurveTo(vx + Math.sin(t * .8 + i) * 9, y + 38, vx - 5 + Math.cos(i) * 8, y + 66 + i * 10);
      g.stroke();
      if(i < 3){
        g.fillStyle = 'rgba(48,81,48,.8)';
        g.beginPath();
        g.ellipse(vx - 2, y + 46 + i * 12, 6, 3, .5, 0, TAU);
        g.fill();
      }
    }

    // Thin lit top rim for visibility
    g.fillStyle = 'rgba(203,221,158,.09)';
    g.fillRect(x + 20, y + 8, w - 40, 1);
  }

  function drawJunglePlatform(p, t){
    const g = ctx;
    const { x, y, w, style } = p;
    const deep = 20;
    g.save();
    // Supports / hanging vines
    g.strokeStyle = 'rgba(43,69,43,.6)';
    g.lineWidth = 1.4;
    for(let i = 0; i < 3; i++){
      const vx = x + 18 + i * (w - 36) / 2;
      g.beginPath();
      g.moveTo(vx, y + deep);
      g.quadraticCurveTo(vx + Math.sin(t * .65 + i + x) * 8, y + deep + 40, vx + Math.cos(i * 2) * 10, y + deep + 62 + i * 11);
      g.stroke();
    }
    if(style === 'wood'){
      g.fillStyle = '#251b13';
      roundRect(g, x, y, w, 16, 3);
      g.fill();
      g.fillStyle = '#513a28';
      g.fillRect(x + 4, y - 2, w - 8, 7);
      g.fillStyle = '#76593a';
      g.fillRect(x + 4, y - 2, w - 8, 2);
      const planks = Math.floor(w / 26);
      g.strokeStyle = 'rgba(18,12,9,.7)';
      g.lineWidth = 1.5;
      for(let i = 1; i < planks; i++){
        const px = x + i * w / planks;
        g.beginPath();
        g.moveTo(px, y - 1);
        g.lineTo(px + 2, y + 13);
        g.stroke();
      }
      // Rope rails
      g.strokeStyle = 'rgba(164,137,93,.4)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(x + 3, y + 1);
      g.quadraticCurveTo(x + w / 2, y - 24, x + w - 3, y + 1);
      g.stroke();
      g.beginPath();
      g.moveTo(x + 3, y + 3);
      g.quadraticCurveTo(x + w / 2, y + 22, x + w - 3, y + 3);
      g.stroke();
      for(let i = 0; i <= 5; i++){
        const rx = x + 4 + i * (w - 8) / 5;
        g.beginPath();
        g.moveTo(rx, y);
        g.lineTo(rx, y + 16);
        g.stroke();
      }
      // moss
      g.fillStyle = 'rgba(79,105,57,.62)';
      for(let i = 0; i < 4; i++){
        g.beginPath();
        g.ellipse(x + 12 + hash(x + i) * (w - 24), y - 1, 8, 2.4, 0, 0, TAU);
        g.fill();
      }
    }else{
      // Mossy ruin slab
      g.fillStyle = '#171b15';
      g.beginPath();
      g.moveTo(x, y + 3);
      g.lineTo(x + 6, y - 3);
      g.lineTo(x + w - 8, y - 3);
      g.lineTo(x + w, y + 4);
      g.lineTo(x + w - 7, y + deep);
      g.lineTo(x + 8, y + deep);
      g.closePath();
      g.fill();
      g.fillStyle = '#3a4034';
      g.beginPath();
      g.moveTo(x + 3, y);
      g.lineTo(x + 10, y - 2);
      g.lineTo(x + w - 10, y - 1);
      g.lineTo(x + w - 3, y + 3);
      g.lineTo(x + w - 16, y + 8);
      g.lineTo(x + 16, y + 8);
      g.closePath();
      g.fill();
      g.fillStyle = 'rgba(96,115,66,.7)';
      g.fillRect(x + 14, y - 1, w - 28, 2);
      g.fillStyle = 'rgba(158,181,108,.23)';
      g.fillRect(x + 20, y - 1, w - 44, 1);
      // Cracks
      g.strokeStyle = 'rgba(12,15,12,.65)';
      g.lineWidth = 1;
      for(let i = 0; i < 4; i++){
        const cx = x + 24 + hash(x + i * 2.2) * (w - 48);
        g.beginPath();
        g.moveTo(cx, y + 3);
        g.lineTo(cx + 4, y + 9);
        g.lineTo(cx + 1, y + 15);
        g.stroke();
      }
      // Stone blocks lines
      g.strokeStyle = 'rgba(13,16,12,.45)';
      for(let i = 1; i < 4; i++){
        const px = x + i * w / 4;
        g.beginPath();
        g.moveTo(px, y + 5);
        g.lineTo(px + 2, y + deep);
        g.stroke();
      }
      // little plants
      g.strokeStyle = 'rgba(94,121,69,.65)';
      for(let i = 0; i < 3; i++){
        const px = x + 18 + hash(x + i * 4.8) * (w - 36);
        g.beginPath();
        g.moveTo(px, y);
        g.quadraticCurveTo(px - 5, y - 7, px - 9, y - 5);
        g.moveTo(px, y);
        g.quadraticCurveTo(px + 4, y - 8, px + 9, y - 6);
        g.stroke();
      }
    }
    g.restore();
  }

  function drawFortressGround(stage, seg, t){
    const g = ctx;
    const x = seg.x, y = seg.y, w = seg.w;
    const base = g.createLinearGradient(0, y, 0, H);
    base.addColorStop(0, '#293236');
    base.addColorStop(.06, '#1a2326');
    base.addColorStop(.3, '#10181c');
    base.addColorStop(1, '#05090c');
    g.fillStyle = base;
    g.fillRect(x, y, w, H - y + 30);

    // Deck plate
    g.fillStyle = '#394649';
    g.fillRect(x, y - 3, w, 9);
    g.fillStyle = '#697779';
    g.fillRect(x, y - 3, w, 2);
    g.fillStyle = '#9aa8a3';
    g.fillRect(x, y - 3, w, .8);
    g.fillStyle = '#ff8b48';
    g.fillRect(x, y + 7, w, 2);
    g.fillStyle = 'rgba(255,183,96,.16)';
    g.fillRect(x, y + 9, w, 3);

    // Deck panels
    const panel0 = Math.ceil(x / 84) * 84;
    for(let px = panel0; px < x + w; px += 84){
      if(px < x + 4) continue;
      g.strokeStyle = 'rgba(6,11,13,.8)';
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(px, y + 9);
      g.lineTo(px, y + 67);
      g.stroke();
      g.strokeStyle = 'rgba(93,113,113,.16)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(px + 2, y + 10);
      g.lineTo(px + 2, y + 64);
      g.stroke();
      // rivets
      g.fillStyle = 'rgba(169,185,179,.25)';
      g.fillRect(px + 8, y + 1, 2, 2);
      g.fillRect(px + 72, y + 1, 2, 2);
    }

    // Warning stripes at segment ends
    for(const edge of [x, x + w]){
      const dir = edge === x ? 1 : -1;
      g.save();
      g.beginPath();
      g.rect(edge - (dir === 1 ? 0 : 52), y + 18, 52, 12);
      g.clip();
      for(let i = -20; i < 70; i += 12){
        g.fillStyle = (i / 12) % 2 === 0 ? 'rgba(218,171,55,.3)' : 'rgba(11,14,15,.36)';
        g.beginPath();
        g.moveTo(edge + i * dir, y + 18);
        g.lineTo(edge + (i + 10) * dir, y + 18);
        g.lineTo(edge + (i + 22) * dir, y + 30);
        g.lineTo(edge + (i + 12) * dir, y + 30);
        g.closePath();
        g.fill();
      }
      g.restore();
    }

    // Vents, pipes and machinery below deck
    for(let i = 0; i < 5; i++){
      const vx = x + 110 + i * 210 + hash(x + i) * 60;
      if(vx > x + w - 50) break;
      g.fillStyle = 'rgba(4,8,10,.8)';
      g.fillRect(vx, y + 36, 54, 22);
      g.fillStyle = 'rgba(79,101,99,.38)';
      for(let j = 0; j < 4; j++) g.fillRect(vx + 6 + j * 12, y + 39, 6, 15);
      g.fillStyle = 'rgba(255,124,58,.18)';
      g.fillRect(vx + 8, y + 61, 38, 2);
    }

    // Pipe running under the deck
    g.strokeStyle = 'rgba(78,94,94,.4)';
    g.lineWidth = 8;
    g.beginPath();
    g.moveTo(x, y + 93);
    g.lineTo(x + w, y + 93);
    g.stroke();
    g.strokeStyle = 'rgba(8,14,16,.8)';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x, y + 98);
    g.lineTo(x + w, y + 98);
    g.stroke();
    g.fillStyle = 'rgba(208,113,55,.35)';
    for(let px = Math.ceil(x / 130) * 130; px < x + w; px += 130){
      g.fillRect(px, y + 89, 3, 8);
    }

    // Dark structural supports / depth
    g.fillStyle = 'rgba(2,5,7,.82)';
    for(let px = Math.ceil(x / 160) * 160; px < x + w; px += 160){
      g.beginPath();
      g.moveTo(px, y + 30);
      g.lineTo(px + 11, y + 30);
      g.lineTo(px + 25, H);
      g.lineTo(px - 3, H);
      g.closePath();
      g.fill();
    }
  }

  function drawFortressPlatform(p, t){
    const g = ctx;
    const { x, y, w } = p;
    const deep = 18;
    g.save();

    if(p.hang){
      // suspension cables
      g.strokeStyle = 'rgba(120,137,134,.2)';
      g.lineWidth = 2;
      for(const cx of [x + 12, x + w - 12]){
        g.beginPath();
        g.moveTo(cx, y - 2);
        g.quadraticCurveTo(cx + Math.sin(t * .4 + cx) * 3, y - 80, cx - 30, -30);
        g.stroke();
      }
    }

    // Under-truss
    g.fillStyle = '#070d10';
    g.beginPath();
    g.moveTo(x + 7, y + 12);
    g.lineTo(x + w - 7, y + 12);
    g.lineTo(x + w - 22, y + 36);
    g.lineTo(x + 22, y + 36);
    g.closePath();
    g.fill();
    g.strokeStyle = 'rgba(107,126,123,.24)';
    g.lineWidth = 1.5;
    for(let px = x + 22; px < x + w - 24; px += 40){
      g.beginPath();
      g.moveTo(px, y + 13);
      g.lineTo(px + 20, y + 33);
      g.lineTo(px + 40, y + 13);
      g.stroke();
    }

    // Main deck
    g.fillStyle = '#243033';
    roundRect(g, x, y - 3, w, 15, 2);
    g.fill();
    g.fillStyle = '#48595a';
    g.fillRect(x + 2, y - 3, w - 4, 5);
    g.fillStyle = '#889795';
    g.fillRect(x + 2, y - 3, w - 4, 1.2);
    g.fillStyle = '#ff9151';
    g.fillRect(x + 5, y + 8, w - 10, 1.4);

    // Hazard stripe ends
    g.save();
    g.beginPath();
    g.rect(x + 1, y + 2, 26, 6);
    g.rect(x + w - 27, y + 2, 26, 6);
    g.clip();
    for(let side = 0; side < 2; side++){
      const start = side === 0 ? x - 8 : x + w - 28;
      for(let i = 0; i < 5; i++){
        g.fillStyle = i % 2 === 0 ? 'rgba(224,177,64,.8)' : 'rgba(10,13,14,.8)';
        g.beginPath();
        g.moveTo(start + i * 12, y + 2);
        g.lineTo(start + i * 12 + 7, y + 2);
        g.lineTo(start + i * 12 + 13, y + 8);
        g.lineTo(start + i * 12 + 6, y + 8);
        g.closePath();
        g.fill();
      }
    }
    g.restore();

    // Rivets
    g.fillStyle = 'rgba(203,215,207,.38)';
    for(let px = x + 8; px < x + w - 4; px += 20) g.fillRect(px, y + 12, 1.5, 1.5);

    // Blinking beacon
    const beaconX = x + w - 8;
    const blink = Math.sin(t * 3.1 + x * .03) > .25;
    if(blink){
      g.fillStyle = '#ff6e40';
      g.fillRect(beaconX, y - 8, 3, 4);
      glowCircle(g, beaconX + 1.5, y - 6, 12, '#ff5d33', .32);
    }
    g.restore();
  }

  function drawTerrain(stage, camX, t){
    const g = ctx;
    for(const seg of stage.ground){
      if(!inView(seg.x, seg.w, camX, 100)) continue;
      if(stage.theme === 'jungle') drawJungleGround(stage, seg, t);
      else drawFortressGround(stage, seg, t);
    }
    for(const p of stage.platforms){
      if(!inView(p.x, p.w, camX, 100)) continue;
      if(stage.theme === 'jungle') drawJunglePlatform(p, t);
      else drawFortressPlatform(p, t);
    }
    if(stage.theme === 'foundry'){
      // Molten seams bleeding through the deck plates
      g.save();
      g.globalCompositeOperation = 'lighter';
      for(const seg of stage.ground){
        if(!inView(seg.x, seg.w, camX, 80)) continue;
        for(let i = 0; i < 4; i++){
          const x = seg.x + 90 + hash(seg.x + i * 17.3) * (seg.w - 180);
          const yy = seg.y + 18 + hash(i + 9) * 28;
          g.strokeStyle = 'rgba(255,116,43,.22)';
          g.lineWidth = 1.3;
          g.beginPath();
          g.moveTo(x - 12, yy);
          g.lineTo(x - 3, yy + 4);
          g.lineTo(x + 4, yy + 1);
          g.lineTo(x + 15, yy + 7);
          g.stroke();
          glowCircle(g, x, yy + 3, 17, '#ff7a36', .07);
        }
      }
      for(const p of stage.platforms){
        if(!inView(p.x, p.w, camX, 80)) continue;
        g.fillStyle = 'rgba(255,126,52,.35)';
        g.fillRect(p.x + 12, p.y + 3, p.w - 24, 1);
      }
      g.restore();
    }else if(stage.theme === 'sky'){
      g.save();
      g.globalCompositeOperation = 'lighter';
      for(const p of stage.platforms){
        if(!inView(p.x, p.w, camX, 80)) continue;
        g.strokeStyle = 'rgba(102,206,230,.2)';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(p.x + 18, p.y + 2);
        g.lineTo(p.x + p.w - 18, p.y + 2);
        g.stroke();
        for(let i = 0; i < 3; i++){
          glowCircle(g, p.x + 24 + i * (p.w - 48) / 2, p.y + 4, 8, '#7cd9ee', .09);
        }
      }
      for(const seg of stage.ground){
        if(!inView(seg.x, seg.w, camX, 80)) continue;
        g.fillStyle = 'rgba(120,210,228,.22)';
        g.fillRect(seg.x, seg.y + 2, seg.w, 1);
      }
      g.restore();
    }else if(stage.theme === 'snow'){
      g.save();
      for(const p of stage.platforms){
        if(!inView(p.x, p.w, camX, 80)) continue;
        g.fillStyle = 'rgba(219,239,244,.52)';
        g.fillRect(p.x + 5, p.y, p.w - 10, 3);
        g.fillStyle = 'rgba(238,250,252,.22)';
        g.fillRect(p.x + 14, p.y - 1, p.w - 28, 1);
        for(let i = 0; i < 3; i++){
          const ix = p.x + 24 + i * (p.w - 48) / 2;
          g.fillStyle = 'rgba(210,238,246,.22)';
          g.beginPath();
          g.moveTo(ix - 3, p.y + 14);
          g.lineTo(ix, p.y + 6);
          g.lineTo(ix + 3, p.y + 14);
          g.closePath();
          g.fill();
        }

  function drawUpdrafts(game){
    const stage = game.stage;
    if(!stage.updrafts) return;
    const g = ctx;
    const t = game.worldTime;
    for(const u of stage.updrafts){
      if(!inView(u.x - 30, u.w + 60, game.camera.x, 80)) continue;
      const bottom = u.bottom || GROUND_Y;
      const h = bottom - u.top;
      g.save();
      const grad = g.createLinearGradient(0, u.top, 0, bottom);
      grad.addColorStop(0, 'rgba(137,229,255,0)');
      grad.addColorStop(.22, 'rgba(109,214,244,.1)');
      grad.addColorStop(.7, 'rgba(118,220,243,.16)');
      grad.addColorStop(.94, 'rgba(186,245,255,.09)');
      grad.addColorStop(1, 'rgba(186,245,255,0)');
      g.fillStyle = grad;
      g.fillRect(u.x, u.top, u.w, h);
      g.globalCompositeOperation = 'lighter';
      // Bright air rails
      g.strokeStyle = 'rgba(139,231,255,.52)';
      g.lineWidth = 1.6;
      g.setLineDash([12, 9]);
      g.lineDashOffset = -t * 130;
      g.beginPath();
      g.moveTo(u.x + 3, bottom);
      g.lineTo(u.x + 3, u.top);
      g.moveTo(u.x + u.w - 3, bottom);
      g.lineTo(u.x + u.w - 3, u.top);
      g.stroke();
      g.setLineDash([]);
      // Rising wind streaks
      for(let i = 0; i < 13; i++){
        const yy = bottom - ((t * (120 + i * 19) + i * 47) % h);
        const xx = u.x + 8 + hash(i * 3.7 + u.x) * (u.w - 16) + Math.sin(t * 1.8 + i) * 9;
        const len = 24 + hash(i + 2) * 46;
        g.strokeStyle = `rgba(196,248,255,${.16 + hash(i) * .22})`;
        g.lineWidth = 1.1 + (i % 3) * .45;
        g.beginPath();
        g.moveTo(xx, yy);
        g.lineTo(xx - 4, yy - len);
        g.stroke();
      }
      // Lifted mist puffs
      for(let i = 0; i < 4; i++){
        const yy = bottom - ((t * (78 + i * 11) + i * 83) % h);
        const xx = u.x + u.w / 2 + Math.sin(t * 1.1 + i * 2.2) * (u.w * .24);
        g.fillStyle = `rgba(183,242,255,${.045 + i * .01})`;
        g.beginPath();
        g.ellipse(xx, yy, u.w * .34, 9 + i * 2, 0, 0, TAU);
        g.fill();
      }
      // Base vortex and rising chevrons
      g.strokeStyle = 'rgba(172,242,255,.36)';
      g.lineWidth = 2;
      g.beginPath();
      g.ellipse(u.x + u.w / 2, bottom - 5, u.w * .46, 8, 0, 0, TAU);
      g.stroke();
      for(let i = 0; i < 4; i++){
        const phase = (t * .9 + i / 4) % 1;
        const yy = bottom - 12 - phase * Math.min(150, h * .55);
        const alpha = .36 * (1 - phase);
        g.strokeStyle = `rgba(190,247,255,${alpha})`;
        g.lineWidth = 1.5;
        g.beginPath();
        g.moveTo(u.x + u.w / 2 - 12, yy + 6);
        g.lineTo(u.x + u.w / 2, yy);
        g.lineTo(u.x + u.w / 2 + 12, yy + 6);
        g.stroke();
      }
      // Top vent halo
      g.strokeStyle = 'rgba(154,235,255,.23)';
      g.lineWidth = 1.2;
      g.beginPath();
      g.ellipse(u.x + u.w / 2, u.top + 4, u.w * .58, 10, 0, 0, TAU);
      g.stroke();
      glowCircle(g, u.x + u.w / 2, bottom - 8, u.w * .9, '#7ce3ff', .12);
      g.restore();
    }
  }

  function drawLavaChase(game){
    const c = game.lavaChase;
    if(!c || !c.active) return;
    const g = ctx;
    const left = game.camera.x - 80;
    if(c.x < left + 20) return;
    const t = game.worldTime;
    const edge = c.x;
    g.save();
    // Molten body swallowing the left side of the screen
    const wall = g.createLinearGradient(left, 0, edge, 0);
    wall.addColorStop(0, 'rgba(9,5,5,.98)');
    wall.addColorStop(.35, 'rgba(58,17,10,.96)');
    wall.addColorStop(.72, 'rgba(151,43,17,.9)');
    wall.addColorStop(.9, 'rgba(237,91,32,.72)');
    wall.addColorStop(1, 'rgba(255,181,88,.2)');
    g.fillStyle = wall;
    g.beginPath();
    g.moveTo(left, 0);
    g.lineTo(edge, 0);
    for(let i = 0; i <= 10; i++){
      const y = i / 10 * H;
      const wobble = Math.sin(t * 3.3 + i * 2.1) * 7 + Math.sin(t * 7.1 + i) * 3;
      g.lineTo(edge + wobble, y);
    }
    g.lineTo(left, H);
    g.closePath();
    g.fill();
    // Glowing edge and flame tongues
    g.globalCompositeOperation = 'lighter';
    g.strokeStyle = 'rgba(255,166,79,.38)';
    g.lineWidth = 22;
    g.beginPath();
    g.moveTo(edge, 0);
    g.lineTo(edge + Math.sin(t * 2.4) * 5, H);
    g.stroke();
    g.strokeStyle = 'rgba(255,233,180,.8)';
    g.lineWidth = 2;
    for(let i = 0; i < 8; i++){
      const y = 30 + i * 64 + Math.sin(t * 2.8 + i) * 12;
      const len = 16 + Math.sin(t * 5.6 + i * 1.7) * 9;
      g.beginPath();
      g.moveTo(edge + Math.sin(t * 4 + i) * 5, y);
      g.quadraticCurveTo(edge + len * .5, y - 8, edge + len, y - 2);
      g.stroke();
    }
    glowCircle(g, edge, H * .55, 150, '#ff6e2e', .18);
    // Smoke and sparks along the front
    for(let i = 0; i < 9; i++){
      const y = ((t * (24 + i * 7) + i * 71) % (H + 50)) - 25;
      const x = edge - 24 - hash(i + 13) * 120;

      g.fill();

    g.restore();
    // Heat halo at the front

    const near = clamp(1 - (edge - game.player.x + 300) / 500, 0, 1);

      g.fillStyle = `rgba(255,92,34,${near * .045})`;
      g.fillRect(game.camera.x, 0, W, H);

    g.restore();
  }

  /* =========================================================
     PARTICLES

  class ParticleSystem {
    constructor(){
      this.items = [];
    }
    add(p){
      if(!Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.life)) return;
      if(!Number.isFinite(p.r)) p.r = 3;
      if(this.items.length > 540) this.items.shift();
      p.maxLife = p.life;
      this.items.push(p);
    }
    spark(x, y, color, speed = 180, life = .4, dir = null, size = 1.6){
      const a = dir == null ? rand(0, TAU) : dir + rand(-.5, .5);
      const sp = rand(speed * .3, speed);
      this.add({
        type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        gravity: 520, life: rand(life * .55, life), color, size,
        drag: 1.8
      });
    }
    hit(x, y, color = '#ffd28d', count = 6, speed = 240){
      for(let i = 0; i < count; i++) this.spark(x, y, color, speed, .28, null, 1.2 + Math.random());
      this.add({ type: 'flash', x, y, vx: 0, vy: 0, r: rand(9, 17), color, life: .09, gravity: 0, drag: 0 });
    }
    muzzle(x, y, angle, color, scale = 1){
      this.add({
        type: 'flash', x, y, vx: 0, vy: 0, r: 16 * scale, color,
        life: .055, gravity: 0, drag: 0
      });
      for(let i = 0; i < 4; i++){
        const a = angle + rand(-.45, .45);
        const sp = rand(90, 280) * scale;
        this.add({
          type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          gravity: 120, life: rand(.06, .17), color, size: 1.1, drag: 1
        });
      }
    }
    casing(x, y, dir){
      this.add({
        type: 'debris', x, y, vx: -dir * rand(35, 95), vy: rand(-160, -60),
        gravity: 900, life: rand(.45, .8), color: '#d2a866',
        w: rand(2, 4), h: rand(1, 2), rot: rand(0, TAU), vr: rand(-12, 12),
        drag: .2
      });
    }
    dust(x, y, dir = 0, count = 5){
      for(let i = 0; i < count; i++){
        this.add({
          type: 'smoke', x: x + rand(-8, 8), y: y + rand(-5, 0),
          vx: -dir * rand(5, 32) + rand(-22, 22), vy: rand(-45, -8),
          gravity: -12, life: rand(.3, .65), color: '#7d8672',
          r: rand(3, 8), grow: rand(10, 18), drag: 2
        });
      }
    }
    explosion(x, y, power = 1, color = '#ff934c'){
      this.add({ type: 'ring', x, y, r: 8 * power, color, life: .32, maxLife: .32, gravity: 0 });
      this.add({ type: 'flash', x, y, r: 38 * power, color: '#fff1c1', life: .13, maxLife: .13, gravity: 0 });
      glowBurst: for(let i = 0; i < Math.floor(11 * power); i++){
        this.spark(x + rand(-8, 8), y + rand(-8, 8), i % 4 === 0 ? '#ffe5a0' : color,
          rand(190, 410) * power, .55, null, rand(1.5, 3.2));
      }
      for(let i = 0; i < Math.floor(6 * power); i++){
        this.add({
          type: 'smoke', x: x + rand(-10, 10), y: y + rand(-8, 8),
          vx: rand(-45, 45), vy: rand(-85, -15), gravity: -20,
          life: rand(.55, 1.15), color: i % 2 ? '#413a31' : '#76614b',
          r: rand(8, 18) * Math.sqrt(power), grow: rand(18, 34), drag: 1.6
        });
      }
      for(let i = 0; i < Math.floor(5 * power); i++){
        this.add({
          type: 'debris', x, y, vx: rand(-170, 170), vy: rand(-290, -60),
          gravity: 820, life: rand(.5, 1.05), color: pick(['#292b25', '#4c4a3b', '#141817']),
          w: rand(2, 6), h: rand(2, 5), rot: rand(0, TAU), vr: rand(-14, 14), drag: .2
        });
      }
    }
    trail(x, y, color, r = 2.5, life = .25){
      this.add({
        type: 'smoke', x: x + rand(-2, 2), y: y + rand(-2, 2),
        vx: rand(-10, 10), vy: rand(-14, 2), gravity: -10, life,
        color, r, grow: 9, drag: 2
      });
    }
    scoreText(x, y, text, color = '#ffd68f', size = 10){
      this.add({
        type: 'text', x, y, vx: rand(-8, 8), vy: -38, gravity: -9,
        drag: 1.1, life: .75, color, text, size
      });
    }
    update(dt){
      for(let i = this.items.length - 1; i >= 0; i--){
        const p = this.items[i];
        p.life -= dt;
        if(p.life <= 0){
          this.items.splice(i, 1);
          continue;
        }
        p.vy += (p.gravity || 0) * dt;
        if(p.drag){
          const d = Math.max(0, 1 - p.drag * dt);
          p.vx *= d;
          p.vy *= d;
        }
        p.x += (p.vx || 0) * dt;
        p.y += (p.vy || 0) * dt;
        if(p.rot != null) p.rot += (p.vr || 0) * dt;
        if(p.type === 'smoke') p.r += (p.grow || 0) * dt;
        if(p.type === 'ring') p.r += 145 * dt;
      }
    }
    draw(g){
      g.save();
      for(const p of this.items){
        if(!Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.life) ||
          !Number.isFinite(p.r) || !Number.isFinite(p.maxLife)) continue;
        const a = clamp(p.life / p.maxLife, 0, 1);
        if(p.type === 'spark'){
          g.globalCompositeOperation = 'lighter';
          g.globalAlpha = a;
          g.strokeStyle = p.color;
          g.lineWidth = p.size;
          g.lineCap = 'round';
          g.beginPath();
          g.moveTo(p.x, p.y);
          g.lineTo(p.x - p.vx * .022, p.y - p.vy * .022);
          g.stroke();
        }else if(p.type === 'flash'){
          g.globalCompositeOperation = 'lighter';
          g.globalAlpha = a;
          glowCircle(g, p.x, p.y, p.r, p.color, .8);
        }else if(p.type === 'smoke'){
          g.globalCompositeOperation = 'source-over';
          g.globalAlpha = a * .23;
          g.fillStyle = p.color;
          g.beginPath();
          g.arc(p.x, p.y, p.r, 0, TAU);
          g.fill();
        }else if(p.type === 'ring'){
          g.globalCompositeOperation = 'lighter';
          g.globalAlpha = a * .7;
          g.strokeStyle = p.color;
          g.lineWidth = 2 + a * 3;
          g.beginPath();
          g.arc(p.x, p.y, p.r, 0, TAU);
          g.stroke();
        }else if(p.type === 'debris'){
          g.globalCompositeOperation = 'source-over';
          g.globalAlpha = a;
          g.save();
          g.translate(p.x, p.y);
          g.rotate(p.rot || 0);
          g.fillStyle = p.color;
          g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          g.restore();
        }else if(p.type === 'text'){
          g.globalCompositeOperation = 'source-over';
          g.globalAlpha = a;
          g.font = `700 ${p.size || 10}px ${FONT_MONO}`;
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          g.fillStyle = 'rgba(4,8,8,.7)';
          g.fillText(p.text, p.x + 1, p.y + 1);
          g.fillStyle = p.color;
          g.fillText(p.text, p.x, p.y);
        }
      }
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
      g.restore();
    }
  }

  class Breakable {
    constructor(def){
      this.type = def.type;
      this.x = def.x;
      this.y = def.y;
      this.w = this.type === 'barrel' ? 28 : 34;
      this.h = this.type === 'barrel' ? 38 : 34;
      this.hp = this.type === 'barrel' ? 1 : 2;
      this.dead = false;
      this.flash = 0;
      this.phase = rand(0, TAU);
      this.t = 0;
    }
    get bounds(){ return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h }; }
    update(dt){
      this.t += dt;
      this.flash = Math.max(0, this.flash - dt);
    }
    hit(game, dmg){
      if(this.dead) return;
      this.hp -= dmg;
      this.flash = .08;
      if(this.hp <= 0){
        this.dead = true;
        if(this.type === 'barrel') game.explodeBarrel(this);
        else game.breakCrate(this);
      }else{
        game.particles.hit(this.x, this.y - this.h * .5, '#ffd18a', 4, 150);
        sound.sfx('enemyHit');
      }
    }
    draw(g){
      if(this.dead) return;
      g.save();
      g.translate(this.x, this.y);
      // shadow
      g.fillStyle = 'rgba(0,0,0,.35)';
      g.beginPath();
      g.ellipse(0, 2, this.w * .6, 5, 0, 0, TAU);
      g.fill();
      if(this.type === 'barrel'){
        g.fillStyle = '#231512';

        roundRect(g, -12, -37, 24, 35, 3);

        g.fillStyle = '#151310';
        g.fillRect(-14, -37, 28, 3);
        g.fillStyle = 'rgba(244,188,80,.7)';

        g.fillStyle = '#221810';

        g.textAlign = 'center';
        g.fillText('!', 0, -18);

        for(let i = 0; i < 3; i++){
          g.beginPath();
          g.moveTo(-14 + i * 10, -38);
          g.lineTo(-14 + i * 10, 0);
          g.stroke();
        }
        if(this.flash > 0){
          g.globalCompositeOperation = 'lighter';
          glowCircle(g, 0, -20, 36, '#ffb15e', .8);
        }
      }else{
        g.fillStyle = '#1d211d';
        roundRect(g, -17, -34, 34, 34, 2);
        g.fill();
        g.fillStyle = '#3d4438';
        g.fillRect(-15, -32, 30, 30);
        g.strokeStyle = '#22271f';
        g.lineWidth = 2;
        g.strokeRect(-13, -30, 26, 26);
        g.strokeStyle = 'rgba(166,146,93,.55)';
        g.lineWidth = 1;
        g.strokeRect(-8, -25, 16, 15);
        g.fillStyle = 'rgba(205,170,89,.7)';
        g.font = `700 7px ${FONT_MONO}`;
        g.textAlign = 'center';
        g.fillText('SUPPLY', 0, -12);
        g.fillStyle = '#c4a25f';
        g.fillRect(-12, -6, 24, 1);
        // dark diagonal strap
        g.fillStyle = 'rgba(15,17,14,.55)';
        g.beginPath();
        g.moveTo(-15, -9);
        g.lineTo(-4, -32);
        g.lineTo(3, -32);
        g.lineTo(-8, -9);
        g.closePath();
        g.fill();
        if(this.flash > 0){
          g.globalCompositeOperation = 'lighter';
          glowCircle(g, 0, -18, 34, '#ffd486', .65);
        }
      }
      g.restore();
    }
