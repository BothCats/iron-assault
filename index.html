  function drawStageIntro(game){
    if(game.stageIntro <= 0) return;
    const g = ctx;
    const total = 2.8;
    const elapsed = total - game.stageIntro;
    const alpha = clamp(Math.min(elapsed / .35, game.stageIntro / .55), 0, 1);
    if(alpha <= 0) return;
    g.save();
    g.globalAlpha = alpha;
    // cinematic bars
    const bh = 54;
    const barGrad = g.createLinearGradient(0, 0, 0, bh);
    barGrad.addColorStop(0, 'rgba(2,6,7,.88)');
    barGrad.addColorStop(1, 'rgba(2,6,7,.22)');
    g.fillStyle = barGrad;
    g.fillRect(0, 0, W, bh);
    const barGrad2 = g.createLinearGradient(0, H - bh, 0, H);
    barGrad2.addColorStop(0, 'rgba(2,6,7,.15)');
    barGrad2.addColorStop(1, 'rgba(2,6,7,.82)');
    g.fillStyle = barGrad2;
    g.fillRect(0, H - bh, W, bh);
    g.fillStyle = 'rgba(255,112,60,.5)';
    g.fillRect(0, bh, W, 1);
    g.fillRect(0, H - bh - 1, W, 1);

    const cx = W / 2;
    const cy = H * .34;
    drawSpacedText(g, `SECTOR ${pad(game.stageIndex + 1, 2)}`, cx, cy, 5, `700 11px ${FONT_MONO}`, 'rgba(255,152,94,.8)', 'center');
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    g.font = `900 36px ${FONT_CN}`;
    g.fillStyle = 'rgba(4,8,8,.75)';
    g.fillText(game.stage.name, cx + 2, cy + 50);
    g.fillStyle = '#f0dec1';
    g.fillText(game.stage.name, cx, cy + 48);
    drawSpacedText(g, game.stage.en, cx, cy + 70, 7, `700 10px ${FONT_MONO}`, 'rgba(108,218,190,.7)', 'center');
    const line = g.createLinearGradient(cx - 180, 0, cx + 180, 0);
    line.addColorStop(0, 'rgba(255,126,70,0)');
    line.addColorStop(.5, 'rgba(255,156,89,.55)');
    line.addColorStop(1, 'rgba(255,126,70,0)');
    g.fillStyle = line;
    g.fillRect(cx - 180, cy + 82, 360, 1);
    if(game.stage.tip){
      g.fillStyle = 'rgba(218,231,212,.46)';
      g.font = `500 10px ${FONT_CN}`;
      g.textAlign = 'center';
      g.fillText(game.stage.tip, cx, cy + 104);
    }
    g.restore();
  }

  function drawToast(game){
    const toast = game.toast;
    if(!toast) return;
    const g = ctx;
    const t = toast.t;
    const alpha = Math.min(1, t / .16, (toast.dur + .3 - t) / .32);
    if(alpha <= 0) return;
    g.save();
    g.font = `700 12px ${FONT_CN}`;
    const textW = g.measureText(toast.text).width;
    g.font = `700 7px ${FONT_MONO}`;
    const subW = g.measureText(toast.sub || '').width;
    const width = clamp(Math.max(textW, subW) + 86, 260, 450);
    const x = W / 2 - width / 2;
    const y = H - 60;
    const h = 30;
    g.globalAlpha = alpha;
    g.translate(W / 2, y + h / 2);
    g.scale(.97 + alpha * .03, .97 + alpha * .03);
    g.translate(-W / 2, -(y + h / 2));
    cutCornerRect(g, x, y, width, h, 7);
    g.fillStyle = 'rgba(4,10,11,.9)';
    g.fill();
    g.strokeStyle = hexToRgba(toast.color, .32);
    g.lineWidth = 1;
    g.stroke();
    g.fillStyle = toast.color;
    g.fillRect(x + 1, y + 3, 2, h - 6);
    // Icon diamond
    g.save();
    g.translate(x + 22, y + h / 2);
    g.rotate(Math.PI / 4);
    g.strokeStyle = hexToRgba(toast.color, .7);
    g.lineWidth = 1;
    g.strokeRect(-5, -5, 10, 10);
    g.restore();
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.font = `700 12px ${FONT_CN}`;
    g.fillStyle = '#f2e5d0';
    g.fillText(toast.text, x + 40, y + 14);
    drawSpacedText(g, (toast.sub || '').toUpperCase(), x + 40, y + 24, 1.1, `700 6.5px ${FONT_MONO}`, hexToRgba(toast.color, .62), 'left');
    // small line timer
    const rem = clamp(1 - toast.t / toast.dur, 0, 1);
    g.fillStyle = hexToRgba(toast.color, .5);
    g.fillRect(x + 40, y + 27, (width - 58) * rem, 1);
    g.restore();
  }

  /* =========================================================
     HUD
     ========================================================= */
  function drawHUD(game){
    const g = ctx;
    const p = game.player;
    if(!p) return;
    g.save();

    // Top atmosphere
    const topShade = g.createLinearGradient(0, 0, 0, 110);
    topShade.addColorStop(0, 'rgba(1,4,5,.56)');
    topShade.addColorStop(1, 'rgba(1,4,5,0)');
    g.fillStyle = topShade;
    g.fillRect(0, 0, W, 110);

    // Frame accents
    g.strokeStyle = 'rgba(255,159,95,.24)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(0, 13);
    g.lineTo(115, 13);
    g.moveTo(W, 13);
    g.lineTo(W - 115, 13);
    g.stroke();
    g.fillStyle = 'rgba(255,122,63,.55)';
    g.fillRect(0, 0, 182, 2);
    g.fillRect(W - 182, 0, 182, 2);

    // Left vitals panel
    drawHudFrame(g, 22, 18, 286, 64, 10, .7);
    g.fillStyle = 'rgba(255,162,102,.5)';
    g.fillRect(40, 27, 12, 1);
    drawSpacedText(g, '生命 // LIVES', 57, 32, 1.2, `700 7px ${FONT_MONO}`, 'rgba(222,211,192,.42)', 'left');
    for(let i = 0; i < 5; i++){
      const lx = 40 + i * 14;
      const active = i < game.lives;
      g.save();
      g.translate(lx, 40);
      g.fillStyle = active ? '#ffc07b' : 'rgba(157,154,139,.14)';
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(9, 1);
      g.lineTo(11, 7);
      g.lineTo(7, 12);
      g.lineTo(0, 10);
      g.closePath();
      g.fill();
      g.fillStyle = active ? 'rgba(35,18,12,.65)' : 'rgba(9,13,13,.5)';
      g.fillRect(2, 3, 5, 1.4);
      g.fillRect(2, 6, 7, 1.4);
      if(active){
        g.strokeStyle = 'rgba(255,243,214,.34)';
        g.lineWidth = .7;
        g.stroke();
      }
      g.restore();
    }
    drawText(g, `×${game.lives}`, 118, 52, `700 12px ${FONT_MONO}`, 'rgba(240,223,195,.84)', 'left');
    // Divider
    g.fillStyle = 'rgba(205,180,143,.12)';
    g.fillRect(146, 26, 1, 46);
    drawSpacedText(g, '装甲 // ARMOR', 162, 32, 1.1, `700 7px ${FONT_MONO}`, 'rgba(222,211,192,.42)', 'left');
    const armorPulse = p.hp <= 1 ? .6 + Math.sin(game.time * 7) * .3 : 1;
    for(let i = 0; i < 4; i++){
      const cx = 162 + i * 28;
      const active = i < p.hp;
      g.save();
      g.translate(cx, 43);
      g.beginPath();
      g.moveTo(4, 0);
      g.lineTo(24, 0);
      g.lineTo(20, 8);
      g.lineTo(0, 8);
      g.closePath();
      g.fillStyle = active
        ? (p.hp <= 1 ? `rgba(255,100,70,${.65 + armorPulse * .25})` : 'rgba(103,226,193,.8)')
        : 'rgba(145,147,132,.12)';
      g.fill();
      if(active){
        g.fillStyle = 'rgba(255,255,255,.32)';
        g.fillRect(5, 1, 15, 1);
      }
      g.strokeStyle = active ? 'rgba(211,255,236,.25)' : 'rgba(0,0,0,.2)';
      g.lineWidth = .7;
      g.stroke();
      g.restore();
    }
    if(p.hp <= 1){
      g.fillStyle = `rgba(255,120,76,${.5 + Math.sin(game.time * 6) * .25})`;
      g.font = `700 7px ${FONT_MONO}`;
      g.textAlign = 'right';
      g.fillText('CRITICAL', 291, 52);
    }

    // Score
    drawHudFrame(g, W - 250, 18, 228, 64, 10, .7, 'rgba(255,156,93,.55)');
    drawSpacedText(g, 'SCORE // 战功', W - 40, 32, 1.2, `700 7px ${FONT_MONO}`, 'rgba(222,211,192,.42)', 'right');
    drawText(g, pad(game.score, 7), W - 40, 61, `700 25px ${FONT_MONO}`, '#f0dfc3', 'right');
    g.fillStyle = 'rgba(255,130,72,.38)';
    g.fillRect(W - 183, 68, 143, 1);
    drawSpacedText(g, `BEST ${pad(game.best, 7)}`, W - 40, 78, 1, `700 7px ${FONT_MONO}`, 'rgba(184,175,157,.36)', 'right');

    // Weapon
    const w = WEAPONS[p.weapon];
    const weaponTier = p.getWeaponTier ? p.getWeaponTier(p.weapon) : 0;
    const wx = 22, wy = 91;
    drawHudFrame(g, wx, wy, 188, 38, 7, .66, hexToRgba(w.color, .65));
    g.save();
    g.translate(wx + 25, wy + 19);
    g.rotate(Math.PI / 4);
    g.fillStyle = 'rgba(7,13,13,.9)';
    g.fillRect(-11, -11, 22, 22);
    g.strokeStyle = hexToRgba(w.color, .6);
    g.lineWidth = 1;
    g.strokeRect(-11, -11, 22, 22);
    g.restore();
    g.fillStyle = w.color;
    g.font = `900 15px ${FONT_DISPLAY}`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(w.icon, wx + 25, wy + 19);
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#eadbc3';
    g.font = `700 12px ${FONT_CN}`;
    g.fillText(w.name, wx + 46, wy + 18);
    drawSpacedText(g, w.en, wx + 46, wy + 30, 1.2, `700 7px ${FONT_MONO}`, hexToRgba(w.color, .56), 'left');
    g.fillStyle = 'rgba(236,223,198,.5)';
    g.font = `700 16px ${FONT_MONO}`;
    g.textAlign = 'right';
    g.fillText('∞', wx + 173, wy + 24);
    if(weaponTier > 0){
      g.fillStyle = w.color;
      g.font = `700 9px ${FONT_MONO}`;
      g.fillText(`+${weaponTier}`, wx + 151, wy + 15);
      for(let i = 0; i < 3; i++){
        g.fillStyle = i < weaponTier ? w.color : 'rgba(233,222,199,.16)';
        g.fillRect(wx + 139 + i * 5, wy + 20, 3, 2);
      }
    }

    // Weapon rack — unlocked slots, current highlighted
    const slotOrder = ['rifle', 'machine', 'spread', 'laser'];
    const slotX = 22, slotY = 133, slotW = 44, slotH = 21;
    for(let i = 0; i < slotOrder.length; i++){
      const id = slotOrder[i];
      const sw = WEAPONS[id];
      const owned = p.arsenal.includes(id);
      const active = p.weapon === id;
      const sx = slotX + i * (slotW + 4);
      g.fillStyle = active ? 'rgba(16,27,25,.88)' : 'rgba(4,9,10,.62)';
      roundRect(g, sx, slotY, slotW, slotH, 3);
      g.fill();
      g.strokeStyle = active ? hexToRgba(sw.color, .82) : (owned ? hexToRgba(sw.color, .32) : 'rgba(188,180,157,.1)');
      g.lineWidth = active ? 1.2 : 1;
      g.stroke();
      if(owned){
        g.fillStyle = active ? sw.color : hexToRgba(sw.color, .48);
        g.font = `900 12px ${FONT_DISPLAY}`;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText(sw.icon, sx + slotW / 2, slotY + 10);
      }else{
        g.fillStyle = 'rgba(212,200,174,.18)';
        g.font = `700 10px ${FONT_MONO}`;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText('—', sx + slotW / 2, slotY + 10);
      }
      g.fillStyle = active ? hexToRgba(sw.color, .82) : 'rgba(214,201,176,.28)';
      g.font = `700 6px ${FONT_MONO}`;
      g.textAlign = 'left';
      g.textBaseline = 'alphabetic';
      g.fillText(String(i + 1), sx + 3, slotY + slotH - 3);
      if(owned){
        const st = p.getWeaponTier ? p.getWeaponTier(id) : 0;
        for(let j = 0; j < 3; j++){
          g.fillStyle = j < st ? sw.color : 'rgba(219,204,178,.14)';
          g.fillRect(sx + slotW - 13 + j * 4, slotY + slotH - 4, 2.5, 2);
        }
      }
    }
    g.textBaseline = 'alphabetic';

    // Center stage / boss status
    if(game.boss && game.boss.active){
      drawBossHud(game);
    }else{
      const cx = W / 2;
      drawSpacedText(g, `SECTOR ${pad(game.stageIndex + 1, 2)} // ${game.stage.en}`, cx, 31, 2, `700 8px ${FONT_MONO}`, 'rgba(227,215,193,.45)', 'center');
      drawText(g, game.stage.name, cx, 49, `700 14px ${FONT_CN}`, 'rgba(239,223,199,.85)', 'center');
      const pw = 150, px = cx - pw / 2, py = 57;
      g.fillStyle = 'rgba(238,221,195,.12)';
      g.fillRect(px, py, pw, 2);
      g.fillStyle = 'rgba(255,138,78,.7)';
      g.fillRect(px, py, pw * stageProgress(game.stage, game.player), 2);
      g.fillStyle = 'rgba(255,193,128,.85)';
      g.beginPath();
      g.arc(px + pw * stageProgress(game.stage, game.player), py + 1, 2.3, 0, TAU);
      g.fill();
      g.fillStyle = 'rgba(231,218,194,.28)';
      g.font = `700 6px ${FONT_MONO}`;
      g.textAlign = 'center';
      g.fillText('MISSION PROGRESS', cx, 68);
    }

    // Combo / chain feedback below the score panel
    if(game.combo >= 2 && game.comboTimer > 0){
      const cw = 228, cx = W - cw - 22, cy = 91;
      const pulse = 1 + Math.min(.14, game.comboFlash * .6);
      g.save();
      g.translate(cx + cw, cy);
      g.scale(pulse, pulse);
      g.translate(-(cx + cw), -cy);
      g.fillStyle = 'rgba(17,11,5,.62)';
      roundRect(g, cx, cy, cw, 31, 5);
      g.fill();
      g.strokeStyle = `rgba(255,190,102,${.18 + Math.min(.4, game.comboFlash)})`;
      g.lineWidth = 1;
      g.stroke();
      g.textAlign = 'left';
      g.fillStyle = 'rgba(255,205,126,.55)';
      g.font = `700 6px ${FONT_MONO}`;
      g.fillText('CHAIN // 连杀', cx + 10, cy + 10);
      g.fillStyle = game.comboFlash > 0 ? '#fff1c6' : '#ffd27e';
      g.font = `700 15px ${FONT_MONO}`;
      g.fillText(`×${game.combo}`, cx + 10, cy + 25);
      g.font = `700 6px ${FONT_MONO}`;
      g.fillStyle = 'rgba(225,198,153,.44)';
      g.fillText(`SCORE ×${game.comboMultiplier.toFixed(2)}`, cx + 57, cy + 24);
      g.fillStyle = 'rgba(255,209,133,.13)';
      g.fillRect(cx + 152, cy + 11, 64, 2);
      g.fillStyle = 'rgba(255,189,100,.82)';
      g.fillRect(cx + 152, cy + 11, 64 * clamp(game.comboTimer / 2.35, 0, 1), 2);
      g.fillStyle = 'rgba(255,219,161,.45)';
      g.font = `700 6px ${FONT_MONO}`;
      g.textAlign = 'right';
      g.fillText(`${Math.ceil(game.comboTimer * 10) / 10}s`, cx + cw - 10, cy + 25);
      g.restore();
    }

    // Objective / control hints
    if(game.stageRunTime < 11 && !game.bossActive){
      g.fillStyle = 'rgba(3,8,9,.56)';
      g.fillRect(18, H - 35, 640, 24);
      g.fillStyle = 'rgba(255,128,73,.22)';
      g.fillRect(18, H - 35, 2, 24);
      g.font = `500 9.5px ${FONT_CN}`;
      g.textAlign = 'left';
      g.fillStyle = 'rgba(233,222,201,.54)';
      g.fillText('A / D 移动    W / S 瞄准    J 射击    1-4 换武器    K 跳跃    SHIFT 冲刺    ESC 暂停', 30, H - 19);
    }
    g.font = `500 9px ${FONT_CN}`;
    g.fillStyle = 'rgba(227,213,190,.38)';
    g.textAlign = 'right';
    if(game.lavaChase && game.lavaChase.active){
      g.fillStyle = 'rgba(255,139,82,.82)';
      g.fillText('目标 // 逃离熔岩潮汐', W - 24, H - 18);
    }else if(game.stageIndex === 0){
      const remain = Math.max(0, Math.round((game.stage.exitX - p.x) / 10));
      g.fillText(`目标 // 抵达撤离点   ${remain} m`, W - 24, H - 18);
    }else if(game.bossActive){
      if(game.boss && game.boss.nodes && game.boss.coreLocked){
        g.fillText('目标 // 摧毁两座护盾节点', W - 24, H - 18);
      }else if(game.boss && game.boss.kind === 'crucible' && !game.boss.coreExposed){
        g.fillText('目标 // 规避冲撞  ·  击破核心装甲', W - 24, H - 18);
      }else{
        g.fillText('目标 // 摧毁核心', W - 24, H - 18);
      }
    }else if(game.stageIndex === 1){
      g.fillText('目标 // 突破铁颚防线', W - 24, H - 18);
    }else if(game.stageIndex === 2){
      g.fillText('目标 // 穿越熔炉  ·  击毁巨像', W - 24, H - 18);
    }else if(game.stageIndex === 3){
      g.fillText('目标 // 突入天穹核心', W - 24, H - 18);
    }else if(game.stageIndex === 4){
      g.fillText('目标 // 突破雪原铁路', W - 24, H - 18);
    }else{
      g.fillText('目标 // 猎杀赤蝎', W - 24, H - 18);
    }

    drawToast(game);
    g.restore();
  }

  function drawBossHud(game){
    const g = ctx;
    const boss = game.boss;
    const x = 318, y = 18, w = 388, h = 64;
    const active = boss.phase > 1;
    drawHudFrame(g, x, y, w, h, 10, .76, active ? 'rgba(255,83,47,.8)' : 'rgba(255,157,98,.65)');
    // Labels
    const red = active ? (Math.sin(game.time * 7) > 0 ? '#ff7147' : '#ffb175') : '#ff9a65';
    drawText(g, `BOSS // ${boss.designation || '高危目标'}`, x + 16, y + 23, `700 10px ${FONT_CN}`, red, 'left');
    g.save();
    g.translate(x + 15, y + 41);
    g.rotate(Math.PI / 4);
    g.strokeStyle = 'rgba(255,134,77,.6)';
    g.lineWidth = 1;
    g.strokeRect(-4, -4, 8, 8);
    g.restore();
    drawText(g, boss.shortName || boss.name || '目标', x + 27, y + 46, `900 17px ${FONT_CN}`, '#f0dec1', 'left');
    const percent = clamp(boss.hp / boss.maxHp, 0, 1);
    drawText(g, `${Math.ceil(percent * 100)}%`, x + w - 16, y + 23, `700 10px ${FONT_MONO}`, 'rgba(238,218,195,.7)', 'right');
    const hstatus = boss.hudStatus || (active ? { text: 'OVERDRIVE', color: '#ff8b55' } : null);
    if(hstatus){
      g.fillStyle = hstatus.color;
      g.font = `700 7px ${FONT_MONO}`;
      g.textAlign = 'right';
      g.fillText(hstatus.text, x + w - 16, y + 34);
    }
    // HP bar
    const bx = x + 16, by = y + 54, bw = w - 32, bh = 7;
    g.fillStyle = 'rgba(1,4,5,.72)';
    g.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    g.fillStyle = 'rgba(238,222,196,.13)';
    g.fillRect(bx, by, bw, bh);
    const grad = g.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, active ? '#ff3e25' : '#e96135');
    grad.addColorStop(.65, '#ff9e52');
    grad.addColorStop(1, '#ffd276');
    g.fillStyle = grad;
    g.fillRect(bx, by, bw * percent, bh);
    g.fillStyle = 'rgba(255,255,255,.32)';
    g.fillRect(bx, by, bw * percent, 1.4);
    g.fillStyle = 'rgba(4,8,9,.72)';
    for(let i = 1; i < 8; i++) g.fillRect(bx + bw / 8 * i, by, 1, bh);
    g.strokeStyle = 'rgba(255,222,183,.18)';
    g.lineWidth = 1;
    g.strokeRect(bx - .5, by - .5, bw + 1, bh + 1);
    if(percent < .5){
      g.fillStyle = 'rgba(255,104,61,.35)';
      g.fillRect(bx, by - 4, bw * (1 - percent), 1);
    }
  }

  /* =========================================================
     MAIN GAMEPLAY RENDER
     ========================================================= */
  function drawGameScene(game){
    const g = ctx;
    const stage = game.stage;
    const cam = game.camera.x;
    const t = game.time;
    const shakeX = game.shake > .05 ? rand(-game.shake, game.shake) : 0;
    const shakeY = game.shake > .05 ? rand(-game.shake, game.shake) : 0;

    g.save();
    g.translate(shakeX * .28, shakeY * .28);
    drawBackdrop(stage, cam, t);
    g.restore();

    g.save();
    g.translate(-cam + shakeX, shakeY);
    drawAbyssHaze(stage, cam, t);
    drawTerrain(stage, cam, game.worldTime);
    drawUpdrafts(game);
    drawMissileMarkers(game);
    drawSigns(stage, cam, game.worldTime);
    for(let i = 0; i < stage.checkpoints.length; i++){
      const cp = stage.checkpoints[i];
      drawCheckpoint(cp, i <= game.checkpointIndex, game.worldTime);
    }
    if(stage.theme === 'jungle' && game.stageIndex === 0){
      drawExtractionLights(stage, game.worldTime);
      drawHelicopter(game.worldTime, cam);
    }
    if(stage.boss){
      drawBossGate(stage, game, game.worldTime);
    }
    for(const p of game.props) p.draw(g);
    for(const p of game.pickups) p.draw(g, game.player);
    for(const e of game.enemies) e.draw(g, game);
    if(game.boss) game.boss.draw(g, game);
    if(game.player) game.player.draw(g, game);
    for(const h of game.hazards) h.draw(g, game);
    for(const b of game.playerBullets) b.draw(g);
    for(const b of game.enemyBullets) b.draw(g);
    game.particles.draw(g);
    drawLavaChase(game);
    g.restore();

    drawWeather(stage, cam, t, game);
    drawLowHealth(game);
    drawScreenVignette();
    if(game.state === 'playing' || game.state === 'paused'){
      drawHUD(game);
    }
    if(game.state === 'playing'){
      drawStageIntro(game);
      drawBossPhaseWarning(game);
      drawBossWarning(game);
    }
    if(game.state === 'paused'){
      drawPauseOverlay(game);
    }else if(game.state === 'stageclear'){
      drawStageClearOverlay(game);
    }else if(game.state === 'gameover'){
      drawGameOverOverlay(game);
    }else if(game.state === 'victory'){
      drawVictoryOverlay(game);
    }

    // Full-screen flashes
    if(game.flash > 0){
      g.fillStyle = `rgba(255,170,118,${clamp(game.flash, 0, .5) * .5})`;
      g.fillRect(0, 0, W, H);
    }
    if(game.killFlash > 0){
      g.fillStyle = `rgba(255,240,211,${clamp(game.killFlash, 0, .3)})`;
      g.fillRect(0, 0, W, H);

    for(let i = 0; i < 36; i++){
      const gx = hash(i * 3.7) * W;
      const baseY = gx < 440 ? 512 + Math.sin(gx / 130) * 5 : 506 - (gx - 500) * .014;
      const h = 4 + hash(i + 2) * 13;
      g.strokeStyle = `rgba(59,82,55,${.18 + hash(i + 4) * .25})`;
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(gx, baseY);
      g.quadraticCurveTo(gx - 3, baseY - h * .6, gx - 7 + hash(i) * 8, baseY - h);
      g.stroke();
    }
    // Left foliage silhouettes
    g.fillStyle = 'rgba(3,13,12,.88)';
    for(let i = 0; i < 9; i++){
      const a = -.75 + i * .16;
      const bx = 10 + i * 22;
      const by = 540 - i * 2;
      g.save();
      g.translate(bx, by);
      g.rotate(a);
      g.beginPath();
      g.ellipse(0, 0, 58 + hash(i) * 42, 10 + hash(i + 3) * 6, 0, 0, TAU);
      g.fill();
      g.restore();
    }
    // A few foreground grass tufts at right
    g.strokeStyle = 'rgba(38,60,47,.55)';
    for(let i = 0; i < 8; i++){
      const gx = 840 + hash(i + 90) * 120;
      const h = 10 + hash(i + 3) * 18;
      g.beginPath();
      g.moveTo(gx, 505);
      g.quadraticCurveTo(gx - 4, 500 - h * .5, gx - 10, 500 - h);
      g.moveTo(gx, 505);
      g.quadraticCurveTo(gx + 4, 500 - h * .6, gx + 11, 498 - h * .8);
      g.stroke();
    }
  }

  function drawTitleEmbers(t){
    const g = ctx;
    g.save();
    g.globalCompositeOperation = 'lighter';
    for(let i = 0; i < 38; i++){
      const speed = 8 + hash(i + 8) * 20;
      const x = (hash(i * 1.9) * W + Math.sin(t * .45 + i * 1.3) * 24) % W;
      const y = H - ((hash(i * 7.3) * 520 + t * speed) % 560);
      const flick = .25 + Math.max(0, Math.sin(t * 1.4 + i * 2.2)) * .6;
      g.fillStyle = i % 4 === 0
        ? `rgba(255,221,142,${flick * .4})`
        : `rgba(255,119,58,${flick * .3})`;
      g.beginPath();
      g.arc(x, y, .7 + hash(i + 2) * 1.5, 0, TAU);
      g.fill();
      if(i % 9 === 0) glowCircle(g, x, y, 12, '#ff8d4e', flick * .06);
    }
    g.restore();
  }

  function renderTitle(game){
    const g = ctx;
    const t = game.time;
    const intro = clamp((t - game.titleEnteredAt) / 1.15, 0, 1);
    const ease = 1 - Math.pow(1 - intro, 3);
    const cam = 2480 + Math.sin(t * .04) * 120;

    drawBackdrop(game.stage, cam, t);
    drawWeather(game.stage, cam, t, game);
    // light shaft behind hero
    g.save();
    g.globalCompositeOperation = 'lighter';
    const spot = g.createRadialGradient(792, 410, 10, 792, 410, 270);
    spot.addColorStop(0, 'rgba(255,173,104,.18)');
    spot.addColorStop(.45, 'rgba(255,119,62,.06)');
    spot.addColorStop(1, 'rgba(255,119,62,0)');
    g.fillStyle = spot;
    g.fillRect(480, 120, 480, 400);
    g.restore();
    drawTitleForeground(t);
    // Hero
    g.save();
    g.globalAlpha = .26 + ease * .74;
    glowCircle(g, 792, 470, 140, '#ff7441', .12);
    drawCommando(g, game.titleHero, { scale: 2.05 });
    g.restore();

    // Left readability shading
    const shade = g.createLinearGradient(0, 0, 690, 0);
    shade.addColorStop(0, 'rgba(2,7,8,.91)');
    shade.addColorStop(.38, 'rgba(2,7,8,.66)');
    shade.addColorStop(.75, 'rgba(2,7,8,.16)');
    shade.addColorStop(1, 'rgba(2,7,8,0)');
    g.fillStyle = shade;
    g.fillRect(0, 0, 710, H);
    const bottomShade = g.createLinearGradient(0, 390, 0, H);
    bottomShade.addColorStop(0, 'rgba(2,6,7,0)');
    bottomShade.addColorStop(1, 'rgba(2,6,7,.5)');
    g.fillStyle = bottomShade;
    g.fillRect(0, 360, W, H - 360);

    // technical framing
    g.save();
    g.globalAlpha = .55 * ease;
    g.strokeStyle = 'rgba(255,144,82,.3)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(34, 34);
    g.lineTo(116, 34);
    g.moveTo(34, 34);
    g.lineTo(34, 94);
    g.stroke();
    g.strokeStyle = 'rgba(133,190,163,.2)';
    g.beginPath();
    g.moveTo(W - 34, 34);
    g.lineTo(W - 116, 34);
    g.moveTo(W - 34, 34);
    g.lineTo(W - 34, 80);
    g.stroke();
    g.restore();

    // Copy block
    g.save();
    g.globalAlpha = ease;
    g.translate(0, (1 - ease) * 18);

    // top kicker
    g.fillStyle = 'rgba(255,124,67,.9)';
    g.fillRect(94, 96, 25, 2);
    drawSpacedText(g, 'NIGHTFALL DIVISION', 130, 101, 3.8, `700 9px ${FONT_MONO}`, 'rgba(240,220,192,.66)', 'left');
    drawSpacedText(g, '作战档案 07 / CLASSIFIED', 94, 121, 2.4, `700 7px ${FONT_MONO}`, 'rgba(129,192,167,.44)', 'left');

    // giant title
    g.save();
    // diagonal slash
    g.fillStyle = 'rgba(174,53,28,.28)';
    g.beginPath();
    g.moveTo(72, 166);
    g.lineTo(527, 132);
    g.lineTo(500, 145);
    g.lineTo(74, 183);
    g.closePath();
    g.fill();
    const titleGrad = g.createLinearGradient(0, 148, 0, 248);
    titleGrad.addColorStop(0, '#fff1d6');
    titleGrad.addColorStop(.44, '#f5dab2');
    titleGrad.addColorStop(.67, '#e9b77f');
    titleGrad.addColorStop(1, '#b66b3e');
    g.font = `900 94px ${FONT_DISPLAY}`;
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.lineJoin = 'round';
    g.strokeStyle = 'rgba(3,8,8,.9)';
    g.lineWidth = 12;
    g.strokeText('钢铁突击', 91, 244);
    g.fillStyle = titleGrad;
    g.fillText('钢铁突击', 91, 244);
    // glint
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = 'rgba(255,230,190,.2)';
    g.fillRect(96, 178, 386, 1);
    g.globalCompositeOperation = 'source-over';
    // red accent underline
    g.fillStyle = '#d5502e';
    g.fillRect(95, 260, 310, 3);
    g.fillStyle = 'rgba(255,157,94,.4)';
    g.fillRect(411, 260, 46, 3);
    drawSpacedText(g, 'IRON ASSAULT', 98, 287, 7.5, `900 22px ${FONT_DISPLAY}`, 'rgba(255,211,165,.9)', 'left');
    g.restore();

    g.font = `500 12px ${FONT_CN}`;
    g.fillStyle = 'rgba(222,213,196,.63)';
    g.textAlign = 'left';
    g.fillText('六大战区 · 钢铁洪流 · 深入敌后', 97, 316);
    drawSpacedText(g, 'RUN  ·  GUN  ·  SURVIVE', 98, 334, 2, `700 7px ${FONT_MONO}`, 'rgba(100,213,181,.45)', 'left');

    // Start button
    const bx = 94, by = 354, bw = 334, bh = 55;
    const pulse = .55 + Math.sin(t * 2.8) * .25;
    cutCornerRect(g, bx, by, bw, bh, 9);
    g.fillStyle = 'rgba(8,18,17,.84)';
    g.fill();
    g.strokeStyle = `rgba(255,139,79,${.34 + pulse * .3})`;
    g.lineWidth = 1.2;
    g.stroke();
    g.fillStyle = `rgba(255,118,61,${.68 + pulse * .2})`;
    g.fillRect(bx + 1, by + 8, 3, bh - 16);
    // triangle icon
    g.fillStyle = '#ffab6c';
    g.beginPath();
    g.moveTo(bx + 25, by + 20);
    g.lineTo(bx + 39, by + 27.5);
    g.lineTo(bx + 25, by + 35);
    g.closePath();
    g.fill();
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.font = `700 16px ${FONT_CN}`;
    g.fillStyle = '#f4e4cd';
    g.fillText('按 ENTER 开始任务', bx + 53, by + 25);
    drawSpacedText(g, 'START MISSION', bx + 54, by + 42, 1.4, `700 7px ${FONT_MONO}`, 'rgba(255,171,112,.5)', 'left');
    // sheen
    const sheenX = bx + ((t * 90) % (bw + 160)) - 80;
    const sheen = g.createLinearGradient(sheenX, 0, sheenX + 80, 0);
    sheen.addColorStop(0, 'rgba(255,255,255,0)');
    sheen.addColorStop(.5, 'rgba(255,220,177,.055)');
    sheen.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sheen;
    g.fillRect(bx + 1, by + 1, bw - 2, bh - 2);

    // Controls
    g.globalAlpha = ease * .9;
    let hx = 95;
    hx = drawControlChip(g, ['A', 'D'], '移动', hx, 438) + 25;
    hx = drawControlChip(g, ['W', 'S'], '瞄准', hx, 438) + 25;
    drawControlChip(g, ['J'], '射击', hx, 438);
    hx = 95;
    hx = drawControlChip(g, ['K'], '跳跃', hx, 463) + 23;
    hx = drawControlChip(g, ['SHIFT'], '冲刺', hx, 463) + 23;
    hx = drawControlChip(g, ['ESC'], '暂停', hx, 463) + 23;
    drawControlChip(g, ['M'], '音效', hx, 463);
    g.fillStyle = 'rgba(238,204,146,.54)';
    g.font = `500 9px ${FONT_CN}`;
    g.fillText('1-4 切换武器   ·   重复拾取强化至 +3   ·   死亡掉落', 95, 487);
    g.fillStyle = 'rgba(229,217,198,.28)';
    g.font = `500 8px ${FONT_CN}`;
    g.fillText('6 个战区 / 5 场首领战   ·   NIGHTFALL DIVISION', 95, 502);
    g.restore();

    // Best score panel
    g.save();
    g.globalAlpha = ease;
    const px = 754, py = 28, pw = 184, ph = 61;
    drawHudFrame(g, px, py, pw, ph, 9, .68, 'rgba(255,154,95,.65)');
    drawSpacedText(g, 'HIGHEST SCORE', px + pw - 16, py + 20, 1.5, `700 7px ${FONT_MONO}`, 'rgba(222,211,190,.4)', 'right');
    drawText(g, pad(game.best, 7), px + pw - 16, py + 46, `700 22px ${FONT_MONO}`, '#efdcbf', 'right');
    g.fillStyle = 'rgba(255,126,70,.3)';
    g.fillRect(px + 16, py + 54, pw - 32, 1);
    g.restore();

    // Audio state
    g.save();
    g.globalAlpha = ease * .7;
    g.font = `500 9px ${FONT_CN}`;
    g.fillStyle = 'rgba(230,218,196,.35)';
    g.textAlign = 'right';
    g.fillText(`音效  ${sound.muted ? 'OFF' : 'ON'}    ·    M 切换`, W - 28, 114);
    g.fillStyle = 'rgba(233,218,193,.28)';
    g.font = `500 8px ${FONT_MONO}`;
    g.fillText('SINGLE PLAYER  //  OFFLINE BUILD v3.0', W - 28, H - 30);
    g.textAlign = 'left';
    g.fillStyle = 'rgba(124,231,197,.54)';
    g.font = `500 7.5px ${FONT_MONO}`;
    g.fillText('https://bothcats.github.io/iron-assault/', 28, H - 14);
    g.textAlign = 'right';
    g.fillStyle = 'rgba(233,218,193,.4)';
    g.font = `500 8px ${FONT_MONO}`;
    g.fillText('MADE By BothCats', W - 28, H - 14);
    g.restore();

    drawTitleEmbers(t);
    drawScreenVignette();

    if(intro < 1){
      g.fillStyle = `rgba(2,5,6,${1 - intro})`;
      g.fillRect(0, 0, W, H);
    }
  }

  /* =========================================================
     RENDER / LOOP / BOOT
     ========================================================= */
  Game.prototype.render = function(){
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.clearRect(0, 0, W, H);
    if(this.state === 'title'){
      renderTitle(this);
    }else{
      drawGameScene(this);
    }
  };

  const game = new Game();
  window.__IRON_ASSAULT__ = game;

  // Optional debug entry: ?autostart=1&stage=1|2&x=... (also useful for automated capture)
  try{
    const params = new URLSearchParams(window.location.search);
    if(params.has('autostart')){
      game.startNewRun();
      const stageParam = Number(params.get('stage'));
      if(stageParam >= 2 && stageParam <= 6){
        game.loadStage(stageParam - 1, true);
      }
      if(params.has('x')){
        const nx = Number(params.get('x'));
        if(Number.isFinite(nx)){
          game.player.x = clamp(nx, 16, game.stage.width - 16);
          game.camera.x = clamp(game.player.x - W * .34, 0, game.cameraMax);
        }
      }
      if(params.has('boss')){
        game.player.x = game.stage.bossTrigger + 120;
        game.camera.x = game.cameraMax;
      }
      game.stageIntro = .15;
      game.fade = 0;
      if(params.has('mute')) sound.muted = true;
    }
  }catch(e){}

  let lastTime = performance.now();
  let accumulator = 0;
  function frame(now){
    const rawDt = (now - lastTime) / 1000;
    lastTime = now;
    const dt = Math.min(.1, Math.max(0, rawDt));
    accumulator += dt;
    let steps = 0;
    while(accumulator >= STEP && steps < 6){
      game.update(STEP);
      accumulator -= STEP;
      steps++;
    }
    if(steps === 6) accumulator = 0;
    sound.update();
    game.render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
