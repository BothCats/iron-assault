  class Pickup {
    constructor(x, y, type, dropped = false, tier = 0, life = null){
      this.x = x;
      this.y = y;
      this.baseY = y;
      this.type = type;
      this.info = PICKUP_INFO[type] || PICKUP_INFO.health;
      this.dead = false;
      this.phase = rand(0, TAU);
      this.t = 0;
      this.dropped = dropped;
      this.tier = tier;
      this.bob = 0;
      this.lost = false;
      this.noCollect = false;
      this.vy = 0;
      this.life = life != null ? life : (dropped ? 24 : Infinity);
    }
    update(dt){
      this.t += dt;
      if(Number.isFinite(this.life)){
        this.life -= dt;
        if(this.life <= 0) this.dead = true;
      }
      if(this.lost){
        this.vy += 900 * dt;
        this.baseY += this.vy * dt;
        if(this.baseY > H + 40) this.dead = true;
        return;
      }
      this.bob = Math.sin(this.t * 2.2 + this.phase) * 5;
    }
    get drawY(){ return this.baseY + this.bob; }
    draw(g, player){
      if(this.dead) return;
      const y = this.drawY;
      const info = this.info;
      const blink = !this.lost && Number.isFinite(this.life) && this.life < 4 && Math.sin(this.t * 18) > 0;
      g.save();
      g.globalAlpha = blink ? .32 : 1;
      // Beam
      const beam = g.createLinearGradient(0, y - 42, 0, y + 40);
      beam.addColorStop(0, hexToRgba(info.color, 0));
      beam.addColorStop(.45, hexToRgba(info.color, .1));
      beam.addColorStop(1, hexToRgba(info.color, 0));
      g.fillStyle = beam;
      g.fillRect(this.x - 16, y - 44, 32, 90);
      glowCircle(g, this.x, y, 42, info.color, .3);
      // Orb
      g.translate(this.x, y);
      g.rotate(Math.sin(this.t * 1.4 + this.phase) * .1);
      g.strokeStyle = hexToRgba(info.color, .55);
      g.lineWidth = 1.2;
      g.beginPath();
      g.arc(0, 0, 22 + Math.sin(this.t * 3) * 1.5, 0, TAU);
      g.stroke();
      g.strokeStyle = hexToRgba(info.color, .22);
      g.beginPath();
      g.arc(0, 0, 28, this.t * 1.2, this.t * 1.2 + 2);
      g.stroke();
      const fill = g.createLinearGradient(0, -16, 0, 16);
      fill.addColorStop(0, '#22302f');
      fill.addColorStop(1, '#0a1112');
      g.fillStyle = fill;
      g.beginPath();
      g.moveTo(0, -18);
      g.lineTo(17, 0);
      g.lineTo(0, 18);
      g.lineTo(-17, 0);
      g.closePath();
      g.fill();
      g.strokeStyle = hexToRgba(info.color, .8);
      g.lineWidth = 1.3;
      g.stroke();
      g.rotate(-Math.sin(this.t * 1.4 + this.phase) * .1);
      g.fillStyle = info.color;
      g.shadowColor = info.color;
      g.shadowBlur = 7;
      if(info.icon === '+'){
        g.fillRect(-2, -9, 4, 18);
        g.fillRect(-9, -2, 18, 4);
      }else if(info.icon === '★'){
        g.beginPath();
        for(let i = 0; i < 10; i++){
          const a = -Math.PI / 2 + i * Math.PI / 5;
          const rr = i % 2 ? 4 : 9;
          const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
          if(i === 0) g.moveTo(px, py); else g.lineTo(px, py);
        }
        g.closePath();
        g.fill();
      }else{
        g.font = `900 18px ${FONT_DISPLAY}`;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText(info.icon, 0, 1);
      }
      if(this.tier > 0 && info.weapon){
        g.shadowBlur = 0;
        for(let i = 0; i < 3; i++){
          g.fillStyle = i < this.tier ? info.color : 'rgba(233,222,199,.18)';
          g.fillRect(-8 + i * 6, 21, 4, 2);
        }
      }
      g.shadowBlur = 0;
      if(player && dist2(player.x, player.y - 24, this.x, y) < 120 * 120){
        g.fillStyle = 'rgba(235,227,207,.7)';
        g.font = `700 9px ${FONT_CN}`;
        g.textAlign = 'center';
        g.fillText(info.name, 0, 35);
      }
      g.restore();
    }
  }

  /* =========================================================
     FIELD HAZARDS
     ========================================================= */
  class FieldHazard {
    constructor(def){
      this.x = def.x;
      this.y = def.y || GROUND_Y;
      this.type = def.type;
      this.period = def.period || 3.6;
      this.offset = def.offset || 0;
      this.warnDur = this.type === 'lightning' ? 1.15 : .95;
      this.activeDur = this.type === 'lightning' ? .34 : .62;
      this.t = 0;
      this.warning = false;
      this.active = false;
      this.wasActive = false;
      this.hitPlayer = false;
      this.phase = rand(0, TAU);
    }
    update(dt, game){
      this.t += dt;
      const cyc = (this.t + this.offset) % this.period;
      this.warning = cyc < this.warnDur;
      const active = cyc >= this.warnDur && cyc < this.warnDur + this.activeDur;
      if(active && !this.active){
        if(inView(this.x - 80, 160, game.camera.x, 100)){
          sound.sfx(this.type === 'lightning' ? 'thunder' : 'vent');
          game.shake = Math.max(game.shake, this.type === 'lightning' ? 4 : 2);
        }
        this.hitPlayer = false;
      }
      this.active = active;
      if(!active) this.hitPlayer = false;
      if(active && !this.hitPlayer && game.player && !game.player.dead){
        const p = game.player;
        const hb = p.hurtbox;
        const width = this.type === 'lightning' ? 26 : 34;
        const height = this.type === 'lightning' ? 430 : 150;
        if(hb.x < this.x + width && hb.x + hb.w > this.x - width &&
          hb.y < this.y && hb.y + hb.h > this.y - height){
          this.hitPlayer = true;
          game.damagePlayer(1, this.x);
        }
      }
      if(active && Math.random() < dt * 18 && inView(this.x - 80, 160, game.camera.x, 100)){
        if(this.type === 'lightning'){
          game.particles.spark(this.x + rand(-18, 18), this.y - rand(20, 220), '#b9eaff', 260, .3, -Math.PI / 2, 1.3);
        }else{
          game.particles.spark(this.x + rand(-22, 22), this.y - rand(10, 120), pick(['#ffc06a', '#ff7438']), 170, .4, -Math.PI / 2, 1.6);
        }
      }
      this.wasActive = active;
    }
    draw(g, game){
      if(!inView(this.x - 60, 120, game.camera.x, 80)) return;
      const warnPulse = this.warning ? (Math.sin(this.t * 18) + 1) * .5 : 0;
      g.save();
      // Ground warning
      if(this.warning || this.active){
        g.save();
        g.globalCompositeOperation = 'lighter';
        const color = this.type === 'lightning' ? '#8fdcff' : '#ff8d3e';
        g.globalAlpha = (this.warning ? .28 + warnPulse * .25 : .16);
        g.strokeStyle = color;
        g.lineWidth = 1.4;
        g.beginPath();
        g.ellipse(this.x, this.y + 2, 27 + warnPulse * 8, 7, 0, 0, TAU);
        g.stroke();
        g.globalAlpha *= .6;
        g.beginPath();
        g.ellipse(this.x, this.y + 2, 13 + warnPulse * 4, 3.5, 0, 0, TAU);
        g.stroke();
        g.restore();
        if(this.warning){
          g.fillStyle = this.type === 'lightning' ? '#bfefff' : '#ffd299';
          g.font = `700 8px ${FONT_MONO}`;
          g.textAlign = 'center';
          g.fillText('!', this.x, this.y - 13 - warnPulse * 3);
          if(this.type === 'lightning'){
            // The strike is full-height: make its warning visible from high platforms too.
            g.save();
            g.globalCompositeOperation = 'lighter';
            const top = 70;
            const col = g.createLinearGradient(0, top, 0, this.y);
            col.addColorStop(0, 'rgba(131,220,255,0)');
            col.addColorStop(.35, `rgba(131,220,255,${.035 + warnPulse * .035})`);
            col.addColorStop(.9, `rgba(131,220,255,${.07 + warnPulse * .05})`);
            col.addColorStop(1, 'rgba(131,220,255,0)');
            g.fillStyle = col;
            g.fillRect(this.x - 8, top, 16, this.y - top);
            g.strokeStyle = `rgba(170,237,255,${.18 + warnPulse * .18})`;
            g.lineWidth = 1;
            g.setLineDash([4, 12]);
            g.lineDashOffset = -this.t * 54;
            g.beginPath();
            g.moveTo(this.x, top);
            g.lineTo(this.x, this.y);
            g.stroke();
            g.setLineDash([]);
            g.fillStyle = `rgba(205,246,255,${.55 + warnPulse * .3})`;
            g.font = `900 14px ${FONT_DISPLAY}`;
            g.fillText('!', this.x, Math.max(196, this.y - 280));
            g.restore();
          }
        }
      }
      if(this.active){
        g.globalCompositeOperation = 'lighter';
        if(this.type === 'lightning'){
          const boltSeed = Math.floor(this.t * 30);
          g.strokeStyle = 'rgba(145,218,255,.2)';
          g.lineWidth = 18;
          g.beginPath();
          g.moveTo(this.x, 95);
          g.lineTo(this.x + Math.sin(this.t * 30) * 7, 240);
          g.lineTo(this.x - 6, this.y);
          g.stroke();
          g.strokeStyle = 'rgba(217,247,255,.9)';
          g.lineWidth = 3;
          g.beginPath();
          let bx = this.x + (hash(boltSeed) - .5) * 15;
          g.moveTo(bx, 60);
          for(let i = 1; i < 7; i++){
            bx += (hash(boltSeed + i * 2.1) - .5) * 30;
            g.lineTo(bx, 60 + i * (this.y - 60) / 7);
          }
          g.stroke();
          g.strokeStyle = 'rgba(255,255,255,.9)';
          g.lineWidth = 1;
          g.beginPath();
          g.moveTo(this.x - 2, 75);
          for(let i = 1; i < 6; i++){
            g.lineTo(this.x + (hash(boltSeed + i + 8) - .5) * 16, 75 + i * 62);
          }
          g.stroke();
          glowCircle(g, this.x, this.y - 10, 74, '#86d8ff', .3);
        }else{
          const flameH = 132 + Math.sin(this.t * 17) * 16;
          const grad = g.createLinearGradient(0, this.y, 0, this.y - flameH);
          grad.addColorStop(0, 'rgba(255,222,132,.8)');
          grad.addColorStop(.3, 'rgba(255,126,45,.62)');
          grad.addColorStop(1, 'rgba(177,38,16,0)');
          g.fillStyle = grad;
          g.beginPath();
          g.moveTo(this.x - 31, this.y);
          g.quadraticCurveTo(this.x - 19, this.y - flameH * .5, this.x - 8, this.y - flameH);
          g.quadraticCurveTo(this.x + 8, this.y - flameH * .7, this.x + 17, this.y - flameH * .95);
          g.quadraticCurveTo(this.x + 27, this.y - flameH * .48, this.x + 31, this.y);
          g.closePath();
          g.fill();
          glowCircle(g, this.x, this.y - 28, 58, '#ff6d2f', .25);
        }
      }
      g.restore();
    }
  }

  /* =========================================================
     PROJECTILES
     ========================================================= */
  class PlayerBullet {
    constructor(x, y, angle, spec, warm = false){
      this.x = x;
      this.y = y;
      this.vx = Math.cos(angle) * spec.speed;
      this.vy = Math.sin(angle) * spec.speed;
      this.angle = angle;
      this.r = spec.radius;
      this.damage = spec.damage;
      this.pierce = spec.pierce;
      this.life = spec.life;
      this.color = spec.color;
      this.weapon = spec.sfx;
      this.antiShield = !!spec.antiShield;
      this.dead = false;
      this.t = 0;
      this.warm = warm;
      this.hitIds = new Set();
    }
    update(dt, game){
      this.t += dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.life -= dt;
      if(this.life <= 0 || this.x < game.camera.x - 80 || this.x > game.camera.x + W + 80 ||
        this.y < -40 || this.y > H + 60 || game.playerBulletHitsTerrain(this.x, this.y)){
        this.dead = true;
      }
    }
    draw(g){
      const a = Math.atan2(this.vy, this.vx);
      const len = this.weapon === 'laser' ? 34 : (this.weapon === 'spread' ? 12 : 17);
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.strokeStyle = this.color;
      g.lineWidth = this.r * 1.8;
      g.lineCap = 'round';
      g.globalAlpha = .7;
      g.beginPath();
      g.moveTo(this.x - Math.cos(a) * len, this.y - Math.sin(a) * len);
      g.lineTo(this.x, this.y);
      g.stroke();
      g.globalAlpha = 1;
      g.strokeStyle = '#fff7d4';
      g.lineWidth = Math.max(1, this.r * .65);
      g.beginPath();
      g.moveTo(this.x - Math.cos(a) * len * .7, this.y - Math.sin(a) * len * .7);
      g.lineTo(this.x, this.y);
      g.stroke();
      g.fillStyle = this.color;
      g.beginPath();
      g.arc(this.x, this.y, this.r * .7, 0, TAU);
      g.fill();
      g.restore();
    }
  }

  class EnemyBullet {
    constructor(x, y, vx, vy, opts = {}){
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.r = opts.r || 5;
      this.color = opts.color || '#ff8b4e';
      this.life = opts.life || 4;
      this.t = 0;
      this.dead = false;
      this.gravity = opts.gravity || 0;
      this.type = opts.type || 'orb';
      this.damage = opts.damage || 1;
      this.spin = rand(0, TAU);
      this.trailTimer = 0;
      this.missile = this.type === 'missile';
      this.magma = this.type === 'magma';
      this.grenade = this.type === 'grenade';
      this.flak = this.type === 'flak';
      this.proximity = this.type === 'proximity';
      this.needle = this.type === 'needle';
      this.arcOverPlatforms = !!opts.arcOverPlatforms;
      this.planted = false;
      this.armTimer = opts.arm || .55;
      this.targetX = opts.targetX != null ? opts.targetX : x;
      this.targetY = opts.targetY != null ? opts.targetY : GROUND_Y - 8;
      this.fuse = opts.fuse || 0;
      this.onExplode = opts.onExplode || null;
      this.warningX = opts.warningX != null ? opts.warningX : this.targetX;
      this.explodeRadius = opts.explodeRadius || 62;
    }
    update(dt, game){
      this.t += dt;
      this.life -= dt;
      if(this.gravity) this.vy += this.gravity * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if(this.flak){
        this.trailTimer -= dt;
        if(this.trailTimer <= 0){
          this.trailTimer = .04;
          game.particles.trail(this.x, this.y + 4, '#5f5b50', 2.5, .32);
          game.particles.spark(this.x, this.y + 5, '#ffd18a', 60, .16, Math.atan2(-this.vy, -this.vx), 1.1);
        }
        this.fuse -= dt;
        if(this.fuse <= 0 || this.life <= 0 || game.bulletHitsTerrain(this.x, this.y)){
          this.burstFlak(game);
          return;
        }
        return;
      }
      if(this.proximity){
        if(!this.planted){
          this.trailTimer -= dt;
          if(this.trailTimer <= 0){
            this.trailTimer = .035;
            game.particles.trail(this.x, this.y + 5, '#504a40', 3, .35);
            game.particles.spark(this.x, this.y + 7, '#ffc47d', 90, .18, Math.atan2(-this.vy, -this.vx), 1.4);
          }
          if(this.y >= this.targetY || this.life <= 0 || game.bulletHitsTerrain(this.x, this.y)){
            this.x = clamp(this.x, game.stage.arenaLeft + 30, game.stage.width - 50);
            this.y = Math.min(this.y, GROUND_Y - 7);
            this.vx = 0;
            this.vy = 0;
            this.planted = true;
            this.life = 999;
            this.armTimer = .58;
            game.particles.hit(this.x, this.y, '#ffd8a0', 7, 250);
            game.particles.spark(this.x, this.y, '#ffb86b', 150, .35, -Math.PI / 2, 1.4);
            game.shake = Math.max(game.shake, 2);
            sound.sfx('beep');
          }
          return;
        }
        this.armTimer -= dt;
        if(Math.random() < dt * 30){
          game.particles.spark(this.x + rand(-7, 7), this.y - rand(0, 10), pick(['#ffd17d', '#ff6d3a']), 90, .28, -Math.PI / 2, 1.2);
        }
        if(this.armTimer <= 0){
          this.burstSiege(game);
        }
        return;
      }
      if(this.missile || this.magma || this.grenade){
        this.trailTimer -= dt;
        if(this.trailTimer <= 0){
          this.trailTimer = .035;
          if(this.magma){
            game.particles.trail(this.x, this.y + 5, '#7f3922', 4, .4);
            game.particles.spark(this.x, this.y + 7, '#ff8d45', 100, .2, Math.atan2(-this.vy, -this.vx), 1.7);
          }else if(this.grenade){
            game.particles.trail(this.x, this.y + 4, '#4b4438', 2.5, .28);
            game.particles.spark(this.x, this.y + 5, '#e0b677', 55, .15, Math.atan2(-this.vy, -this.vx), 1);
          }else{
            game.particles.trail(this.x, this.y + 6, '#8d4d37', 3, .4);
            game.particles.spark(this.x, this.y + 8, '#ffb06b', 70, .18, Math.atan2(-this.vy, -this.vx), 1.5);
          }
        }
        const hitTerrain = this.arcOverPlatforms
          ? game.bulletHitsGround(this.x, this.y)
          : game.bulletHitsTerrain(this.x, this.y);
        if(this.y >= GROUND_Y - 6 || this.life <= 0 || hitTerrain){
          this.explode(game);
          return;
        }
      }else if(this.life <= 0 || this.x < game.camera.x - 80 || this.x > game.camera.x + W + 100 ||
        this.y < -120 || this.y > H + 80 || game.bulletHitsTerrain(this.x, this.y)){
        this.dead = true;
      }
    }
    burstFlak(game){
      if(this.dead) return;
      this.dead = true;
      game.particles.explosion(this.x, this.y, .8, '#ffd59a');
      game.shake = Math.max(game.shake, 4);
      sound.sfx('explosion');
      const shards = 8;
      for(let i = 0; i < shards; i++){
        const a = i / shards * TAU + rand(-.16, .16);
        const sp = rand(150, 225);
        game.enemyBullets.push(new EnemyBullet(
          this.x, this.y, Math.cos(a) * sp, Math.sin(a) * sp,
          { r: 2.6, color: '#ffe0aa', life: 1.15, damage: 1 }
        ));
      }
    }
    burstSiege(game){
      if(this.dead) return;
      const ex = this.x;
      const ey = this.y;
      this.explode(game);
      for(let i = 0; i < 10; i++){
        const a = -Math.PI / 2 + rand(-1.05, 1.05);
        const sp = rand(170, 300);
        game.enemyBullets.push(new EnemyBullet(
          ex, ey - 4, Math.cos(a) * sp, Math.sin(a) * sp,
          { r: 3, color: '#ffd3a0', life: .95, gravity: 520, damage: 1 }
        ));
      }
    }
    explode(game){
      if(this.dead) return;
      this.dead = true;
      const ex = clamp(this.x, 0, game.stage.width);
      game.particles.explosion(ex, Math.min(this.y, GROUND_Y - 4), this.grenade ? .95 : 1.2, this.grenade ? '#d9a05a' : '#ff7340');
      game.shake = Math.max(game.shake, this.grenade ? 5 : 7);
      sound.sfx('explosion');
      if(typeof this.onExplode === 'function') this.onExplode(game, ex, Math.min(this.y, GROUND_Y - 4));
      game.markers.forEach(m => {
        if(m.missileWarning && this.warningX != null && Math.abs(m.x - this.warningX) < 12) m.done = true;
      });
      if(dist2(game.player.x, game.player.y - 20, ex, Math.min(this.y, GROUND_Y - 4)) < (this.explodeRadius + 12) ** 2){
        game.damagePlayer(1, ex);
      }
      for(const e of game.enemies){
        if(e.dead) continue;
        if(dist2(e.x, e.y - 20, ex, GROUND_Y - 10) < this.explodeRadius ** 2) e.hit(game, 3);
      }
    }
    draw(g){
      if(this.dead) return;
      if(this.needle){
        const a = Math.atan2(this.vy, this.vx);
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.translate(this.x, this.y);
        g.rotate(a);
        g.strokeStyle = 'rgba(255,88,91,.85)';
        g.lineWidth = 2.4;
        g.beginPath();
        g.moveTo(-16, 0);
        g.lineTo(8, 0);
        g.stroke();
        g.strokeStyle = 'rgba(255,211,153,.9)';
        g.lineWidth = .9;
        g.beginPath();
        g.moveTo(-8, 0);
        g.lineTo(9, 0);
        g.stroke();
        g.fillStyle = '#ffd3a0';
        g.beginPath();
        g.arc(8, 0, 1.7, 0, TAU);
        g.fill();
        g.restore();
        return;
      }
      if(this.proximity){
        g.save();
        g.translate(this.x, this.y);
        if(this.planted){
          const pulse = .5 + Math.sin(this.t * 20) * .3;
          g.globalCompositeOperation = 'lighter';
          g.fillStyle = `rgba(255,108,59,${.12 + pulse * .12})`;
          g.beginPath();
          g.ellipse(0, 1, 46, 12, 0, 0, TAU);
          g.fill();
          g.globalCompositeOperation = 'source-over';
          g.fillStyle = '#0e120e';
          roundRect(g, -10, -14, 20, 18, 4);
          g.fill();
          g.fillStyle = '#5d604b';
          g.fillRect(-7, -11, 14, 12);
          g.fillStyle = '#d6a565';
          g.fillRect(-7, -15, 14, 3);
          g.save();
          g.globalCompositeOperation = 'lighter';
          glowCircle(g, 0, -14, 22 + pulse * 8, '#ffb066', .5);
          g.fillStyle = '#fff1c3';
          g.beginPath();
          g.arc(0, -14, 3.5, 0, TAU);
          g.fill();
          g.restore();
          g.strokeStyle = `rgba(255,182,108,${.25 + pulse * .25})`;
          g.lineWidth = 1.5;
          for(let i = 0; i < 3; i++){
            g.beginPath();
            g.ellipse(0, 1, 18 + i * 12 + pulse * 6, 4 + i * 2, 0, 0, TAU);
            g.stroke();
          }
        }else{
          g.rotate(this.t * 9);
          g.fillStyle = '#0b100d';
          roundRect(g, -8, -12, 16, 24, 4);
          g.fill();
          g.fillStyle = '#5d604b';
          g.fillRect(-5, -9, 10, 18);
          g.fillStyle = '#ffb36d';
          g.fillRect(-2, -12, 4, 3);
          g.fillStyle = '#d6a565';
          g.fillRect(-6, 8, 12, 3);
          g.globalCompositeOperation = 'lighter';
          glowCircle(g, 0, 0, 26, '#ffb36d', .4);
        }
        g.restore();
        return;
      }
      if(this.flak){
        g.save();
        g.translate(this.x, this.y);
        g.rotate(this.t * 8);
        g.fillStyle = '#1b1e1a';
        g.fillRect(-6, -10, 12, 20);
        g.fillStyle = '#6b6f5f';
        g.fillRect(-4, -8, 8, 15);
        g.fillStyle = '#ffd495';
        g.fillRect(-2, -7, 4, 3);
        g.globalCompositeOperation = 'lighter';
        glowCircle(g, 0, 0, 14, '#ffcf8e', .3 + Math.abs(Math.sin(this.t * 8)) * .25);
        g.restore();
        return;
      }
      if(this.grenade){
        g.save();
        g.translate(this.x, this.y);
        g.rotate(this.t * 10);
        g.fillStyle = '#1a1d18';
        roundRect(g, -6, -9, 12, 18, 3);
        g.fill();
        g.fillStyle = '#5f674f';
        g.fillRect(-4, -7, 8, 13);
        g.fillStyle = '#d8b66c';
        g.fillRect(-2, -9, 4, 2);
        g.fillStyle = '#ffb062';
        g.fillRect(3, -3, 2, 2);
        g.restore();
        return;
      }
      if(this.magma){
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.translate(this.x, this.y);
        glowCircle(g, 0, 0, 28, '#ff5f27', .5);
        const hot = g.createRadialGradient(-2, -3, 1, 0, 0, 10);
        hot.addColorStop(0, '#fff4c7');
        hot.addColorStop(.35, '#ffcb65');
        hot.addColorStop(.75, '#ff6a2e');
        hot.addColorStop(1, 'rgba(138,30,12,.25)');
        g.fillStyle = hot;
        g.beginPath();
        g.arc(0, 0, 9 + Math.sin(this.t * 12) * 1.2, 0, TAU);
        g.fill();
        g.strokeStyle = 'rgba(255,153,76,.55)';
        g.lineWidth = 1;
        g.beginPath();
        g.arc(0, 0, 14, this.t * 4, this.t * 4 + 2.3);
        g.stroke();
        g.restore();
        return;
      }
      if(this.missile){
        const a = Math.atan2(this.vy, this.vx);
        g.save();
        g.translate(this.x, this.y);
        g.rotate(a);
        g.fillStyle = '#202626';
        roundRect(g, -12, -4, 24, 8, 3);
        g.fill();
        g.fillStyle = '#75412f';
        g.beginPath();
        g.moveTo(12, -4);
        g.lineTo(19, 0);
        g.lineTo(12, 4);
        g.closePath();
        g.fill();
        g.fillStyle = '#c0a067';
        g.fillRect(-9, -1, 9, 2);
        g.globalCompositeOperation = 'lighter';
        glowCircle(g, -13, 0, 15, '#ff9c57', .6);
        g.restore();
        return;
      }
      g.save();
      g.globalCompositeOperation = 'lighter';
      const len = this.type === 'heavy' ? 22 : (this.type === 'snipe' ? 32 : 12);
      const a = Math.atan2(this.vy, this.vx);
      g.strokeStyle = this.color;
      g.globalAlpha = .45;
      g.lineWidth = this.r * 1.8;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(this.x - Math.cos(a) * len, this.y - Math.sin(a) * len);
      g.lineTo(this.x, this.y);
      g.stroke();
      g.globalAlpha = 1;
      glowCircle(g, this.x, this.y, this.r * 4.2, this.color, .45);
      g.fillStyle = '#fff0ca';
      g.beginPath();
      g.arc(this.x, this.y, this.r * .56, 0, TAU);
      g.fill();
      g.strokeStyle = this.color;
      g.lineWidth = 1;
      g.beginPath();
      g.arc(this.x, this.y, this.r * 1.18, this.spin + this.t * 5, this.spin + this.t * 5 + 2.4);
      g.stroke();
      g.restore();
    }
  }

  /* =========================================================
     ENEMIES
     ========================================================= */
  class Enemy {
    constructor(def){
      this.def = def;
      this.type = def.type;
      this.x = def.x;
      this.y = def.y;
      this.spawnX = def.x;
      this.spawnY = def.y;
      this.dir = def.dir || -1;
      this.range = def.range || 45;
      this.onPlatform = !!def.onPlatform;
      this.baseY = def.y;
      this.anchorX = def.anchorX || def.x;
      this.t = rand(0, 4);
      this.anim = rand(0, TAU);
      this.phase = rand(0, TAU);
      this.dead = false;
      this.hitFlash = 0;
      this.muzzle = 0;
      this.aimAngle = this.dir > 0 ? 0 : Math.PI;
      this.fireTimer = rand(1.4, 2.4);
      this.burstLeft = 0;
      this.burstTimer = 0;
      this.alert = .8;
      this.patrolDir = this.dir;
      this.vx = 0;
      this.hp = 1;
      this.maxHp = 1;
      this.score = 100;
      this.w = 26;
      this.h = 46;
      this.turretAngle = Math.PI;
      switch(this.type){
        case 'elite':
          this.w = 30; this.h = 50; this.hp = this.maxHp = 6;
          this.score = 300; this.speed = 52; this.fireBase = 2.6;
          break;
        case 'runner':
          this.w = 23; this.h = 44; this.hp = this.maxHp = 1;
          this.score = 160; this.speed = 172; break;
        case 'turret':
          this.w = 46; this.h = 40; this.hp = this.maxHp = 5;
          this.score = 220; this.speed = 0; this.fireBase = 3.0; break;
        case 'drone':
          this.w = 44; this.h = 30; this.hp = this.maxHp = 2;
          this.score = 180; this.speed = 0; this.fireBase = 2.2; break;
        case 'sniper':
          this.w = 26; this.h = 48; this.hp = this.maxHp = 3;
          this.score = 240; this.speed = 34; this.fireBase = 2.9; break;
        case 'bomber':
          this.w = 40; this.h = 28; this.hp = this.maxHp = 2;
          this.score = 240; this.speed = 0; this.fireBase = 2.2; break;
        case 'grenadier':
          this.w = 28; this.h = 48; this.hp = this.maxHp = 4;
          this.score = 260; this.speed = 38; this.fireBase = 3.2; break;
        case 'shield':
          this.w = 34; this.h = 50; this.hp = this.maxHp = 7;
          this.score = 340; this.speed = 27; this.fireBase = 3.7; break;
        case 'flak':
          this.w = 50; this.h = 44; this.hp = this.maxHp = 6;
          this.score = 320; this.speed = 0; this.fireBase = 1.6; break;
        case 'mortar':
          this.w = 50; this.h = 38; this.hp = this.maxHp = 6;
          this.score = 320; this.speed = 0; this.fireBase = 3.4; break;
        default:
          this.w = 26; this.h = 46; this.hp = this.maxHp = 2;
          this.score = 100; this.speed = 48; this.fireBase = 2.2; break;
      }
      this.sniperCharge = 0;
      this.sniperAim = 0;
      this.bomberFuse = 0;
      this.bomberBeep = 0;
      this.y = this.baseY;
    }

    get bounds(){
      if(this.type === 'drone'){
        return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h };
      }
      return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h };
    }

    aimAt(player){
      const targetY = player.y - (player.crouching ? 17 : 27);
      const targetX = player.x;
      if(this.type === 'turret' || this.type === 'flak' || this.type === 'mortar'){
        this.aimAngle = Math.atan2(targetY - (this.y - 29), targetX - this.x);
      }else if(this.type === 'drone'){
        this.aimAngle = Math.atan2(targetY - (this.y + 4), targetX - this.x);
      }else{
        this.aimAngle = Math.atan2(targetY - (this.y - 29), targetX - this.x);
      }
      this.dir = targetX >= this.x ? 1 : -1;
    }

    fire(game){
      if(this.type === 'grenadier'){
        this.throwGrenade(game);
        return;
      }
      if(this.type === 'flak'){
        this.fireFlak(game);
        return;
      }
      if(this.type === 'mortar'){
        this.fireMortar(game);
        return;
      }
      let sx, sy;
      if(this.type === 'turret'){
        sx = this.x + Math.cos(this.aimAngle) * 31;
        sy = this.y - 25 + Math.sin(this.aimAngle) * 31;
      }else if(this.type === 'drone'){
        sx = this.x + Math.cos(this.aimAngle) * 18;
        sy = this.y + 4 + Math.sin(this.aimAngle) * 18;
      }else{
        sx = this.x + Math.cos(this.aimAngle) * 25 + this.dir * 2;
        sy = this.y - 31 + Math.sin(this.aimAngle) * 22;
      }
      const speed = this.type === 'elite' ? 380 : (this.type === 'drone' ? 260 : 320);
      const jitterAmp = this.type === 'elite' ? .035 : (this.type === 'drone' ? .08 : .06);
      const jitter = rand(-jitterAmp, jitterAmp);
      const a = this.aimAngle + jitter;
      game.enemyBullets.push(new EnemyBullet(
        sx, sy, Math.cos(a) * speed, Math.sin(a) * speed,
        {
          r: this.type === 'elite' ? 5.6 : (this.type === 'drone' ? 4.3 : 4.8),
          color: this.type === 'elite' ? '#ffc15e' : '#ff8b4e',
          life: 3.5,
          type: this.type === 'elite' ? 'heavy' : 'orb'
        }
      ));
      this.muzzle = .07;
      game.particles.muzzle(sx, sy, a, this.type === 'elite' ? '#ffd074' : '#ffb067', .7);
    }
    throwGrenade(game){
      const p = game.player;
      const sx = this.x + this.dir * 10;
      const sy = this.y - 36;
      const targetX = p.x + rand(-28, 28);
      const targetY = GROUND_Y - 8;
      const T = rand(1.05, 1.25);
      const grav = 780;
      const vx = (targetX - sx) / T;
      const vy = (targetY - sy - .5 * grav * T * T) / T;
      game.enemyBullets.push(new EnemyBullet(sx, sy, vx, vy, {
        gravity: grav, type: 'grenade', r: 6, color: '#d9a05a',
        life: T + .2, warningX: targetX, explodeRadius: 66
      }));
      game.markers.push({ x: targetX, y: GROUND_Y, t: 0, dur: T, missileWarning: true, done: false });
      this.muzzle = .08;
      game.particles.muzzle(sx, sy, -Math.PI / 2, '#e5c184', .8);
      sound.sfx('mortar');
    }
    fireFlak(game){
      const sx = this.x + Math.cos(this.aimAngle) * 28;
      const sy = this.y - 30 + Math.sin(this.aimAngle) * 28;
      const a = this.aimAngle + rand(-.04, .04);
      game.enemyBullets.push(new EnemyBullet(sx, sy, Math.cos(a) * 215, Math.sin(a) * 215, {
        r: 5, color: '#ffd18a', life: 1.6, type: 'flak', fuse: .72
      }));
      this.muzzle = .08;
      game.particles.muzzle(sx, sy, a, '#ffd89d', 1.1);
      sound.sfx('flak');
    }
    fireMortar(game){
      const p = game.player;
      const sx = this.x;
      const sy = this.y - 38;
      const targetX = p.x + rand(-35, 35);
      const targetY = GROUND_Y - 8;
      const T = rand(1.2, 1.45);
      const grav = 760;
      const vx = (targetX - sx) / T;
      const vy = (targetY - sy - .5 * grav * T * T) / T;
      game.enemyBullets.push(new EnemyBullet(sx, sy, vx, vy, {
        gravity: grav, type: 'grenade', r: 6.5, color: '#c9a16c',
        life: T + .2, warningX: targetX, explodeRadius: 72,
        arcOverPlatforms: true
      }));
      game.markers.push({ x: targetX, y: GROUND_Y, t: 0, dur: T, missileWarning: true, done: false });
      this.muzzle = .1;
      game.particles.muzzle(sx, sy, -Math.PI / 2, '#ffd39a', 1.2);
      sound.sfx('mortar');
    }

    update(dt, game){
      if(this.dead) return;
      this.t += dt;
      this.anim += dt;
      this.hitFlash = Math.max(0, this.hitFlash - dt);
      this.muzzle = Math.max(0, this.muzzle - dt);
      this.alert = Math.max(0, this.alert - dt);
      const player = game.player;
      const alive = player && !player.dead;
      const dx = player.x - this.x;
      const dy = (player.y - 20) - (this.y - 20);
      const seen = alive && Math.abs(dx) < 580 && Math.abs(dy) < 220;

      if(this.type === 'runner'){
        this.updateRunner(dt, game, seen, dx);
      }else if(this.type === 'drone'){
        this.updateDrone(dt, game, seen, dx);
      }else if(this.type === 'turret' || this.type === 'flak' || this.type === 'mortar'){
        this.updateTurret(dt, game, seen);
      }else if(this.type === 'sniper'){
        this.updateSniper(dt, game, seen, dx);
      }else if(this.type === 'bomber'){
        this.updateBomber(dt, game, seen, dx);
      }else{
        this.updateSoldier(dt, game, seen, dx, dy);
      }

      if(this.burstLeft > 0){
        this.burstTimer -= dt;
        if(this.burstTimer <= 0){
          if(seen) this.aimAt(player);
          this.fire(game);
          this.burstLeft--;
          this.burstTimer = .2;
        }
      }
    }

    updateSoldier(dt, game, seen, dx, dy){
      if(seen){
        this.aimAt(game.player);
        const isElite = this.type === 'elite';
        const range = this.range;
        if(!this.onPlatform && Math.abs(dx) > 170){
          this.dir = dx > 0 ? 1 : -1;
          const nx = this.x + this.dir * this.speed * dt;
          if(game.isGroundAt(nx)){
            this.x = clamp(nx, this.spawnX - range * 1.35, this.spawnX + range * 1.35);
            this.vx = this.dir * this.speed;
          }else{
            this.vx = 0;
          }
          this.anim += dt * 8;
        }else{
          this.anim += dt * 2;
          this.vx = 0;
        }
        this.fireTimer -= dt;
        if(this.fireTimer <= 0 && this.burstLeft <= 0){
          this.burstLeft = isElite ? 2 : 1;
          this.burstTimer = 0;
          this.fireTimer = this.fireBase + rand(.4, 1.0);
        }
      }else{
        this.dir = this.patrolDir;
        this.x += this.patrolDir * this.speed * .48 * dt;
        if(this.x > this.spawnX + this.range || this.x < this.spawnX - this.range){
          this.patrolDir *= -1;
          this.x = clamp(this.x, this.spawnX - this.range, this.spawnX + this.range);
        }
        this.anim += dt * 5;
        this.vx = this.patrolDir * this.speed * .48;
        this.aimAngle = this.dir > 0 ? 0 : Math.PI;
      }
    }

    updateRunner(dt, game, seen, dx){
      if(seen && Math.abs(dx) < 620){
        this.dir = dx > 0 ? 1 : -1;
        const nx = this.x + this.dir * this.speed * dt;
        if(game.isGroundAt(nx)) this.x = nx;
        this.anim += dt * 13;
        this.aimAngle = this.dir > 0 ? 0 : Math.PI;
        this.vx = this.dir * this.speed;
      }else{
        this.dir = this.patrolDir;
        const nx = this.x + this.patrolDir * 32 * dt;
        if(game.isGroundAt(nx)) this.x = nx;
        if(this.x > this.spawnX + this.range || this.x < this.spawnX - this.range){
          this.patrolDir *= -1;
          this.x = clamp(this.x, this.spawnX - this.range, this.spawnX + this.range);
        }
        this.anim += dt * 4;
        this.vx = this.patrolDir * 32;
      }
    }

    updateDrone(dt, game, seen, dx){
      const targetX = seen ? clamp(game.player.x, this.anchorX - 130, this.anchorX + 130) : this.anchorX;
      this.x = damp(this.x, targetX, 1.25, dt);
      this.y = this.baseY + Math.sin(this.t * 2.1 + this.phase) * 11;
      this.vx = 0;
      if(seen){
        this.aimAt(game.player);
        this.fireTimer -= dt;
        if(this.fireTimer <= 0 && this.burstLeft <= 0){
          this.burstLeft = 1;
          this.burstTimer = 0;
          this.fireTimer = this.fireBase + rand(.4, 1.0);
        }
      }else{
        this.aimAngle = this.vx >= 0 ? 0 : Math.PI;
      }
    }

    updateTurret(dt, game, seen){
      if(seen){
        this.aimAt(game.player);
        this.fireTimer -= dt;
        if(this.fireTimer <= 0 && this.burstLeft <= 0){
          this.burstLeft = this.type === 'turret' ? 2 : 1;
          this.burstTimer = 0;
          this.fireTimer = this.fireBase + rand(.5, 1.1);
        }
      }else{
        this.aimAngle = this.dir > 0 ? 0 : Math.PI;
      }
    }

    updateSniper(dt, game, seen, dx){
      if(seen && Math.abs(dx) < 820){
        this.vx = 0;
        this.anim += dt * 1.6;
        if(this.sniperCharge > 0){
          this.sniperCharge -= dt;
          if(this.sniperCharge <= 0) this.fireSniper(game);
        }else{
          this.aimAt(game.player);
          this.fireTimer -= dt;
          if(this.fireTimer <= 0){
            this.sniperCharge = .78;
            this.sniperAim = this.aimAngle;
            this.fireTimer = this.fireBase + rand(.6, 1.3);
          }
        }
      }else{
        this.sniperCharge = 0;
        this.dir = this.patrolDir;
        this.x += this.patrolDir * this.speed * dt;
        if(this.x > this.spawnX + this.range || this.x < this.spawnX - this.range){
          this.patrolDir *= -1;
          this.x = clamp(this.x, this.spawnX - this.range, this.spawnX + this.range);
        }
        this.vx = this.patrolDir * this.speed;
        this.anim += dt * 4;
        this.aimAngle = this.dir > 0 ? 0 : Math.PI;
      }
    }

    fireSniper(game){
      const a = this.sniperAim;
      const sx = this.x + Math.cos(a) * 29;
      const sy = this.y - 32 + Math.sin(a) * 20;
      game.enemyBullets.push(new EnemyBullet(
        sx, sy, Math.cos(a) * 680, Math.sin(a) * 680,
        { r: 4.6, color: '#ff6648', life: 4, type: 'snipe' }
      ));
      this.muzzle = .1;
      game.particles.muzzle(sx, sy, a, '#ff9b70', 1);
      game.shake = Math.max(game.shake, 1.5);
      sound.sfx('snipe');
    }

    updateBomber(dt, game, seen, dx){
      const p = game.player;
      this.bomberBeep = Math.max(0, this.bomberBeep - dt);
      if(!seen){
        this.x = damp(this.x, this.anchorX, 1.1, dt);
        this.y = this.baseY + Math.sin(this.t * 2.3 + this.phase) * 9;
        this.bomberFuse = 0;
        return;
      }
      const targetX = clamp(p.x, this.anchorX - 165, this.anchorX + 165);
      const targetY = p.y - 28;
      if(this.bomberFuse > 0){
        this.bomberFuse -= dt;
        const angle = Math.atan2(targetY - this.y, targetX - this.x);
        const speed = 245;
        this.x += Math.cos(angle) * speed * dt;
        this.y += Math.sin(angle) * speed * dt;
        this.vx = Math.cos(angle) * speed;
        if(this.bomberFuse <= 0 || dist2(this.x, this.y, p.x, p.centerY) < 38 * 38){
          this.selfDestruct(game);
        }
      }else{
        this.x = damp(this.x, targetX, 1.1, dt);
        this.y = damp(this.y, this.baseY + Math.sin(this.t * 2.3 + this.phase) * 9, 2.5, dt);
        this.vx = (p.x - this.x) * .02;
        if(dist2(this.x, this.y, p.x, p.centerY) < 240 * 240){
          this.bomberFuse = .95;
          this.bomberBeep = .95;
          sound.sfx('beep');
        }
      }
    }

    selfDestruct(game){
      if(this.dead) return;
      this.dead = true;
      game.particles.explosion(this.x, this.y, 1.25, '#ff7c42');
      game.shake = Math.max(game.shake, 8);
      game.flash = Math.max(game.flash, .1);
      sound.sfx('explosion');
      if(dist2(game.player.x, game.player.centerY, this.x, this.y) < 88 * 88){
        game.damagePlayer(1, this.x);
      }
    }

    hit(game, dmg, hx, hy, bullet = null){
      if(this.dead) return;
      const bx = hx == null ? this.x : hx;
      const by = hy == null ? this.y - this.h * .5 : hy;
      const antiShield = !!(bullet && bullet.antiShield);
      if(this.type === 'shield' && hx != null){
        const fromFront = (hx - this.x) * this.dir > 0;
        const fromAbove = hy != null && hy < this.y - this.h * .84;
        if(fromFront && !fromAbove && !antiShield){
          this.hp -= dmg * .18;
          this.hitFlash = .08;
          game.particles.hit(bx, by, '#dfe6d4', 4, 170);
          game.particles.spark(bx, by, '#fff0b0', 120, .2, null, 1.1);
          sound.sfx('enemyHit');
          if(this.hp <= 0) this.die(game);
          return;
        }
      }
      this.hp -= dmg;
      this.hitFlash = .08;
      game.particles.hit(bx, by, this.type === 'drone' ? '#ffd27b' : '#ffb37b', 5, 220);
      if(this.hp <= 0){
        this.die(game);
      }else{
        sound.sfx('enemyHit');
      }
    }

    die(game){
      if(this.dead) return;
      this.dead = true;
      const gained = game.registerKill(this.score);
      game.particles.scoreText(
        this.x, this.y - this.h - 4, `+${gained}`,
        this.type === 'elite' || this.type === 'turret' || this.type === 'shield' ? '#ffd06a' : '#ffe0a4',
        this.type === 'elite' || this.type === 'turret' || this.type === 'shield' ? 11 : 9
      );
      if(this.type === 'drone'){
        game.particles.explosion(this.x, this.y, .9, '#ff9b55');
        sound.sfx('explosion');
      }else if(this.type === 'bomber'){
        game.particles.explosion(this.x, this.y, 1.15, '#ff7442');
        sound.sfx('explosion');
        game.shake = Math.max(game.shake, 6);
      }else if(this.type === 'turret' || this.type === 'flak' || this.type === 'mortar'){
        game.particles.explosion(this.x, this.y - 18, 1.35, '#ff9b55');
        sound.sfx('explosion');
      }else{
        game.particles.explosion(this.x, this.y - 22, .72, '#ff8555');
        game.particles.spark(this.x, this.y - 24, '#c8694b', 170, .5, -Math.PI / 2, 2);
        sound.sfx('enemyDie');
      }
      game.shake = Math.max(game.shake, this.type === 'turret' ? 5 : 2.5);
      game.killFlash = Math.max(game.killFlash, .06);
    }

    draw(g, game){
      if(this.dead) return;
      if(this.type === 'drone') this.drawDrone(g);
      else if(this.type === 'turret') this.drawTurret(g);
      else if(this.type === 'runner') this.drawRunner(g);
      else if(this.type === 'bomber') this.drawBomber(g);
      else if(this.type === 'sniper') this.drawSniper(g);
      else if(this.type === 'grenadier') this.drawGrenadier(g);
      else if(this.type === 'shield') this.drawShield(g);
      else if(this.type === 'flak') this.drawFlak(g);
      else if(this.type === 'mortar') this.drawMortar(g);
      else this.drawSoldier(g);
      // Health bar
      if(this.hp < this.maxHp && this.type !== 'soldier' && this.type !== 'runner'){
        const bw = this.type === 'turret' ? 42 : 34;
        const bx = this.x - bw / 2;
        const by = this.y - this.h - 10;
        g.fillStyle = 'rgba(3,7,7,.72)';
        g.fillRect(bx, by, bw, 4);
        g.fillStyle = this.type === 'elite' ? '#ffc15e' : '#ff7b47';
        g.fillRect(bx + 1, by + 1, (bw - 2) * clamp(this.hp / this.maxHp, 0, 1), 2);
      }
      if(this.hitFlash > 0){
        g.save();
        g.globalCompositeOperation = 'lighter';
        glowCircle(g, this.x, this.y - this.h * .55, this.w * 1.3, '#ffd5a1', .75);
        g.restore();
      }
      if(this.alert > 0){
        const by = this.type === 'drone' ? this.y - 30 : this.y - this.h - 14;
        g.save();
        g.globalAlpha = clamp(this.alert * 2, 0, 1);
        g.fillStyle = '#ffcf6a';
        g.font = `900 13px ${FONT_MONO}`;
        g.textAlign = 'center';
        g.fillText('!', this.x, by);
        g.restore();
      }
    }

    drawLegs(g, phase, moving, crouch = false){
      // local coords, facing right
      const stanceY = crouch ? -13 : -20;
      const swing = moving ? Math.sin(phase) * 10 : 3;
      const swing2 = moving ? Math.sin(phase + Math.PI) * 10 : -4;
      const drawLeg = (dx1, dy1, dx2, dy2, dx3, dy3, col) => {
        g.strokeStyle = '#0a0e0e';
        g.lineWidth = 8;
        g.lineCap = 'round';
        g.lineJoin = 'round';
        g.beginPath();
        g.moveTo(dx1, dy1);
        g.lineTo(dx2, dy2);
        g.lineTo(dx3, dy3);
        g.stroke();
        g.strokeStyle = col;
        g.lineWidth = 5;
        g.stroke();
        g.fillStyle = '#0e1413';
        g.fillRect(dx3 - 5, dy3 - 3, 10, 4);
      };
      drawLeg(-3, stanceY, -3 + swing2 * .4, stanceY * .55, -8 + swing2, 0, '#26302c');
      drawLeg(1, stanceY, 3 + swing * .4, stanceY * .55, 2 + swing, 0, '#36433c');
    }

      const localAim = this.dir > 0 ? this.aimAngle : Math.PI - this.aimAngle;
      g.save();
      g.translate(3, -33);

      g.fillStyle = '#0a1010';

      g.fillRect(21, -8, 3, 2);

      g.shadowBlur = 6;
      g.fillRect(2, -45, 6, 2);
      g.shadowBlur = 0;
      g.restore();
      if(this.sniperCharge > 0){
        const progress = 1 - this.sniperCharge / .78;

        const ox = this.x + Math.cos(a) * 34;
        const oy = this.y - 32 + Math.sin(a) * 24;
        const ex = ox + Math.cos(a) * 880;

        g.save();

        g.beginPath();
        g.moveTo(ox, oy);
        g.lineTo(ex, ey);
        g.stroke();
        g.setLineDash([]);
        g.fillStyle = `rgba(255,107,75,${.3 + progress * .5})`;
        g.beginPath();
        g.arc(ox, oy, 3 + progress * 2, 0, TAU);
        g.fill();
        glowCircle(g, ox, oy, 18, '#ff5a3f', .18 + progress * .25);
        g.restore();
      }
    }

    drawBomber(g){
      g.save();
      g.translate(this.x, this.y);
      g.fillStyle = 'rgba(0,0,0,.2)';
      g.beginPath();
      g.ellipse(0, GROUND_Y - this.y, 19, 4, 0, 0, TAU);
      g.fill();
      const fuse = this.bomberFuse > 0;
      const blink = Math.sin(this.t * (fuse ? 24 : 6)) > 0;
      g.rotate(Math.sin(this.t * 2 + this.phase) * .08);
      if(fuse){
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.strokeStyle = `rgba(255,75,43,${.25 + (1 - this.bomberFuse) * .4})`;
        g.lineWidth = 1.5;
        g.beginPath();
        g.arc(0, 0, 25 + (1 - this.bomberFuse) * 11, 0, TAU);
        g.stroke();
        g.restore();
      }
      // Side wings
      g.fillStyle = '#231b18';
      g.beginPath();
      g.moveTo(-8, -4);
      g.lineTo(-28, -15);
      g.lineTo(-20, -1);
      g.lineTo(-26, 8);
      g.closePath();
      g.fill();
      g.beginPath();
      g.moveTo(8, -4);
      g.lineTo(28, -15);
      g.lineTo(20, -1);
      g.lineTo(26, 8);
      g.closePath();
      g.fill();
      // Armored fuselage
      const hull = g.createLinearGradient(-8, -13, 7, 11);
      hull.addColorStop(0, '#5a4032');
      hull.addColorStop(.5, '#3c2a23');
      hull.addColorStop(1, '#171412');
      g.fillStyle = hull;
      g.beginPath();
      g.moveTo(-13, -2);
      g.quadraticCurveTo(-10, -13, 0, -14);
      g.quadraticCurveTo(12, -12, 14, 1);
      g.lineTo(7, 10);
      g.lineTo(-8, 10);
      g.closePath();
      g.fill();
      g.fillStyle = '#0d1211';

    drawDrone(g){

      g.quadraticCurveTo(23, -7, 17, 4);
      g.lineTo(8, 10);
      g.lineTo(-11, 9);

      body.addColorStop(.45, '#2d3731');
      body.addColorStop(1, '#131b18');
      g.fillStyle = body;
      g.beginPath();
      g.moveTo(-16, 1);
      g.quadraticCurveTo(-20, -10, -7, -13);
      g.lineTo(11, -11);
      g.quadraticCurveTo(19, -5, 14, 3);
      g.lineTo(6, 7);
      g.lineTo(-9, 7);
      g.closePath();

      g.strokeStyle = 'rgba(185,192,165,.3)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(-13, -8);
      g.lineTo(7, -9);
      g.stroke();
      // Eye
      g.fillStyle = '#ff6c3f';
      glowCircle(g, 6, -1, 12, '#ff5a31', .55);
      g.beginPath();
      g.ellipse(6, -1, 5.3, 3, -.1, 0, TAU);

      if(this.muzzle > 0){
        const a = this.aimAngle;

      }
      g.restore();
    }
