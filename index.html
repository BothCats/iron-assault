  class TankBoss {
    constructor(spec){
      this.spec = spec;
      this.kind = 'tank';
      this.x = spec.x;
      this.y = spec.y;
      this.homeX = spec.x;
      this.maxHp = spec.hp;
      this.hp = spec.hp;
      this.name = spec.name || '沙海重坦';
      this.shortName = spec.shortName || '歌利亚';
      this.designation = spec.designation || '攻城重坦';
      this.en = spec.en || 'GOLIATH // SIEGE TANK';
      this.playerLimitBase = spec.playerLimitX || spec.x - 210;
      this.playerLimitX = this.playerLimitBase;
      this.active = false;
      this.dead = false;
      this.startDelay = 0;
      this.t = 0;
      this.bob = 0;
      this.phase = 1;
      this.cd = 1.8;
      this.action = null;
      this.attackIndex = 0;
      this.hitFlash = 0;
      this.hitPoint = null;
      this.muzzleFlash = 0;
      this.recoil = 0;
      this.pools = [];
      this.mines = [];
    }
    get bounds(){
      return { x: this.x - 195, y: this.y - 252 + this.bob, w: 345, h: 252 };
    }
    get core(){
      // Forward transmission weak point, in front of the hull box.
      return { x: this.x - 208, y: this.y - 114 + this.bob, r: 42 };
    }
    get hudStatus(){
      if(this.phase > 1) return { text: 'OVERDRIVE', color: '#ff8b55' };
      return { text: '加农炮 / 燃烧弹', color: 'rgba(206,197,179,.5)' };
    }
    activate(game){
      if(this.active) return;
      this.active = true;
      this.startDelay = 2.2;
      this.cd = 1.3;
      this.t = 0;
    }
    update(dt, game){
      this.t += dt;
      this.bob = Math.sin(this.t * 1.5) * 1.5;
      this.hitFlash = Math.max(0, this.hitFlash - dt);
      this.muzzleFlash = Math.max(0, this.muzzleFlash - dt);
      this.recoil = Math.max(0, this.recoil - dt * 7);
      if(this.dead){
        this.pools.length = 0;
        this.mines.length = 0;
        return;
      }
      // Burning fuel pools
      for(let i = this.pools.length - 1; i >= 0; i--){
        const pool = this.pools[i];
        pool.t += dt;
        pool.life -= dt;
        if(pool.life <= 0){ this.pools.splice(i, 1); continue; }
        if(game.player && !game.player.dead && game.player.y > GROUND_Y - 80 &&
          Math.abs(game.player.x - pool.x) < pool.r){
          game.damagePlayer(1, pool.x);
        }
        if(Math.random() < dt * 18){
          game.particles.spark(pool.x + rand(-pool.r * .7, pool.r * .7), GROUND_Y - rand(2, 20), pick(['#ffbb62', '#ff6c32']), 100, .45, -Math.PI / 2, 1.4);
        }
      }
      // Mine timers
      for(let i = this.mines.length - 1; i >= 0; i--){
        const mine = this.mines[i];
        mine.t += dt;
        if(mine.t >= mine.life){
          this.mines.splice(i, 1);
          game.particles.explosion(mine.x, GROUND_Y - 8, 1.1, '#ff9b55');
          game.shake = Math.max(game.shake, 7);
          sound.sfx('explosion');
          if(Math.abs(game.player.x - mine.x) < 48 && game.player.y > GROUND_Y - 70) game.damagePlayer(1, mine.x);
        }
      }
      if(!this.active || this.dead) return;
      if(this.startDelay > 0){ this.startDelay -= dt; return; }
      if(this.phase > 1){
        // In the last phase the tank grinds forward, compressing the player's lane.
        this.x = damp(this.x, this.homeX - 70, .75, dt);
        this.playerLimitX = Math.min(this.playerLimitBase, this.x - 225);
        if(Math.random() < dt * 8){
          game.particles.dust(this.x - rand(80, 170), GROUND_Y, 1, 1);
        }
      }
      if(game.player.dead) return;
      if(this.action) this.updateAction(dt, game);
      else{
        this.cd -= dt;
        if(this.cd <= 0) this.chooseAction(game);
      }
    }
    chooseAction(game){
      const cycle = this.phase === 1 ? ['cannon', 'napalm', 'mines'] : ['cannon', 'mines', 'napalm', 'cannon'];
      const name = cycle[this.attackIndex++ % cycle.length];
      this.action = { name, t: 0, fired: 0 };
      if(name === 'mines') sound.sfx('alarm');
    }
    updateAction(dt, game){
      const a = this.action;
      if(!a) return;
      a.t += dt;
      if(a.name === 'cannon'){
        const shots = this.phase === 1 ? 1 : 2;
        if(a.t >= .45 + a.fired * .3 && a.fired < shots){
          this.fireCannon(game);
          a.fired++;
        }
        if(a.t > .45 + shots * .3 + .6) this.finishAction(this.phase === 1 ? 1.4 : .9);
      }else if(a.name === 'napalm'){
        const shots = this.phase === 1 ? 2 : 3;
        if(a.t >= .38 + a.fired * .32 && a.fired < shots){
          this.launchNapalm(game);
          a.fired++;
        }
        if(a.t > .38 + shots * .32 + .7) this.finishAction(this.phase === 1 ? 1.4 : .9);
      }else if(a.name === 'mines'){
        if(a.fired === 0 && a.t >= .4){
          a.fired = 1;
          this.spawnMines(game);
        }
        if(a.t > 1.0) this.finishAction(this.phase === 1 ? 1.35 : .85);
      }
    }
    finishAction(cd){
      this.action = null;
      this.cd = cd;
    }
    fireCannon(game){
      const sx = this.x - 152;
      const sy = this.y - 192 + this.bob;
      const p = game.player;
      const a = Math.atan2(p.centerY - sy, p.x - sx) + rand(-.02, .02);
      game.enemyBullets.push(new EnemyBullet(sx, sy, Math.cos(a) * 470, Math.sin(a) * 470, {
        r: 7, color: '#ffd08a', life: 4, type: 'heavy'
      }));
      this.muzzleFlash = .1;
      this.recoil = 1;
      game.particles.muzzle(sx, sy, a, '#ffe3af', 1.7);
      game.shake = Math.max(game.shake, 4);
      sound.sfx('bossCannon');

    launchNapalm(game){
      const sx = this.x - 30;

      game.enemyBullets.push(new EnemyBullet(sx, sy, vx, vy, {
        gravity: grav, type: 'grenade', r: 7, color: '#e1a45c',

          this.pools.push({ x: targetX, t: 0, life: 5.4, r: 55 });

      game.markers.push({ x: targetX, y: GROUND_Y, t: 0, dur: T, missileWarning: true, done: false });

      ];
      for(const x of positions){
        this.mines.push({ x, t: 0, life: 1.55 });
      }

      sound.sfx('beep');

    hit(game, dmg, core, hx, hy){

      this.hp -= dmg * (core ? 1.8 : .66);
      game.particles.hit(this.hitPoint.x, this.hitPoint.y, core ? '#ffd172' : '#e1a66b', core ? 8 : 4, core ? 300 : 180);

    resetAfterPlayerDeath(){

  class EliteBoss {
    constructor(spec){

      this.startX = spec.x;
      this.x = spec.x;
      this.y = GROUND_Y;
      this.arenaLeft = spec.arenaLeft != null ? spec.arenaLeft : spec.triggerX - 20;
      this.arenaRight = spec.arenaRight || spec.playerLimitX || this.x + 420;
      this.playerLimitX = spec.playerLimitX != null ? spec.playerLimitX : this.arenaRight;
      this.playerMinX = spec.playerMinX != null ? spec.playerMinX : this.arenaLeft + 25;
      this.w = 44;
      this.h = 96;
      this.maxHp = spec.hp;
      this.hp = spec.hp;
      this.name = spec.name || '沙海猎手';
      this.shortName = spec.shortName || '赤蝎';
      this.designation = spec.designation || '超级精英';
      this.en = spec.en || 'SCARLET SCORPION';
      this.active = false;
      this.dead = false;
      this.startDelay = 0;
      this.t = 0;
      this.anim = 0;
      this.phase = 1;
      this.cd = 1.2;
      this.action = null;
      this.attackIndex = 0;
      this.hitFlash = 0;
      this.hitPoint = null;
      this.muzzle = 0;
      this.facing = -1;
      this.vx = 0;
      this.vy = 0;
      this.onGround = true;
      this.side = 1;
      this.sideTimer = 1.4;
      this.pools = [];
      this.waves = [];
      this.afterimages = [];
    }
    get bounds(){
      return { x: this.x - 22, y: this.y - 96, w: 44, h: 96 };
    }
    get core(){
      return { x: this.x, y: this.y - 80, r: 13 };
    }
    get hudStatus(){
      if(this.action){
        if(this.action.name === 'dash') return { text: '刃步突进', color: '#ff6f5c' };
        if(this.action.name === 'shock') return { text: '震荡波', color: '#ffad63' };
        if(this.action.name === 'needles') return { text: '赤羽飞针', color: '#ff8e86' };
        if(this.action.name === 'grenade') return { text: '燃烧榴弹', color: '#ffc06e' };
      }
      if(this.phase > 1) return { text: 'OVERDRIVE', color: '#ff7155' };
      return { text: '高速猎杀模式', color: 'rgba(211,190,168,.55)' };
    }
    activate(game){
      if(this.active) return;
      this.active = true;
      this.startDelay = 1.8;
      this.cd = .9;
      this.t = 0;
      game.showToast('精英目标现身', 'SCARLET SCORPION // 高速近战 · 燃烧榴弹 · 震荡波', 3.0, '#ff9a71');

    update(dt, game){

      this.muzzle = Math.max(0, this.muzzle - dt);
      this.updatePools(dt, game);
      this.updateWaves(dt, game);
      for(let i = this.afterimages.length - 1; i >= 0; i--){
        this.afterimages[i].life -= dt;
        if(this.afterimages[i].life <= 0) this.afterimages.splice(i, 1);
      }
      if(!this.active || this.dead) return;
      if(this.startDelay > 0){ this.startDelay -= dt; return; }
      if(game.player.dead) return;
      if(this.action){
        this.updateAction(dt, game);

    updateMovement(dt, game){

      if(Math.abs(desired - p.x) < 92){
        this.side *= -1;
        desired = clamp(p.x + this.side * 145, this.arenaLeft + 52, this.arenaRight - 52);
      }
      const dx = desired - this.x;
      const speed = this.phase > 1 ? 290 : 220;
      this.vx = Math.abs(dx) > 10 ? sign(dx) * speed : 0;
      this.x = clamp(this.x + this.vx * dt, this.arenaLeft + 38, this.arenaRight - 38);
      if(this.x <= this.arenaLeft + 40 || this.x >= this.arenaRight - 40) this.side *= -1;

    chooseAction(game){
      const cycle = this.phase === 1
        ? ['needles', 'grenade', 'dash', 'shock']

      // Do not dash into a corner and end up standing inside the player.

        name = 'needles';

          game.player.x + this.action.dir * 125,
          this.arenaLeft + 45,
          this.arenaRight - 45
        );

        sound.sfx('alarm');
      }else if(name === 'grenade'){
        sound.sfx('alarm');
      }
    }
    updateAction(dt, game){
      const a = this.action;
      if(!a) return;
      a.t += dt;
      if(a.name === 'needles'){
        const shots = this.phase === 1 ? 2 : 3;
        if(a.t >= .24 + a.fired * .22 && a.fired < shots){
          this.fireNeedles(game);
          a.fired++;
        }
        if(a.t > .24 + shots * .22 + .42) this.finishAction(this.phase === 1 ? .58 : .34);
      }else if(a.name === 'grenade'){
        const shots = this.phase === 1 ? 2 : 3;
        if(a.t >= .3 + a.fired * .28 && a.fired < shots){
          this.throwIncendiary(game, a.fired);
          a.fired++;
        }
        if(a.t > .3 + shots * .28 + .52) this.finishAction(this.phase === 1 ? .62 : .38);

          a.fired = 1;
          this.spawnShockwaves(game);

        if(a.t >= .3 && !a.dashStarted){
          a.dashStarted = true;

          sound.sfx('trainWhistle');

        if(a.dashStarted && a.t < .66){
          const nextX = this.x + a.dir * 920 * dt;
          this.x = a.dir > 0 ? Math.min(nextX, a.dashEndX) : Math.max(nextX, a.dashEndX);
          this.x = clamp(this.x, this.arenaLeft + 35, this.arenaRight - 35);
          if(Math.random() < dt * 58){
            this.afterimages.push({ x: this.x, y: this.y, facing: this.facing, life: .24, maxLife: .24 });

          game.particles.spark(this.x - a.dir * 14, this.y - rand(18, 72), '#ff8b63', 220, .22, Math.PI / 2, 1.5);

    finishAction(cd){

    fireNeedles(game){
      const p = game.player;
      const sx = this.x + this.facing * 17;

      const base = Math.atan2(p.centerY - sy, p.x - sx);
      for(let i = 0; i < 5; i++){

    throwIncendiary(game, index){

      const targetY = GROUND_Y - 8;
      const T = rand(.92, 1.12);

      const vx = (targetX - sx) / T;
      const vy = (targetY - sy - .5 * grav * T * T) / T;
      game.enemyBullets.push(new EnemyBullet(sx, sy, vx, vy, {
        gravity: grav, type: 'grenade', r: 6, color: '#ffb06c',

    updatePools(dt, game){

        if(pool.life <= 0){ this.pools.splice(i, 1); continue; }
        if(game.player && !game.player.dead && game.player.y > GROUND_Y - 78 &&
          Math.abs(game.player.x - pool.x) < pool.r){

      if(this.hitFlash > 0){

  function createBoss(spec){
    if(spec.kind === 'crucible') return new CrucibleBoss(spec);
    if(spec.kind === 'aegis') return new AegisBoss(spec);
    if(spec.kind === 'train') return new TrainBoss(spec);
    if(spec.kind === 'tank') return new TankBoss(spec);
    if(spec.kind === 'elite') return new EliteBoss(spec);
    return new Boss(spec);
  }

  /* =========================================================
     GAME FLOW / WORLD SIMULATION
     ========================================================= */
  class Game {
    constructor(){
      this.time = 0;
      this.worldTime = 0;
      this.state = 'title';
      this.best = parseInt(storageGet('ironAssault.best', '0'), 10) || 0;
      this.runHistory = loadRunHistory();
      this.score = 0;
      this.lives = 3;
      this.deaths = 0;
      this.kills = 0;
      this.bossKills = 0;
      this.runRecorded = false;
      this.runTime = 0;
      this.stageRunTime = 0;
      this.stageIndex = 0;
      this.combo = 0;
      this.comboTimer = 0;
      this.comboFlash = 0;
      this.comboBest = 0;
      this.newRecord = false;
      this.timeBonus = 0;
      this.timeRemaining = 0;
      this.timeBonusAwarded = false;
      this.stage = buildStage(0);
      this.camera = { x: 0 };
      this.cameraMax = Math.max(0, this.stage.width - W);
      this.player = null;
      this.enemies = [];
      this.enemyDefs = [];
      this.props = [];
      this.pickups = [];
      this.playerBullets = [];
      this.enemyBullets = [];
      this.particles = new ParticleSystem();
      this.markers = [];
      this.hazards = [];
      this.lavaChase = null;
      this.boss = null;
      this.bossActive = false;
      this.gateClosed = false;
      this.bossWarning = 0;
      this.bossPhaseWarning = 0;
      this.bossDefeatTimer = 0;
      this.bossExplosionTimer = 0;
      this.stageIntro = 0;
      this.stageClearTimer = 0;
      this.stageClearBonus = 0;
      this.toast = null;
      this.shake = 0;
      this.flash = 0;
      this.killFlash = 0;
      this.fade = 1;
      this.titleEnteredAt = 0;
      this.gameOverTimer = 0;
      this.victoryTimer = 0;
      this.pendingGameOver = false;
      this.lastDroppedWeapons = 0;
      this.lastDropFell = false;
      this.checkpointIndex = 0;
      this.checkpoint = { x: 0, y: GROUND_Y };
      this.titleHero = null;
      this.setupTitle();
      this.bindPauseEvents();
    }

    setupTitle(){
      this.state = 'title';
      this.stage = buildStage(0);
      this.camera = { x: 0 };
      this.titleEnteredAt = this.time;
      this.titleHero = {
        x: 794, y: 497, facing: -1, onGround: true, crouching: false,
        vx: 0, vy: 0, animTime: 0, runPhase: 0, aimAngle: -2.95,
        recoil: 0, muzzle: 0
      };
      this.player = null;
      this.boss = null;
      this.enemies = [];
      this.props = [];
      this.pickups = [];
      this.playerBullets = [];
      this.enemyBullets = [];
      this.markers = [];
      this.hazards = [];
      this.lavaChase = null;
      this.particles = new ParticleSystem();
      this.toast = null;
      this.shake = 0;
      this.flash = 0;
      this.fade = 0;
      sound.setPaused(false);
      sound.setTrack('none');
    }

    bindPauseEvents(){
      const pauseIfPlaying = () => {
        if(this.state === 'playing' && this.player && !this.player.dead){
          this.pauseGame();
        }
      };
      window.addEventListener('blur', pauseIfPlaying);
      document.addEventListener('visibilitychange', () => {
        if(document.hidden) pauseIfPlaying();
      });
    }

    startNewRun(){
      sound.unlock();
      sound.setPaused(false);
      this.score = 0;
      this.lives = 3;
      this.deaths = 0;
      this.kills = 0;
      this.bossKills = 0;
      this.runRecorded = false;
      this.runTime = 0;
      this.combo = 0;
      this.comboTimer = 0;
      this.comboFlash = 0;
      this.comboBest = 0;
      this.newRecord = false;
      this.timeBonus = 0;
      this.timeRemaining = 0;
      this.timeBonusAwarded = false;
      this.runHistory = loadRunHistory();
      this.pendingGameOver = false;
      this.lastDroppedWeapons = 0;
      this.lastDropFell = false;
      this.loadStage(0, false);
      this.state = 'playing';
      sound.sfx('ui');
    }

    loadStage(index, preserveWeapon = false){
      const keptLoadout = preserveWeapon && this.player && !this.player.dead
        ? {
            weapon: this.player.weapon,
            arsenal: this.player.arsenal.slice(),
            weaponTiers: { ...this.player.weaponTiers }
          }
        : null;
      this.stageIndex = index;
      this.stage = buildStage(index);
      this.cameraMax = Math.max(0, this.stage.width - W);
      this.enemyDefs = this.stage.enemies.map(def => ({ def: { ...def }, spawned: false }));
      this.enemies = [];
      this.props = this.stage.props.map(p => new Breakable(p));
      this.pickups = this.stage.pickups.map(p => new Pickup(p.x, p.y, p.type));
      this.playerBullets = [];
      this.enemyBullets = [];
      this.markers = [];
      this.particles = new ParticleSystem();
      this.boss = this.stage.boss ? createBoss(this.stage.boss) : null;
      this.hazards = (this.stage.hazards || []).map(h => new FieldHazard(h));
      this.lavaChase = this.stage.chase
        ? { ...this.stage.chase, active: false, done: false, x: 0, rumble: 0 }
        : null;
      this.bossActive = false;
      this.gateClosed = false;
      this.bossWarning = 0;
      this.bossPhaseWarning = 0;
      this.bossDefeatTimer = 0;
      this.bossExplosionTimer = 0;
      this.pendingGameOver = false;
      this.lastDroppedWeapons = 0;
      this.lastDropFell = false;
      this.checkpointIndex = 0;
      this.checkpoint = this.stage.checkpoints[0];
      this.player = new Player(this.stage.spawn.x, this.stage.spawn.y);
      if(keptLoadout){
        this.player.arsenal = keptLoadout.arsenal;
        this.player.weaponTiers = keptLoadout.weaponTiers;
        this.player.weapon = keptLoadout.weapon;
      }
      this.player.invuln = 2;
      this.worldTime = 0;
      this.stageRunTime = 0;
      this.stageIntro = 2.8;
      this.stageClearTimer = 0;
      this.stageClearBonus = 0;
      this.combo = 0;
      this.comboTimer = 0;
      this.comboFlash = 0;
      this.toast = null;
      this.shake = 0;
      this.flash = 0;
      this.killFlash = 0;
      this.fade = 1;
      this.gameOverTimer = 0;
      this.victoryTimer = 0;
      this.camera.x = clamp(this.player.x - W * .34, 0, this.cameraMax);
      this.state = 'playing';
      sound.setPaused(false);
      sound.setTrack(this.stage.track);
    }

    nextStage(){
      if(this.stageIndex >= 5){
        this.winGame();
        return;
      }
      this.lives = Math.min(5, this.lives + 1);
      this.loadStage(this.stageIndex + 1, true);
      this.player.invuln = 2.6;
    }

    goTitle(){
      this.finalizeBest();
      this.setupTitle();
    }

    getRunRating(){
      return rankForScore(this.score);
    }

    recordRun(){
      if(this.runRecorded) return;
      this.runRecorded = true;
      if(this.score <= 0) return;
      this.runHistory.push({
        score: this.score,
        time: Math.round(this.runTime),
        deaths: this.deaths,
        combo: this.comboBest,
        bosses: this.bossKills,
        rank: this.getRunRating()
      });
      this.runHistory.sort((a, b) => b.score - a.score || a.time - b.time);
      this.runHistory = this.runHistory.slice(0, 5);
      saveRunHistory(this.runHistory);
    }

    finalizeBest(){
      if(this.score > this.best){
        this.best = this.score;
        this.newRecord = true;
        storageSet('ironAssault.best', this.best);
      }else{
        this.newRecord = false;
      }
      this.recordRun();
    }

    pauseGame(){
      if(this.state !== 'playing' || !this.player || this.player.dead) return;
      this.state = 'paused';
      this.shake = 0;
      this.flash = 0;
      this.killFlash = 0;
      sound.setPaused(true);
      sound.sfx('ui');
    }

    resumeGame(){
      if(this.state !== 'paused') return;
      this.state = 'playing';
      sound.unlock();
      sound.setPaused(false);
      sound.sfx('ui');
    }

    showToast(text, sub, duration = 2.4, color = '#f0d7ac'){
      this.toast = { text, sub, t: 0, dur: duration, color };
    }

    addScore(n){
      this.score += Math.max(0, Math.round(n));
    }

    get comboMultiplier(){
      // Every consecutive kill adds 2% score multiplier; timeout resets combo to 0.
      return 1 + this.combo * .02;
    }

    registerKill(base){
      this.combo = this.comboTimer > 0 ? this.combo + 1 : 1;
      this.comboTimer = 2.35;
      this.comboFlash = .22;
      this.comboBest = Math.max(this.comboBest, this.combo);
      this.kills++;
      const gained = Math.round(base * this.comboMultiplier);
      this.addScore(gained);
      return gained;
    }

    update(dt){
      this.time += dt;
      this.tick(dt);
      input.clear();
    }

    tick(dt){
      if(input.wasPressed('mute')){
        const muted = sound.toggleMute();
        if(this.state === 'playing' || this.state === 'paused'){
          this.showToast(muted ? '音效已关闭' : '音效已开启', muted ? 'SOUND OFF' : 'SOUND ON', 1.2, '#9ec2b6');
        }
      }

      if(this.state === 'title'){
        this.updateTitle(dt);
        return;
      }

      if(this.state === 'playing' || this.state === 'paused'){
        if(this.state === 'playing' && input.wasPressed('pause')){
          this.pauseGame();
          return;
        }
      }

      if(this.state === 'paused'){
        if(input.wasPressed('pause') || input.wasPressed('confirm') || input.wasPressed('jump') || input.pointerPressed){
          this.resumeGame();
        }else if(input.wasPressed('quit')){
          this.goTitle();
        }
        return;
      }

      if(this.state === 'playing'){
        this.updatePlaying(dt);
        return;
      }

      if(this.state === 'stageclear'){
        this.stageClearTimer += dt;
        this.worldTime += dt;
        this.updateTimers(dt);
        this.particles.update(dt);
        if(this.player) this.player.animTime += dt;
        if(this.stageClearTimer > .7 && (input.wasPressed('confirm') || input.wasPressed('jump') || input.pointerPressed)){
          this.nextStage();
        }else if(this.stageClearTimer > 5.4){
          this.nextStage();
        }
        return;
      }

      if(this.state === 'gameover'){
        this.gameOverTimer += dt;
        this.worldTime += dt;
        this.updateTimers(dt);
        this.particles.update(dt);
        if(this.gameOverTimer > .9){
          if(input.wasPressed('confirm') || input.wasPressed('jump') || input.pointerPressed){
            this.startNewRun();
          }else if(input.wasPressed('pause') || input.wasPressed('quit')){
            this.goTitle();
          }
        }
        return;
      }

      if(this.state === 'victory'){
        this.victoryTimer += dt;
        this.worldTime += dt;
        this.updateTimers(dt);
        this.particles.update(dt);
        if(this.victoryTimer > 1.0){
          if(input.wasPressed('confirm') || input.wasPressed('jump') || input.pointerPressed){
            this.startNewRun();
          }else if(input.wasPressed('pause') || input.wasPressed('quit')){
            this.goTitle();
          }
        }
      }
    }

    updateTitle(dt){
      if(this.titleHero){
        this.titleHero.animTime += dt;
        this.titleHero.aimAngle = -2.95 + Math.sin(this.time * .55) * .025;
      }
      if(input.wasPressed('confirm') || input.wasPressed('jump') || input.pointerPressed){
        this.startNewRun();
      }
    }

    updateTimers(dt){
      this.bossWarning = Math.max(0, this.bossWarning - dt);
      this.bossPhaseWarning = Math.max(0, this.bossPhaseWarning - dt);
      this.shake = damp(this.shake, 0, 10, dt);
      if(this.shake < .05) this.shake = 0;
      this.flash = Math.max(0, this.flash - dt * 2.8);
      this.killFlash = Math.max(0, this.killFlash - dt * 10);
      this.comboFlash = Math.max(0, this.comboFlash - dt * 5);
      if(this.comboTimer > 0){
        this.comboTimer -= dt;
        if(this.comboTimer <= 0){
          this.comboTimer = 0;
          this.combo = 0;
        }
      }
      this.fade = Math.max(0, this.fade - dt * 1.7);
      if(this.toast){
        this.toast.t += dt;
        if(this.toast.t > this.toast.dur + .35) this.toast = null;
      }
    }

    updateLavaChase(dt){
      const c = this.lavaChase;
      const p = this.player;
      if(!c || c.done || !p) return;
      if(!c.active){
        if(!p.dead && !this.bossActive && p.x >= c.startX){
          c.active = true;
          c.x = Math.max(0, p.x - c.lead);
          c.rumble = 0;
          this.showToast('熔炉泄压', 'MELTDOWN // 熔岩潮汐正在逼近', 3.2, '#ff8f50');
          this.flash = Math.max(this.flash, .4);
          this.shake = Math.max(this.shake, 12);
          sound.sfx('alarm');
        }
        return;
      }
      c.x += c.speed * dt;
      if(this.bossActive || p.x >= c.endX){
        c.active = false;
        c.done = true;
        this.showToast('压力释放', 'MELTDOWN CONTAINED', 2.2, '#8fe8c8');
        sound.sfx('checkpoint');
        return;
      }
      if(!p.dead && p.invuln <= 0 && p.x - 10 < c.x + 26){
        if(this.damagePlayer(1, c.x)){
          p.x = Math.max(p.x, c.x + 58);
          p.vx = Math.max(p.vx, 210);
        }
      }
      c.rumble -= dt;
      if(c.rumble <= 0 && inView(c.x - 150, 320, this.camera.x, 100)){
        c.rumble = 1.25;
        sound.sfx('vent');
        this.shake = Math.max(this.shake, 2.6);
      }
      if(inView(c.x - 80, 160, this.camera.x, 40) && Math.random() < dt * 24){
        this.particles.spark(c.x + rand(-12, 8), rand(120, 450), pick(['#ffb15f', '#ff6f34']), 130, .5, -Math.PI / 2 + rand(-.4, .4), 1.8);
      }
    }

    updatePlaying(dt){
      this.runTime += dt;
      this.stageRunTime += dt;
      this.worldTime += dt;
      this.updateTimers(dt);
      if(this.stageIntro > 0) this.stageIntro = Math.max(0, this.stageIntro - dt);

      const controllable = this.stageIntro <= 1.55 && !this.player.dead;
      this.player.update(dt, this, controllable);

      if(this.bossActive && this.stage.arenaLeft != null){
        this.player.x = Math.max(this.player.x, this.stage.arenaLeft + 18);
        if(this.boss && !this.boss.dead){
          if(this.boss.playerMinX != null) this.player.x = Math.max(this.player.x, this.boss.playerMinX);
          const limit = this.boss.playerLimitX != null ? this.boss.playerLimitX : this.boss.x - 182;
          this.player.x = Math.min(this.player.x, limit);
        }
      }

      if(this.stageIntro <= 1.55 && !this.bossActive && this.bossDefeatTimer <= 0) this.spawnNearby();

      for(const e of this.enemies){
        if(this.stageIntro <= 1.55) e.update(dt, this);
      }
      for(const p of this.props) p.update(dt, this);
      for(const p of this.pickups) p.update(dt, this);
      for(const h of this.hazards) h.update(dt, this);
      this.updateLavaChase(dt);

      if(this.boss) this.boss.update(dt, this);

      this.updatePlayerBullets(dt);
      this.updateEnemyBullets(dt);
      this.updateMarkers(dt);

      if(!this.player.dead){
        this.updateContacts();
        this.collectPickups();
        this.updateProgress();
      }

      this.particles.update(dt);
      this.updateCamera(dt);

      if(this.player.dead && this.player.deathTimer <= 0){
        if(this.lives <= 0){
          this.enterGameOver();
          return;
        }
        this.respawnPlayer();
      }

      if(this.bossDefeatTimer > 0){
        this.updateBossDefeat(dt);
        if(this.state !== 'playing') return;
      }

      this.enemies = this.enemies.filter(e => !e.dead);
      this.props = this.props.filter(p => !p.dead);
      this.pickups = this.pickups.filter(p => !p.dead);
      this.playerBullets = this.playerBullets.filter(b => !b.dead);
      this.enemyBullets = this.enemyBullets.filter(b => !b.dead);
      this.markers = this.markers.filter(m => !m.done && m.t < m.dur + .2);
    }

    updateCamera(dt){
      let target;
      if(this.bossActive){
        const arenaX = this.stage.arenaLeft == null ? this.cameraMax : this.stage.arenaLeft - 40;
        target = Math.min(this.cameraMax, Math.max(0, arenaX));
      }else{
        target = this.player.x - W * .34 + this.player.facing * 16;
        target = clamp(target, 0, this.cameraMax);
      }
      this.camera.x = damp(this.camera.x, target, this.bossActive ? 4.2 : 5.8, dt);
      this.camera.x = clamp(this.camera.x, 0, this.cameraMax);
    }

    spawnNearby(){
      if(this.stageIntro > 1.55) return;
      const left = this.camera.x - 210;
      const right = this.camera.x + W + 160;
      for(const s of this.enemyDefs){
        if(s.spawned) continue;
        if(s.def.x >= left && s.def.x <= right){
          s.spawned = true;
          const e = new Enemy(s.def);
          e.alert = .7;
          e.fireTimer = Math.max(e.fireTimer, this.stageIntro > 0 ? this.stageIntro + .75 : 1.0);
          this.enemies.push(e);
        }
      }
    }

    activateBoss(){
      if(!this.stage.boss || !this.boss || this.boss.active) return;
      this.bossActive = true;
      this.gateClosed = true;
      this.boss.activate(this);
      this.bossWarning = 2.6;
      this.player.x = Math.max(this.player.x, this.stage.arenaLeft + 20);
      this.enemyBullets.length = 0;
      this.markers.length = 0;
      for(const e of this.enemies){
        if(!e.dead){
          e.dead = true;
          this.particles.explosion(e.x, e.y - 20, .6, '#ff9355');
        }
      }
      this.enemies.length = 0;
      this.shake = Math.max(this.shake, 10);
      this.flash = Math.max(this.flash, .22);
      this.toast = null;
      sound.setTrack(this.stage.boss.track || 'boss');
      sound.sfx('alarm');
    }

    updateProgress(){
      const p = this.player;
      if(!p) return;
      for(let i = this.checkpointIndex + 1; i < this.stage.checkpoints.length; i++){
        const cp = this.stage.checkpoints[i];
        if(p.x >= cp.x - 24){
          this.checkpointIndex = i;
          this.checkpoint = cp;
          this.showToast('检查点已更新', cp.name, 2.1, '#6ae3bb');
          sound.sfx('checkpoint');
          this.particles.add({
            type: 'ring', x: cp.x, y: cp.y - 15, r: 10,
            color: '#63e4b9', life: .6, maxLife: .6, gravity: 0
          });
        }
      }
      if(this.stage.boss && this.boss && !this.boss.active && p.x >= this.stage.bossTrigger){
        this.activateBoss();
      }
      if(Number.isFinite(this.stage.exitX) && p.x >= this.stage.exitX && this.state === 'playing'){
        this.beginStageClear();
      }
    }

    beginStageClear(){
      if(this.state !== 'playing') return;
      this.state = 'stageclear';
      this.stageClearTimer = 0;
      this.stageClearBonus = 1500 + this.player.hp * 250;
      this.addScore(this.stageClearBonus);
      this.player.vx = 0;
      this.player.vy = 0;
      this.player.invuln = 999;
      this.enemyBullets.length = 0;
      this.markers.length = 0;
      this.toast = null;
      sound.setTrack('none');
      sound.sfx('stageClear');
    }

    enterGameOver(){
      if(this.state === 'gameover') return;
      this.state = 'gameover';
      this.gameOverTimer = 0;
      this.finalizeBest();
      sound.setTrack('none');
      sound.sfx('gameOver');
    }

    winGame(){
      if(this.state === 'victory') return;
      this.state = 'victory';
      this.victoryTimer = 0;
      if(!this.timeBonusAwarded){
        this.timeRemaining = Math.max(0, Math.floor(300 - this.runTime));
        this.timeBonus = Math.min(1200, this.timeRemaining * 20);
        this.score += this.timeBonus;
        this.timeBonusAwarded = true;
      }
      this.finalizeBest();
      sound.setTrack('victory');
      this.enemyBullets.length = 0;
      this.markers.length = 0;
    }

    onBossDefeated(boss){
      this.bossKills++;
      this.addScore(8000);
      this.bossDefeatTimer = .0001;
      this.bossExplosionTimer = 0;
      this.flash = .8;
      this.shake = 22;
      this.enemyBullets.length = 0;
      this.markers.length = 0;
      this.player.invuln = 999;
      for(const e of this.enemies){
        if(!e.dead){
          e.dead = true;
          this.particles.explosion(e.x, e.y - 18, .7, '#ff9b5b');
        }
      }
      this.enemies.length = 0;
      this.showToast('核心已摧毁', `${this.boss ? this.boss.en : 'TARGET DESTROYED'}`, 3.0, '#ffc267');
      sound.setTrack('none');
      sound.sfx('explosion');
    }

    updateBossDefeat(dt){
      this.bossDefeatTimer += dt;
      this.bossExplosionTimer -= dt;
      if(this.bossExplosionTimer <= 0){
        this.bossExplosionTimer = rand(.13, .27);
        const bx = this.boss.x + rand(-135, 130);
        const by = this.boss.y - rand(30, 340);
        this.particles.explosion(bx, by, rand(.6, 1.5), pick(['#ff8c4d', '#ffb463', '#ff6f3c']));
        this.shake = Math.max(this.shake, rand(5, 12));
        this.flash = Math.max(this.flash, .1);
        sound.sfx('explosion');
      }
      if(this.bossDefeatTimer > 3.0){
        if(this.stageIndex >= 5){
          this.winGame();
        }else{
          this.bossDefeatTimer = 0;
          this.beginStageClear();
        }
      }
    }

    damagePlayer(amount = 1, sourceX = null){
      const p = this.player;
      if(!p || p.dead || p.invuln > 0 || this.state !== 'playing') return false;
      p.hp -= amount;
      p.invuln = 1.5;
      this.combo = 0;
      this.comboTimer = 0;
      this.flash = Math.max(this.flash, .28);
      this.shake = Math.max(this.shake, 9);
      sound.sfx('hurt');
      this.particles.hit(p.x, p.centerY, '#ff9d75', 10, 280);
      if(sourceX != null){
        p.vx = sign(p.x - sourceX) * 220;
        if(p.onGround) p.vy = -220;
      }
      if(p.hp <= 0){
        p.hp = 0;
        this.killPlayer('damage');
        return true;
      }
      return true;
    }

    dropWeaponsOnDeath(fromFall = false){
      const p = this.player;
      if(!p) return 0;
      const lost = p.arsenal.filter(w => w !== 'rifle');
      if(!lost.length) return 0;
      if(fromFall){
        // Falling out of the level loses the weapons permanently.
        // Keep a short non-collectible falling visual, but never spawn a pickup.
        const spacing = 40;
        const total = (lost.length - 1) * spacing;
        const startX = clamp(p.x - total / 2, 42, this.stage.width - 42 - total);
        const startY = Math.min(H - 80, p.y - 28);
        for(let i = 0; i < lost.length; i++){
          const w = lost[i];
          const item = new Pickup(startX + i * spacing, startY, w, true, p.weaponTiers[w] || 0, 1.4);
          item.lost = true;
          item.noCollect = true;
          item.vy = 60;
          this.pickups.push(item);
          this.particles.add({
            type: 'ring', x: item.x, y: item.baseY, r: 7,
            color: PICKUP_INFO[w].color, life: .3, maxLife: .3, gravity: 0
          });
        }
        return lost.length;
      }
      let best = null;
      for(const seg of this.stage.ground){
        const minX = seg.x + 34;
        const maxX = seg.x + seg.w - 34;
        const clamped = clamp(p.x, minX, maxX);
        const distance = Math.abs(clamped - p.x);
        if(!best || distance < best.distance) best = { distance, x: clamped, y: seg.y };
      }
      if(!best) best = { x: p.x, y: p.y };
      const spacing = 46;
      const total = (lost.length - 1) * spacing;
      let startX = clamp(best.x - total / 2, 42, this.stage.width - 42 - total);
      const dropY = best.y - 28;
      for(let i = 0; i < lost.length; i++){
        const w = lost[i];
        const item = new Pickup(startX + i * spacing, dropY, w, true, p.weaponTiers[w] || 0, 70);
        this.pickups.push(item);
        this.particles.add({
          type: 'ring', x: item.x, y: item.baseY, r: 7,
          color: PICKUP_INFO[w].color, life: .35, maxLife: .35, gravity: 0
        });
      }
      return lost.length;
    }

    killPlayer(cause = 'damage'){
      const p = this.player;
      if(!p || p.dead) return;
      this.lastDropFell = cause === 'fall';
      this.lastDroppedWeapons = this.dropWeaponsOnDeath(this.lastDropFell);
      p.dead = true;
      p.deathTimer = 1.45;
      p.deathCause = cause;
      p.vx = 0;
      p.vy = 0;
      this.lives--;
      this.deaths++;
      this.pendingGameOver = this.lives <= 0;
      this.enemyBullets.length = 0;
      this.markers.length = 0;
      if(this.boss){
        this.boss.action = null;
        this.boss.eyeGlow = 0;
        this.boss.cd = Math.max(this.boss.cd, 1.4);
      }
      if(cause !== 'fall'){
        this.particles.explosion(p.x, p.centerY, 1.25, '#ff8251');
        sound.sfx('explosion');
      }
      this.flash = Math.max(this.flash, .4);
      this.shake = Math.max(this.shake, 13);
      this.toast = null;
    }

    respawnPlayer(){
      const p = this.player;
      const cp = this.checkpoint || this.stage.spawn;
      p.resetAt(cp.x, cp.y);
      p.invuln = 2.8;
      this.enemyBullets.length = 0;
      this.markers.length = 0;
      if(this.lavaChase){
        this.lavaChase.active = false;
        this.lavaChase.done = this.checkpointIndex >= this.stage.checkpoints.length - 1;
        this.lavaChase.x = 0;
        this.lavaChase.rumble = 0;
      }
      this.particles.add({
        type: 'ring', x: p.x, y: p.y - 22, r: 8,
        color: '#6fe7c3', life: .65, maxLife: .65, gravity: 0
      });
      for(let i = 0; i < 10; i++) this.particles.spark(p.x, p.y - 24, '#88f5d0', 140, .45, null, 1.4);
      if(this.boss){
        this.boss.action = null;
        this.boss.eyeGlow = 0;
        if(typeof this.boss.resetAfterPlayerDeath === 'function') this.boss.resetAfterPlayerDeath();
        if(this.boss.active && !this.boss.dead) this.boss.cd = Math.max(1.8, this.boss.cd);
      }
      if(this.bossActive){
        this.camera.x = Math.min(this.cameraMax, Math.max(0, this.stage.arenaLeft - 40));
      }else{
        this.camera.x = clamp(cp.x - W * .34, 0, this.cameraMax);
      }
      this.pendingGameOver = false;
      const lost = this.lastDroppedWeapons;
      const fell = this.lastDropFell;
      this.lastDroppedWeapons = 0;
      this.lastDropFell = false;
      const lostText = fell
        ? `武器坠入深渊 ${lost} 件  ·  无法回收`
        : `武器已掉落 ${lost} 件  ·  返回拾取`;
      this.showToast(
        '重新部署',
        lost > 0 ? lostText : 'REDEPLOYING // ARMOR RESTORED',
        2.8,
        lost > 0 ? (fell ? '#ff8a66' : '#ffd27a') : '#63e6c3'
      );
      sound.sfx('checkpoint');
    }

    findSurface(p, prevFeet){
      let best = null;
      const half = p.w * .34;
      for(const seg of this.stage.ground){
        if(p.x + half < seg.x || p.x - half > seg.x + seg.w) continue;
        if(prevFeet <= seg.y + 7 && p.y >= seg.y){
          if(!best || seg.y < best.y) best = { y: seg.y, platform: false, ref: null };
        }
      }
      if(p.dropTimer <= 0){
        for(const plat of this.stage.platforms){
          if(p.x + half < plat.x || p.x - half > plat.x + plat.w) continue;
          if(prevFeet <= plat.y + 7 && p.y >= plat.y){
            if(!best || plat.y < best.y) best = { y: plat.y, platform: true, ref: plat };
          }
        }
      }
      return best;
    }

    bulletHitsTerrain(x, y){
      for(const seg of this.stage.ground){
        if(x >= seg.x && x <= seg.x + seg.w && y >= seg.y - 1) return true;
      }
      for(const p of this.stage.platforms){
        if(x >= p.x && x <= p.x + p.w && y >= p.y - 1 && y <= p.y + p.h + 1) return true;
      }
      return false;
    }

    bulletHitsGround(x, y){
      for(const seg of this.stage.ground){
        if(x >= seg.x && x <= seg.x + seg.w && y >= seg.y - 1) return true;
      }
      return false;
    }

    playerBulletHitsTerrain(x, y){
      for(const seg of this.stage.ground){
        if(x >= seg.x && x <= seg.x + seg.w && y >= seg.y - 1) return true;
      }
      return false;
    }

    isGroundAt(x){
      for(const seg of this.stage.ground){
        if(x > seg.x + 13 && x < seg.x + seg.w - 13) return true;
      }
      return false;
    }

    updatePlayerBullets(dt){
      for(const b of this.playerBullets){
        if(b.dead) continue;
        b.update(dt, this);
        if(b.dead) continue;
        // Props
        for(const p of this.props){
          if(p.dead) continue;
          const bb = p.bounds;
          if(circleRect(b.x, b.y, b.r, bb.x, bb.y, bb.w, bb.h)){
            p.hit(this, b.damage);
            b.pierce--;
            if(b.pierce < 0) b.dead = true;
            if(b.dead) break;
          }
        }
        if(b.dead) continue;
        // Enemies
        for(const e of this.enemies){
          if(e.dead) continue;
          if(b.hitIds && b.hitIds.has(e)) continue;
          const bb = e.bounds;
          if(circleRect(b.x, b.y, b.r, bb.x, bb.y, bb.w, bb.h)){
            if(b.hitIds) b.hitIds.add(e);
            let hitDamage = b.damage;
            if(b.antiShield) hitDamage *= e.type === 'shield' ? 1 : .9;
            e.hit(this, hitDamage, b.x, b.y, b);
            b.pierce--;
            if(b.pierce < 0){ b.dead = true; break; }
          }
        }
        if(b.dead) continue;
        // Boss shield nodes are separate targets and expose the core when both fall.
        if(this.boss && this.boss.active && !this.boss.dead && this.boss.nodes){
          for(const n of this.boss.nodes){
            if(n.dead || b.hitIds.has(n)) continue;
            if(dist2(b.x, b.y, n.x, n.y) < (n.r + b.r) ** 2){
              b.hitIds.add(n);
              this.boss.hitNode(this, n, b.damage, b.x, b.y, b);
            }
          }
        }
        // Boss
        if(this.boss && this.boss.active && !this.boss.dead){
          if(this.boss.coreLocked){
            const shieldBox = this.boss.bounds;
            if(!b.hitIds.has('boss-shield') &&
              circleRect(b.x, b.y, b.r, shieldBox.x, shieldBox.y, shieldBox.w, shieldBox.h)){
              b.hitIds.add('boss-shield');
              if(typeof this.boss.shieldHit === 'function') this.boss.shieldHit(this, b.x, b.y);
            }
            continue;
          }
          const core = this.boss.core;
          let hitSomething = false;
          const bossDamage = b.antiShield ? b.damage * .9 : b.damage;
          if(!b.hitIds.has('boss-core') && dist2(b.x, b.y, core.x, core.y) < (core.r + b.r) ** 2){
            b.hitIds.add('boss-core');
            this.boss.hit(this, bossDamage, true, b.x, b.y, b);
            b.pierce--;
            hitSomething = true;
            if(b.pierce < 0){ b.dead = true; }
          }
          if(!b.dead && !b.hitIds.has('boss-body')){
            const bb = this.boss.bounds;
            if(circleRect(b.x, b.y, b.r, bb.x, bb.y, bb.w, bb.h)){
              b.hitIds.add('boss-body');
              this.boss.hit(this, bossDamage, false, b.x, b.y, b);
              b.pierce--;
              hitSomething = true;
              if(b.pierce < 0) b.dead = true;
            }
          }
          if(hitSomething && b.dead) continue;
        }
      }
    }

    updateEnemyBullets(dt){
      const p = this.player;
      for(const b of this.enemyBullets){
        if(b.dead) continue;
        b.update(dt, this);
        if(b.dead) continue;
        if(p.dead) continue;
        const hb = p.hurtbox;
        if(circleRect(b.x, b.y, b.r, hb.x, hb.y, hb.w, hb.h)){
          b.dead = true;
          this.damagePlayer(1, b.x);
        }
      }
    }

    updateMarkers(dt){
      for(const m of this.markers){
        if(m.done) continue;
        m.t += dt;
        if(m.t >= m.dur) m.done = true;
      }
    }

    updateContacts(){
      const p = this.player;
      if(!p || p.dead || p.invuln > 0) return;
      const hb = p.hurtbox;
      for(const e of this.enemies){
        if(e.dead) continue;
        const bb = e.bounds;
        if(hb.x < bb.x + bb.w && hb.x + hb.w > bb.x && hb.y < bb.y + bb.h && hb.y + hb.h > bb.y){
          this.damagePlayer(1, e.x);
          return;
        }
      }
      if(this.boss && this.boss.active && !this.boss.dead){
        const bb = this.boss.bounds;
        if(hb.x < bb.x + bb.w && hb.x + hb.w > bb.x && hb.y < bb.y + bb.h && hb.y + hb.h > bb.y){
          this.damagePlayer(1, this.boss.x);
        }
      }
    }

    collectPickups(){
      const p = this.player;
      if(!p || p.dead) return;
      for(const item of this.pickups){
        if(item.dead || item.noCollect) continue;
        if(dist2(p.x, p.centerY, item.x, item.drawY) < 40 * 40){
          item.dead = true;
          this.particles.add({
            type: 'ring', x: item.x, y: item.drawY, r: 14,
            color: item.info.color, life: .45, maxLife: .45, gravity: 0
          });
          sound.sfx('pickup');
          if(item.type === 'health'){
            if(p.hp < p.maxHp){
              p.hp = Math.min(p.maxHp, p.hp + 2);
              this.showToast('装甲修复 +2', 'ARMOR CELL ACQUIRED', 2, '#63e6a8');
            }else{
              this.addScore(300);
              this.showToast('装甲已满  +300', 'ARMOR AT MAXIMUM', 1.8, '#63e6a8');
            }
          }else if(item.type === 'medal'){
            this.addScore(750);
            this.showToast('战功勋章  +750', 'WAR MEDAL ACQUIRED', 2, '#ffd66e');
          }else{
            const w = item.type;
            const info = PICKUP_INFO[w];
            const pickupTier = item.tier || 0;
            let newTier = 0;
            let leveled = false;
            if(!p.arsenal.includes(w)){
              p.arsenal.push(w);
              newTier = pickupTier;
              p.weaponTiers[w] = newTier;
              p.weapon = w;
              p.burstQueue.length = 0;
              p.cooldown = 0;
              leveled = newTier > 0;
            }else{
              const current = p.weaponTiers[w] || 0;
              if(pickupTier > current) newTier = Math.min(3, pickupTier);
              else if(current < 3) newTier = current + 1;
              else newTier = 3;
              if(newTier > current){
                p.weaponTiers[w] = newTier;
                p.weapon = w;
                p.burstQueue.length = 0;
                p.cooldown = 0;
                leveled = true;
              }
            }
            this.addScore(80);
            if(leveled && newTier > 0){
              this.showToast(`${info.name}  强化 +${newTier}`, `${weaponTierEffect(w, newTier)}  ·  1-4 切换`, 2.8, info.color);
            }else if(p.weaponTiers[w] >= 3){
              this.addScore(200);
              this.showToast(`${info.name} 已满级`, '+200  ·  重复补给已回收', 2.1, info.color);
            }else{
              const passive = w === 'laser' ? '  ·  对护盾满伤 / 对无盾 -10%' : '';
              this.showToast(`获得 ${info.name}`, info.en + ' ONLINE' + passive + '  ·  1-4 切换', 2.4, info.color);
            }
          }
        }
      }
    }

    breakCrate(prop){
      this.addScore(40);
      this.particles.explosion(prop.x, prop.y - 18, .65, '#e5bf7a');
      this.particles.add({
        type: 'debris', x: prop.x, y: prop.y - 18, vx: rand(-80, 80), vy: rand(-180, -60),
        gravity: 700, life: .7, color: '#6f6042', w: 5, h: 4, rot: 0, vr: 8, drag: .2
      });
      sound.sfx('enemyDie');
      let drop;
      const roll = Math.random();
      if(roll < .4) drop = 'health';
      else if(roll < .8) drop = pick(WEAPON_DROPS);
      else drop = 'medal';
      this.pickups.push(new Pickup(prop.x, prop.y - 28, drop, true));
    }

    explodeBarrel(prop){
      this.addScore(60);
      this.particles.explosion(prop.x, prop.y - 18, 1.55, '#ff8b4a');
      this.shake = Math.max(this.shake, 10);
      this.flash = Math.max(this.flash, .13);
      sound.sfx('explosion');
      const px = prop.x, py = prop.y - 20;
      for(const e of this.enemies){
        if(e.dead) continue;
        if(dist2(e.x, e.y - 18, px, py) < 118 * 118) e.hit(this, 4, e.x, e.y - 18);
      }
      if(this.boss && this.boss.active && !this.boss.dead){
        const bb = this.boss.bounds;
        if(px > bb.x - 110 && px < bb.x + bb.w && py > bb.y && py < bb.y + bb.h + 80){
          this.boss.hit(this, 6, false, px, py);
        }
      }
      if(this.player && !this.player.dead && dist2(this.player.x, this.player.centerY, px, py) < 115 * 115){
        this.damagePlayer(1, px);
      }
      for(const other of this.props.slice()){
        if(other === prop || other.dead) continue;
        if(dist2(other.x, other.y - 15, px, py) < 125 * 125){
          other.hit(this, 99);
        }
      }
    }
  }

  /* =========================================================
     UI HELPERS

  function drawSpacedText(g, text, x, y, spacing, font, color, align = 'left'){
    g.save();
    g.font = font;
    g.textBaseline = 'alphabetic';
    g.textAlign = 'left';
    g.fillStyle = color;
    const chars = Array.from(text);
    const widths = chars.map(c => g.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + spacing * Math.max(0, chars.length - 1);
    let cx = align === 'center' ? x - total / 2 : (align === 'right' ? x - total : x);
    for(let i = 0; i < chars.length; i++){
      g.fillText(chars[i], cx, y);
      cx += widths[i] + spacing;
    }
    g.restore();
    return total;
  }

  function drawHudFrame(g, x, y, w, h, cut = 9, alpha = .7, accent = null){
    g.save();
    cutCornerRect(g, x, y, w, h, cut);
    g.fillStyle = `rgba(4,9,10,${alpha})`;
    g.fill();
    g.strokeStyle = 'rgba(205,177,139,.18)';
    g.lineWidth = 1;
    g.stroke();
    g.fillStyle = accent || 'rgba(255,109,58,.7)';
    g.fillRect(x, y + 2, 2, h - 4);
    g.fillStyle = 'rgba(255,230,196,.07)';
    g.fillRect(x + 10, y + 1, w - 24, 1);
    g.restore();
  }

  function drawKeycap(g, label, x, y, font = `700 9px ${FONT_MONO}`){
    g.save();
    g.font = font;
    const tw = g.measureText(label).width;
    const w = Math.max(18, tw + 10);
    g.fillStyle = 'rgba(230,217,190,.08)';
    roundRect(g, x, y - 10, w, 16, 3);
    g.fill();
    g.strokeStyle = 'rgba(229,212,181,.22)';
    g.lineWidth = 1;
    g.stroke();
    g.fillStyle = 'rgba(245,231,207,.72)';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(label, x + w / 2, y - 1.5);
    g.restore();
    return w;
  }

  function drawControlChip(g, keys, label, x, y){
    let cx = x;
    for(const k of keys){
      const w = drawKeycap(g, k, cx, y);
      cx += w + 3;
    }
    g.fillStyle = 'rgba(222,211,190,.5)';
    g.font = `500 10px ${FONT_CN}`;
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillText(label, cx + 5, y - 1.5);
    return cx + 5 + g.measureText(label).width;
  }

  function formatTime(seconds){
    const s = Math.max(0, Math.floor(seconds));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }

  function stageProgress(stage, player){
    if(!player) return 0;
    if(stage.index === 0) return clamp((player.x - stage.spawn.x) / (stage.exitX - stage.spawn.x), 0, 1);
    return clamp((player.x - stage.spawn.x) / (stage.bossTrigger - stage.spawn.x), 0, 1);
  }

  function drawMissileMarkers(game){
    const g = ctx;
    for(const m of game.markers){
      if(!m.missileWarning || m.done) continue;
      if(!inView(m.x - 40, 80, game.camera.x, 80)) continue;
      const p = clamp(m.t / m.dur, 0, 1);
      const urgency = Math.sin((m.t + .1) * (p > .65 ? 28 : 13)) > 0 ? 1 : .55;
      g.save();
      g.translate(m.x, m.y);
      const alpha = .5 + p * .4;
      // Darken the ground so the warning reads against orange terrain
      g.fillStyle = 'rgba(8,5,4,.32)';
      g.beginPath();
      g.ellipse(0, 0, 35 + p * 20, 10 + p * 4, 0, 0, TAU);
      g.fill();
      // Bright landing ring
      g.strokeStyle = `rgba(255,221,151,${alpha})`;
      g.lineWidth = 2.4;
      g.beginPath();
      g.ellipse(0, 0, 18 + p * 18, 5 + p * 3, 0, 0, TAU);
      g.stroke();
      g.strokeStyle = `rgba(255,110,58,${alpha * .55})`;
      g.lineWidth = 1.2;
      g.setLineDash([4, 6]);
      g.beginPath();
      g.ellipse(0, 0, 30 + p * 18, 8 + p * 3, 0, 0, TAU);
      g.stroke();
      g.setLineDash([]);
      // Incoming beam / chevrons
      const beam = g.createLinearGradient(0, -105, 0, 0);
      beam.addColorStop(0, 'rgba(255,102,54,0)');
      beam.addColorStop(.6, `rgba(255,113,58,${.08 + p * .12})`);
      beam.addColorStop(1, `rgba(255,187,108,${.2 + p * .12})`);
      g.fillStyle = beam;
      g.fillRect(-5, -105, 10, 105);
      g.strokeStyle = `rgba(255,211,140,${.6 + p * .3})`;
      g.lineWidth = 1.4;
      for(let k = 0; k < 2; k++){
        const yy = -18 - k * 11 - p * 10;
        g.beginPath();
        g.moveTo(-8, yy);
        g.lineTo(0, yy - 9);
        g.lineTo(8, yy);
        g.stroke();
      }
      g.fillStyle = `rgba(255,217,146,${.85})`;
      g.font = `900 11px ${FONT_MONO}`;
      g.textAlign = 'center';
      g.fillText('!', 0, -55 - p * 12);
      g.restore();
    }
  }

  function drawWeather(stage, camX, t, game){
    const g = ctx;
    if(stage.theme === 'jungle'){
      g.save();
      g.globalCompositeOperation = 'lighter';
      for(let i = 0; i < 34; i++){
        const bx = ((hash(i * 5.1) * (W + 180) - camX * .24 + Math.sin(t * .22 + i * 2.3) * 26) % (W + 180) + W + 180) % (W + 180) - 90;
        const by = 155 + hash(i * 2.7 + 6) * 310 + Math.sin(t * .8 + i * 1.9) * 10;
        const blink = Math.max(0, Math.sin(t * (.55 + hash(i + 4) * 1.4) + i * 3.1));
        if(blink < .12) continue;
        g.fillStyle = `rgba(255,219,124,${.07 + blink * .17})`;
        g.beginPath();
        g.arc(bx, by, .8 + blink * 1.2, 0, TAU);
        g.fill();
        if(i % 7 === 0){
          glowCircle(g, bx, by, 15, '#ffd57b', blink * .08);
        }
      }
      g.restore();
      // Drifting leaves
      for(let i = 0; i < 11; i++){
        const speed = 9 + hash(i + 2) * 15;
        const lx = ((hash(i * 3.7) * W - t * speed - camX * .36) % (W + 90) + W + 90) % (W + 90) - 45;
        const ly = ((hash(i * 8.1 + 3) * H + t * (8 + hash(i) * 13)) % (H + 40)) - 20;
        const rot = t * (.9 + hash(i) * 1.2) + i;
        g.save();
        g.translate(lx, ly);
        g.rotate(rot);
        g.fillStyle = `rgba(102,119,65,${.12 + hash(i) * .1})`;
        g.beginPath();
        g.ellipse(0, 0, 4 + hash(i + 8) * 3, 1.2, 0, 0, TAU);
        g.fill();
        g.restore();
      }
    }else if(stage.theme === 'sky'){
      // Driving storm rain
      g.save();
      g.strokeStyle = 'rgba(163,208,221,.16)';
      g.lineWidth = 1;
      for(let i = 0; i < 74; i++){
        const speedY = 420 + hash(i + 2) * 300;
        const sx = ((hash(i * 1.9) * (W + 180) - t * 150 - camX * .18 + speedY * .12) % (W + 180) + W + 180) % (W + 180) - 90;
        const sy = ((hash(i * 3.4 + 7) * H + t * speedY) % (H + 60)) - 30;
        g.beginPath();
        g.moveTo(sx, sy);
        g.lineTo(sx - 7, sy + 17 + hash(i) * 13);
        g.stroke();
      }
      g.restore();
      // Lightning sheet flash
      const storm = Math.max(0, Math.sin(t * .37 + 2.1) - .94) / .06;
      if(storm > 0){
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.fillStyle = `rgba(142,206,235,${storm * .055})`;
        g.fillRect(0, 0, W, H);
        g.strokeStyle = `rgba(190,238,255,${storm * .35})`;
        g.lineWidth = 1.4;
        let bx = 620 - camX * .03;
        g.beginPath();
        g.moveTo(bx, 25);
        for(let i = 0; i < 6; i++){
          bx += (hash(i + 45) - .5) * 42;
          g.lineTo(bx, 25 + i * 30);
        }
        g.stroke();
        g.restore();
      }
      // Sea spray wisps
      g.save();
      g.globalCompositeOperation = 'lighter';
      for(let i = 0; i < 7; i++){
        const wx = ((hash(i * 6.1) * W - camX * .22 + t * (8 + hash(i) * 8)) % (W + 100) + W + 100) % (W + 100) - 50;
        const wy = 360 + hash(i + 4) * 90;
        g.fillStyle = 'rgba(181,215,218,.035)';
        g.beginPath();
        g.ellipse(wx, wy, 75 + hash(i) * 70, 8, 0, 0, TAU);
        g.fill();
      }
      g.restore();
    }else if(stage.theme === 'snow'){
      // Snowfall, with wind gusts that bend the flakes sideways.
      const gust = Math.sin(t * .35) * .9;
      for(let i = 0; i < 76; i++){
        const fall = 32 + hash(i + 4) * 48;
        const sx = ((hash(i * 2.3) * (W + 120) - t * (20 + fall * .3) + Math.sin(t * .7 + i) * 26 - camX * .12) % (W + 120) + W + 120) % (W + 120) - 60;
        const sy = ((hash(i * 4.7 + 9) * (H + 40) + t * fall) % (H + 60)) - 30;
        const drift = gust * (6 + hash(i) * 14);
        g.fillStyle = `rgba(232,246,250,${.18 + hash(i + 3) * .38})`;
        g.beginPath();
        g.arc(sx + drift, sy, .8 + hash(i) * 1.7, 0, TAU);

      }
      g.save();
      g.globalCompositeOperation = 'lighter';
      for(let i = 0; i < 12; i++){
        const x = ((hash(i * 5.1) * W - camX * .1 + t * 12) % W + W) % W;
        const y = 390 + hash(i + 6) * 80;
        g.fillStyle = 'rgba(197,224,231,.035)';
        g.beginPath();
        g.ellipse(x, y, 60 + hash(i) * 80, 4, 0, 0, TAU);
        g.fill();
      }
      g.restore();
    }else if(stage.theme === 'desert'){
      // Dust devils and heat shimmer
      for(let i = 0; i < 44; i++){
        const speed = 15 + hash(i + 2) * 28;
        const x = ((hash(i * 3.1) * (W + 100) + t * speed - camX * .14) % (W + 100) + W + 100) % (W + 100) - 50;
        const y = 280 + hash(i * 5.3 + 7) * 220 + Math.sin(t * .8 + i) * 9;

        g.ellipse(x, y, 9 + hash(i) * 25, 1.5 + hash(i) * 2.5, 0, 0, TAU);

      g.save();
      g.globalCompositeOperation = 'lighter';
      for(let i = 0; i < 8; i++){

        const y = 450 + hash(i + 5) * 60;
        glowCircle(g, x, y, 70, '#ff9b5a', .035);
      }
      g.restore();
    }else{
      // Falling ash
      for(let i = 0; i < 58; i++){
        const speedY = 10 + hash(i + 5) * 26;
        const sx = ((hash(i * 1.7) * W + Math.sin(t * .3 + i) * 20 - camX * .08 + t * 5) % (W + 60) + W + 60) % (W + 60) - 30;
        const sy = ((hash(i * 2.9 + 4) * (H + 40) + t * speedY) % (H + 40)) - 20;
        g.fillStyle = `rgba(183,172,158,${.06 + hash(i + 7) * .12})`;
        g.fillRect(sx, sy, .8 + hash(i) * 1.7, .8 + hash(i + 2) * 1.3);
      }
      g.save();
      g.globalCompositeOperation = 'lighter';
      for(let i = 0; i < 18; i++){
        const sx = ((hash(i * 3.3 + 4) * W + Math.sin(t * .5 + i) * 14 - camX * .1) % (W + 80) + W + 80) % (W + 80) - 40;
        const sy = H - ((hash(i * 7.3) * 150 + t * (18 + hash(i) * 28)) % 170);
        const flick = .25 + Math.max(0, Math.sin(t * 1.3 + i)) * .55;
        g.fillStyle = `rgba(255,113,56,${flick * .35})`;
        g.fillRect(sx, sy, 1.2, 2 + hash(i) * 2);
        if(i % 5 === 0) glowCircle(g, sx, sy, 10, '#ff6537', flick * .08);
      }
      g.restore();
      // Low drifting smoke
      g.fillStyle = 'rgba(116,103,94,.025)';
      for(let i = 0; i < 4; i++){
        const sx = ((i * 270 + t * 7) % 1150) - 60;
        g.beginPath();
        g.ellipse(sx, 510 + Math.sin(t * .2 + i) * 8, 180, 18, 0, 0, TAU);
        g.fill();
      }
    }
  }

  function drawBossWarning(game){
    const g = ctx;
    if(game.bossWarning <= 0) return;
    const elapsed = 2.6 - game.bossWarning;
    const alpha = clamp(Math.min(elapsed / .18, game.bossWarning / .5), 0, 1);
    const flicker = Math.sin(game.time * 19) > -.55 ? 1 : .35;
    g.save();
    g.globalAlpha = alpha;
    g.fillStyle = 'rgba(2,5,7,.3)';
    g.fillRect(0, 0, W, H);
    // Warning bands
    const bandH = 48;
    for(const y of [0, H - bandH]){
      const grad = g.createLinearGradient(0, y, 0, y + bandH);
      grad.addColorStop(0, 'rgba(80,13,8,.86)');
      grad.addColorStop(1, 'rgba(10,5,5,.9)');
      g.fillStyle = grad;
      g.fillRect(0, y, W, bandH);
      g.fillStyle = `rgba(255,94,52,${.5 * flicker})`;
      g.fillRect(0, y === 0 ? bandH - 2 : y, W, 2);
      // stripes
      g.save();
      g.beginPath();
      g.rect(0, y, W, bandH);
      g.clip();
      for(let x = -80; x < W + 80; x += 44){
        g.fillStyle = 'rgba(0,0,0,.27)';
        g.beginPath();
        g.moveTo(x, y + bandH);
        g.lineTo(x + 17, y + bandH);
        g.lineTo(x + 43, y);
        g.lineTo(x + 26, y);
        g.closePath();
        g.fill();
      }
      g.restore();
    }
    drawSpacedText(g, 'WARNING', W / 2, 28, 7, `900 16px ${FONT_MONO}`, `rgba(255,203,158,${.82 * flicker})`, 'center');
    drawSpacedText(g, '禁区封锁 // 重型攻城机接近', W / 2, H - 19, 3, `700 13px ${FONT_CN}`, 'rgba(255,190,148,.72)', 'center');

    // Central alert
    const cy = H * .38;
    g.save();
    g.globalCompositeOperation = 'lighter';
    glowCircle(g, W / 2, cy + 3, 210, '#ff5d2d', .08);
    g.restore();
    g.save();
    g.globalAlpha = alpha * (.55 + flicker * .2);
    g.strokeStyle = 'rgba(255,101,57,.55)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(W / 2 - 250, cy + 34);
    g.lineTo(W / 2 + 250, cy + 34);
    g.stroke();
    g.restore();
    g.save();
    g.globalAlpha = alpha;
    g.font = `900 48px ${FONT_DISPLAY}`;
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    g.fillStyle = 'rgba(23,4,3,.7)';
    g.fillText('WARNING', W / 2 + 5, cy + 13);
    g.fillStyle = flicker > .6 ? '#ffb071' : '#e97b4e';
    g.fillText('WARNING', W / 2, cy + 8);
    g.fillStyle = 'rgba(255,105,61,.55)';
    g.font = `700 11px ${FONT_CN}`;
    g.fillText('高 危 能 量 反 应', W / 2, cy + 31);
    g.restore();
    g.restore();
  }
